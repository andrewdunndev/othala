# glauth.cfg — wires glauth to the embedded kratos backend.
#
# This is the file mounted into the container at /etc/glauth/glauth.cfg.
# Secrets (admin_token) injected from environment via the env-var driver
# below; never write secrets directly into this file.

debug = false

[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = true
  listen = "0.0.0.0:636"
  cert = "/etc/glauth/tls/cert.pem"
  key = "/etc/glauth/tls/key.pem"

[backend]
  datastore = "plugin"
  plugin = "kratos"
  baseDN = "dc=dunn,dc=dev"

[backend.kratos]
  public_url = "http://kratos:4433"
  admin_url = "http://kratos:4434"
  # Read identity-read-only token from this env var at startup.
  admin_token_env = "KRATOS_BRIDGE_ADMIN_TOKEN"
  base_dn = "dc=dunn,dc=dev"
  identity_cache_ttl = "30s"
  bind_cache_ttl = "30s"

[behaviors]
  # Don't allow MOD/ADD/DEL operations through LDAP — identities are
  # admin-managed via Kratos admin API only.
  IgnoreCapabilities = false
