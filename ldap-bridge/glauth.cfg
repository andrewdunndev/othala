# glauth-kratos config.
#
# This file is mounted into the container at /etc/glauth/glauth.cfg.
# Secrets (the admin token) are referenced by env-var name with the
# `*_env` keys; never put the token value here.

debug = false

[ldap]
  enabled = false
  listen = "127.0.0.1:389"

[ldaps]
  enabled = true
  listen = "0.0.0.0:636"
  cert = "/etc/glauth/tls/cert.pem"
  key  = "/etc/glauth/tls/key.pem"

[backend]
  baseDN = "dc=dunn,dc=dev"

[backend.kratos]
  public_url         = "http://kratos:4433"
  admin_url          = "http://kratos:4434"
  admin_token_env    = "KRATOS_BRIDGE_ADMIN_TOKEN"
  base_dn            = "dc=dunn,dc=dev"
  identity_cache_ttl = "30s"
  bind_cache_ttl     = "30s"
