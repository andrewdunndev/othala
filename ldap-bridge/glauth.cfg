# glauth-kratos config.
#
# This file is mounted into the container at /etc/glauth/glauth.cfg.
# Secrets (the admin token) are referenced by env-var name with the
# `*_env` keys; never put the token value here.

debug = false

[ldap]
  enabled = false
  listen = "127.0.0.1:389"

[ldaps]
  enabled = true
  listen = "0.0.0.0:636"
  cert = "/etc/glauth/tls/cert.pem"
  key  = "/etc/glauth/tls/key.pem"

[backend]
  baseDN = ""

[backend.kratos]
  # URLs come from env so the same file lands in both topologies.
  # Lab compose sets KRATOS_PUBLIC_URL=http://kratos:4433 (compose
  # service name); iac quadlets set KRATOS_PUBLIC_URL=http://auth-kratos:4433
  # (container name on the auth.network). Same shape as admin_token_env.
  public_url_env     = "KRATOS_PUBLIC_URL"
  admin_url_env      = "KRATOS_ADMIN_URL"
  admin_token_env    = "KRATOS_BRIDGE_ADMIN_TOKEN"
  base_dn_env        = "LDAP_BASE_DN"
  identity_cache_ttl = "30s"
  bind_cache_ttl     = "30s"

  # Read-only service bind for non-OAuth LDAP clients (e.g. Jellyfin on
  # Apple TV) to search the directory. NOT a Kratos identity — humans are
  # managed only in Ory. Full bind DN via env (topology-neutral); password
  # via env; never inline either.
  service_bind_dn_env       = "LDAP_SERVICE_BIND_DN"
  service_bind_password_env = "LDAP_SERVICE_BIND_PASSWORD"
