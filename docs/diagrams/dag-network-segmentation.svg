<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#333"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1a7a3a"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b03030"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>
  <text x="560" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">dag — two named podman networks, one trust domain split into two planes</text>
  <text x="560" y="50" text-anchor="middle" font-size="13" fill="#555">no pod · per-container UserNS=keep-id preserved · raw Ory admin APIs reachable only on the internal plane</text>

  <!-- actors -->
  <rect x="120" y="72" width="220" height="40" rx="6" fill="#eef3fb" stroke="#4a78c0"/>
  <text x="230" y="89" text-anchor="middle" font-size="12.5" fill="#222">Operator browser</text>
  <text x="230" y="104" text-anchor="middle" font-size="11.5" fill="#555">admin-a / admin-b</text>
  <rect x="370" y="72" width="220" height="40" rx="6" fill="#f3f3f3" stroke="#888"/>
  <text x="480" y="89" text-anchor="middle" font-size="12.5" fill="#222">Public internet · OIDC RPs</text>
  <text x="480" y="104" text-anchor="middle" font-size="11.5" fill="#555">Tailscale, Grafana, Audiobookshelf…</text>

  <!-- envoy pill -->
  <rect x="290" y="138" width="200" height="30" rx="15" fill="#fff" stroke="#777"/>
  <text x="390" y="157" text-anchor="middle" font-size="12" fill="#333">envoy SNI → 127.0.0.1:8440 (TLS)</text>
  <line x1="230" y1="112" x2="360" y2="138" stroke="#333" marker-end="url(#a)"/>
  <line x1="480" y1="112" x2="430" y2="138" stroke="#333" marker-end="url(#a)"/>

  <!-- EDGE BUS -->
  <text x="78" y="214" font-size="13.5" font-weight="bold" fill="#2a5596">dag-edge  (bridge · public plane · has egress: ACME / SMTP)</text>
  <line x1="70" y1="228" x2="715" y2="228" stroke="#4a78c0" stroke-width="4"/>
  <text x="720" y="225" font-size="11.5" fill="#2a5596">↘ egress</text>
  <text x="720" y="239" font-size="11.5" fill="#2a5596">ACME / SMTP</text>

  <!-- envoy -> caddy -->
  <line x1="390" y1="168" x2="170" y2="300" stroke="#1a7a3a" stroke-width="2" marker-end="url(#ag)"/>

  <!-- containers row (y 300-432) -->
  <!-- caddy: edge only -->
  <rect x="105" y="300" width="130" height="132" rx="7" fill="#eef6ff" stroke="#333"/>
  <text x="170" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">dag-caddy</text>
  <text x="170" y="342" text-anchor="middle" font-size="11" fill="#444">:8443 TLS edge</text>
  <text x="170" y="372" text-anchor="middle" font-size="11" fill="#b03030">edge interface</text>
  <text x="170" y="386" text-anchor="middle" font-size="11" fill="#b03030">ONLY</text>
  <line x1="170" y1="300" x2="170" y2="228" stroke="#1a7a3a" stroke-width="2.5"/>
  <!-- caddy blocked from internal -->
  <line x1="200" y1="432" x2="200" y2="498" stroke="#b03030" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="206" y="470" font-size="16" fill="#b03030">⛔</text>

  <!-- kratos: dual -->
  <rect x="265" y="300" width="130" height="132" rx="7" fill="#ffffff" stroke="#333"/>
  <text x="330" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">dag-kratos</text>
  <line x1="330" y1="300" x2="330" y2="228" stroke="#4a78c0" stroke-width="2.5"/>
  <text x="335" y="276" font-size="10.5" fill="#2a5596">:4433 public</text>
  <line x1="330" y1="432" x2="330" y2="498" stroke="#c08a2a" stroke-width="2.5"/>
  <text x="335" y="456" font-size="10.5" fill="#8a5a00">:4434 admin</text>
  <text x="335" y="470" font-size="10" fill="#8a5a00">host=int IP</text>

  <!-- hydra: dual -->
  <rect x="425" y="300" width="130" height="132" rx="7" fill="#ffffff" stroke="#333"/>
  <text x="490" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">dag-hydra</text>
  <line x1="490" y1="300" x2="490" y2="228" stroke="#4a78c0" stroke-width="2.5"/>
  <text x="495" y="276" font-size="10.5" fill="#2a5596">:4444 public</text>
  <line x1="490" y1="432" x2="490" y2="498" stroke="#c08a2a" stroke-width="2.5"/>
  <text x="495" y="456" font-size="10.5" fill="#8a5a00">:4445 admin</text>
  <text x="495" y="470" font-size="10" fill="#8a5a00">host=int IP</text>

  <!-- portal: dual, the bridge -->
  <rect x="585" y="300" width="150" height="132" rx="7" fill="#eafbf0" stroke="#1a7a3a" stroke-width="2"/>
  <text x="660" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">dag-portal</text>
  <text x="660" y="356" text-anchor="middle" font-size="10.5" fill="#1a7a3a">the authenticated</text>
  <text x="660" y="370" text-anchor="middle" font-size="10.5" fill="#1a7a3a">bridge</text>
  <text x="660" y="392" text-anchor="middle" font-size="10" fill="#444">/admin: basic_auth</text>
  <text x="660" y="405" text-anchor="middle" font-size="10" fill="#444">+ AAL2 + freshness</text>
  <line x1="660" y1="300" x2="660" y2="228" stroke="#1a7a3a" stroke-width="2.5"/>
  <text x="665" y="276" font-size="10.5" fill="#2a5596">:8080 UI</text>
  <line x1="660" y1="432" x2="660" y2="498" stroke="#1a7a3a" stroke-width="2.5"/>
  <text x="665" y="456" font-size="10" fill="#1a7a3a">admin API calls</text>
  <text x="665" y="469" font-size="10" fill="#1a7a3a">+ recovery-gate</text>

  <!-- ldap-bridge: internal only -->
  <rect x="765" y="300" width="130" height="132" rx="7" fill="#fff7e8" stroke="#333"/>
  <text x="830" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">dag-ldap-bridge</text>
  <text x="830" y="372" text-anchor="middle" font-size="11" fill="#8a5a00">internal</text>
  <text x="830" y="386" text-anchor="middle" font-size="11" fill="#8a5a00">ONLY (+TLS)</text>
  <line x1="830" y1="432" x2="830" y2="498" stroke="#c08a2a" stroke-width="2.5"/>

  <!-- postgres: internal only -->
  <rect x="925" y="300" width="130" height="132" rx="7" fill="#fff7e8" stroke="#333"/>
  <text x="990" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">dag-postgres</text>
  <text x="990" y="356" text-anchor="middle" font-size="11" fill="#444">:5432</text>
  <text x="990" y="384" text-anchor="middle" font-size="11" fill="#8a5a00">internal ONLY →</text>
  <text x="990" y="398" text-anchor="middle" font-size="10.5" fill="#8a5a00">cleartext PG never</text>
  <text x="990" y="411" text-anchor="middle" font-size="10.5" fill="#8a5a00">touches the edge</text>
  <line x1="990" y1="432" x2="990" y2="498" stroke="#c08a2a" stroke-width="2.5"/>

  <!-- INTERNAL BUS -->
  <line x1="300" y1="500" x2="1055" y2="500" stroke="#c08a2a" stroke-width="4"/>
  <text x="300" y="525" font-size="13.5" font-weight="bold" fill="#8a5a00">dag-internal  (bridge · admin / data plane ·  🔒 isolate=true  → no edge→internal L3 routing)</text>
  <text x="300" y="543" font-size="11.5" fill="#8a5a00">kratos/hydra admin → postgres:5432 stay on this plane; edge-only containers (caddy) have no interface here.</text>

  <!-- operator green path along the buses -->
  <line x1="170" y1="228" x2="660" y2="228" stroke="#1a7a3a" stroke-width="3"/>
  <polyline points="660,228 660,228" fill="none"/>
  <line x1="660" y1="500" x2="330" y2="500" stroke="#1a7a3a" stroke-width="3" marker-end="url(#ag)"/>
  <text x="500" y="202" font-size="11" font-weight="bold" fill="#1a7a3a">operator request rides the EDGE bus to the portal…</text>
  <text x="360" y="492" font-size="11" font-weight="bold" fill="#1a7a3a">…then the portal (server-side) rides the INTERNAL bus to the Ory admin API</text>

  <!-- break-glass -->
  <rect x="120" y="600" width="240" height="48" rx="6" fill="#f7f7f7" stroke="#999" stroke-dasharray="4 3"/>
  <text x="240" y="620" text-anchor="middle" font-size="12" fill="#333">host shell · podman exec / unshare</text>
  <text x="240" y="636" text-anchor="middle" font-size="11" fill="#777">break-glass only — the sole direct-to-internal path</text>
  <line x1="360" y1="612" x2="500" y2="520" stroke="#999" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- legend -->
  <rect x="600" y="588" width="500" height="84" rx="6" fill="#fbfbfb" stroke="#ccc"/>
  <text x="615" y="606" font-size="12" font-weight="bold" fill="#333">legend</text>
  <line x1="618" y1="624" x2="648" y2="624" stroke="#1a7a3a" stroke-width="3"/>
  <text x="654" y="628" font-size="11.5" fill="#333">operator admin path: browser → Caddy → portal UI → Ory admin API</text>
  <text x="618" y="646" font-size="13" fill="#b03030">⛔</text>
  <text x="654" y="648" font-size="11.5" fill="#333">blocked: an edge-only container has no route to the internal bus</text>
  <text x="615" y="666" font-size="11.5" fill="#333">box with two stubs = dual-homed (ONE netns, two interfaces) · UserNS unchanged</text>
</svg>
