<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 458" width="720" height="458" role="img" aria-labelledby="fa-t fa-d" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title id="fa-t">The forward-auth request path: browser, edge, Caddy, portal, Kratos, app</title>
<desc id="fa-d">A browser carrying the apex-scoped Kratos session cookie reaches the estate edge, which hands the request to the service's own Caddy. Caddy does not proxy it yet: it issues a sub-request to the portal's /api/forward-auth endpoint with the required group as a static query parameter set by the edge config. The portal reads that group, verifies the Kratos session from the request's own cookie, re-resolves the identity through the Kratos admin API because metadata_admin.groups is absent from whoami, and applies enforceGroupGate — identity active and in the group — failing closed at every step. The portal answers 200, 401 or 403; Caddy proxies to the app only on 200, setting X-Kratos-Authenticated-Identity-Id from the server-verified session id, and otherwise redirects the browser to the portal login page. The app never learns any of this; it sees only the header. The session check is why session.whoami.required_aal must stay aal1.</desc>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}.dg .ns{stroke:var(--no)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="458" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="418" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<!-- header -->
<g class="as" stroke="#4a6741" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(37 29) scale(0.3)">
<line x1="32" y1="8" x2="48" y2="24"/>
<line x1="48" y1="24" x2="32" y2="40"/>
<line x1="32" y1="40" x2="16" y2="24"/>
<line x1="16" y1="24" x2="32" y2="8"/>
<line x1="32" y1="40" x2="18" y2="56"/>
<line x1="32" y1="40" x2="46" y2="56"/>
</g>
<text class="m" x="60" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">REQUEST PATH · AN APP THAT CANNOT SPEAK OIDC</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">THE REQUEST</text>
<!-- top lane -->
<rect class="s e" x="40" y="88" width="100" height="54" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">BROWSER</text>
<text class="i2" x="52" y="121" font-size="8.5" fill="#404040">carries the apex-</text>
<text class="i2" x="52" y="132" font-size="8.5" fill="#404040">scoped session cookie</text>
<rect class="s e" x="168" y="88" width="92" height="54" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="180" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">ESTATE EDGE</text>
<text class="i2" x="180" y="121" font-size="8.5" fill="#404040">L4 SNI routing —</text>
<text class="i2" x="180" y="132" font-size="8.5" fill="#404040">nothing decrypted</text>
<rect class="p as" x="288" y="88" width="150" height="54" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<g class="as" stroke="#4a6741" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(404.4 113.1) scale(0.35)">
<line x1="16" y1="14.5" x2="16" y2="49.5"/>
<line x1="48" y1="14.5" x2="48" y2="49.5"/>
<line x1="17.9" y1="13.9" x2="30.1" y2="30.1"/>
<line x1="33.9" y1="33.9" x2="46.1" y2="50.1"/>
<line x1="17.9" y1="50.1" x2="30.1" y2="33.9"/>
<line x1="33.9" y1="30.1" x2="46.1" y2="13.9"/>
</g>
<text class="a" x="300" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.6" fill="#4a6741">SERVICE CADDY · THE DOOR</text>
<text class="i" x="300" y="121" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">forward_auth, before</text>
<text class="i" x="300" y="132" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">any reverse_proxy</text>
<rect class="s e" x="560" y="88" width="120" height="54" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<g class="ms" stroke="#707070" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(655.2 91.6) scale(0.3)">
<line x1="32" y1="8" x2="48" y2="24"/>
<line x1="48" y1="24" x2="32" y2="40"/>
<line x1="32" y1="40" x2="16" y2="24"/>
<line x1="16" y1="24" x2="32" y2="8"/>
<line x1="32" y1="40" x2="18" y2="56"/>
<line x1="32" y1="40" x2="46" y2="56"/>
</g>
<text class="m" x="572" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">THE APP</text>
<text class="i2" x="572" y="121" font-size="8.5" fill="#404040">no OIDC support. It</text>
<text class="i2" x="572" y="132" font-size="8.5" fill="#404040">sees only the header.</text>
<!-- top-lane arrows -->
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="144" y1="116" x2="162" y2="116"/>
<polyline points="156,111.5 162,116 156,120.5"/>
<line x1="264" y1="116" x2="282" y2="116"/>
<polyline points="276,111.5 282,116 276,120.5"/>
<line x1="442" y1="116" x2="554" y2="116"/>
<polyline points="548,111.5 554,116 548,120.5"/>
</g>
<text class="m" x="499" y="106" text-anchor="middle" font-size="8.5" fill="#707070">proxied only after 200</text>
<!-- deny return to the browser -->
<g class="ns" stroke="#a8443a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 3">
<polyline points="300,142 300,164 90,164 90,148"/>
</g>
<g class="ns" stroke="#a8443a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
<polyline points="85.5,148 90,142 94.5,148"/>
</g>
<text class="n" x="106" y="154" font-size="8.5" fill="#a8443a">denied — 302 to the portal login page</text>
<!-- gate lane -->
<text class="m" x="40" y="190" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">THE GATE · A SUB-REQUEST, NOT A REDIRECT</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="352" y1="142" x2="352" y2="194"/>
<polyline points="347.5,194 352,200 356.5,194"/>
<line x1="316" y1="200" x2="316" y2="148"/>
<polyline points="311.5,148 316,142 320.5,148"/>
</g>
<text class="m" x="308" y="176" text-anchor="end" font-size="8.5" fill="#707070">200 / 401 / 403</text>
<text class="m" x="360" y="176" font-size="8.5" fill="#707070">?group=gather-access</text>
<rect class="p as" x="288" y="200" width="230" height="126" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="300" y="218" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#4a6741">PORTAL · /api/forward-auth</text>
<text class="i2" x="300" y="235" font-size="8.5" fill="#404040">1 · the group comes from the query</text>
<text class="m" x="310" y="246" font-size="8.5" fill="#707070">param the edge config sets — never</text>
<text class="m" x="310" y="257" font-size="8.5" fill="#707070">from an inbound header</text>
<text class="i2" x="300" y="274" font-size="8.5" fill="#404040">2 · verify the Kratos session cookie</text>
<text class="i2" x="300" y="291" font-size="8.5" fill="#404040">3 · re-resolve the identity, admin API</text>
<text class="i2" x="300" y="308" font-size="8.5" fill="#404040">4 · enforceGroupGate: active, in group</text>
<text class="m" x="300" y="321" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8" fill="#707070">FAIL CLOSED AT EVERY STEP</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="522" y1="240" x2="554" y2="240"/>
<polyline points="548,235.5 554,240 548,244.5"/>
<line x1="522" y1="288" x2="554" y2="288"/>
<polyline points="548,283.5 554,288 548,292.5"/>
</g>
<rect class="s e2" x="560" y="200" width="120" height="126" rx="3" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1"/>
<text class="m" x="572" y="218" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">KRATOS</text>
<text class="i" x="572" y="236" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">whoami</text>
<text class="m" x="572" y="248" font-size="8.5" fill="#707070">gives the identity id</text>
<text class="m" x="572" y="259" font-size="8.5" fill="#707070">— pinned aal1, or</text>
<text class="m" x="572" y="270" font-size="8.5" fill="#707070">this gate locks out</text>
<text class="i" x="572" y="288" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">admin API</text>
<text class="m" x="572" y="300" font-size="8.5" fill="#707070">gives state and</text>
<text class="m" x="572" y="311" font-size="8.5" fill="#707070">metadata_admin</text>
<text class="m" x="572" y="322" font-size="8.5" fill="#707070">.groups — not in whoami</text>
<!-- status contract -->
<line class="e" x1="40" y1="344" x2="680" y2="344" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="364" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">STATUS CONTRACT · CADDY KEYS ON THE STATUS, NEVER THE BODY</text>
<text class="y" x="40" y="386" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#4a7a4a">200</text>
<text class="i2" x="84" y="386" font-size="8.5" fill="#404040">proxy through, with X-Kratos-Authenticated-Identity-Id set from the server-verified session id.</text>
<text class="m" x="40" y="406" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#707070">401</text>
<text class="i2" x="84" y="406" font-size="8.5" fill="#404040">no usable session, and nothing else. This is the status an edge can safely turn into a login redirect.</text>
<text class="n" x="40" y="426" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#a8443a">403</text>
<text class="i2" x="84" y="426" font-size="8.5" fill="#404040">everything else: bad group param, Kratos unreachable, inactive identity, group miss. Fail closed.</text>
</g>
</svg>
