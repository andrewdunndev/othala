# e2e-only Kratos overlay, merged after the rendered kratos.yml (a second --config). The CI VM
# has no route to haveibeenpwned.org, so the breach check is off here; production ships it on.
selfservice:
  methods:
    password:
      config:
        haveibeenpwned_enabled: false
session:
  # Equal to the lifespan, so every extend call takes effect and a spec need not wait a day.
  earliest_possible_extend: 2160h
