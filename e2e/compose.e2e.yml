# Test-only overlay, outside the deployment contract. validate.sh copies deploy/example/compose.yml here and runs
#   docker compose -f compose.yml -f compose.e2e.yml
# with this directory as the deployment: othala.env, secrets.env, Caddyfile and content/ are the test's own.
# Only what testing needs is added: the image under test, the HIBP-off Kratos
# layer, internal-CA test hostnames, fixed container names for podman logs, a mail catcher and the runners.

services:
  render:
    image: ${AUTH_REGISTRY}:${AUTH_VERSION}
    container_name: lab-render

  postgres:
    container_name: lab-postgres

  kratos-migrate:
    container_name: lab-kratos-migrate

  kratos:
    container_name: lab-kratos
    volumes:
      - ./kratos.e2e.yml:/etc/config/kratos.e2e.yml:ro,z
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml", "--config", "/etc/config/kratos.e2e.yml", "--watch-courier"]

  hydra-migrate:
    container_name: lab-hydra-migrate

  hydra:
    container_name: lab-hydra

  othala:
    image: ${AUTH_REGISTRY}:${AUTH_VERSION}
    container_name: lab-othala
    depends_on:
      mailpit:
        condition: service_healthy

  # Internal CA on :8443: the test hostnames have no DNS, so the example's ACME ports are replaced.
  caddy:
    container_name: lab-caddy
    ports: !override ["8443:443"]
    networks:
      edge:
        # MUST be subdomains of the Kratos cookie domain (othala.test) or the CSRF cookie is never sent.
        aliases: [auth.othala.test, proxywatch.othala.test]

  # SMTP :1025 for Kratos and the portal, HTTP API :8025 for smoke.sh Section H and the specs.
  mailpit:
    image: docker.io/axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: lab-mailpit
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 256
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      internal: {}
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # smoke.sh Section G pipes oidc-dance.mjs in; the prebaked image carries its deps (the VM has no npm egress).
  dance-runner:
    image: ${AUTH_REGISTRY}/e2e-tester:${AUTH_VERSION}
    profiles: ["oneshot"]
    networks:
      edge: {}
      internal: {}
    extra_hosts: ["kratos:10.200.11.10", "hydra:10.200.11.11", "othala:10.200.11.12"]
    depends_on:
      othala:
        condition: service_healthy
    environment:
      EDGE_URL: https://auth.othala.test
      NODE_EXTRA_CA_CERTS: /caddy/caddy/pki/authorities/local/root.crt
    volumes:
      - caddy-data:/caddy:ro
    working_dir: /test
    entrypoint: ["node"]

  # smoke.sh A10 probes from here: a container on `edge` alone, like the edge.
  edge-probe:
    image: ${AUTH_REGISTRY}/e2e-tester:${AUTH_VERSION}
    profiles: ["oneshot"]
    networks:
      edge: {}
    entrypoint: ["node"]

  # The specs reach the edge on `edge` and the admin listeners on `internal`, like the portal.
  playwright:
    image: ${AUTH_REGISTRY}/e2e-tester:${AUTH_VERSION}
    container_name: lab-playwright
    profiles: ["browser"]
    env_file: [othala.env, secrets.env]
    networks:
      edge: {}
      internal: {}
    extra_hosts: ["kratos:10.200.11.10", "hydra:10.200.11.11", "othala:10.200.11.12"]
    depends_on:
      caddy:
        condition: service_started
      othala:
        condition: service_healthy
    environment:
      BASE: https://auth.othala.test
      NODE_EXTRA_CA_CERTS: /caddy/caddy/pki/authorities/local/root.crt
      OTHALA_ADMIN_URL: http://othala:4431
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes:
      - ./browser-out:/out:z
      - caddy-data:/caddy:ro
    working_dir: /test
    command: ["npx", "playwright", "test", "--config=playwright.config.ts"]
