# glauth-kratos lab config.
debug = true

[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = false

[backend]
  baseDN = "dc=othala,dc=test"

[backend.kratos]
  public_url_env     = "KRATOS_PUBLIC_URL"
  admin_url_env      = "KRATOS_ADMIN_URL"
  admin_token_env    = "KRATOS_BRIDGE_ADMIN_TOKEN"
  base_dn            = "dc=othala,dc=test"
  identity_cache_ttl = "30s"
  bind_cache_ttl     = "30s"
