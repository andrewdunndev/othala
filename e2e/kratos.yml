# Kratos config for CI lab.
#
# Mirrors production kratos/kratos.yml (Topology B shape) with:
#   - DSN points at `postgres` (compose service name, not auth-postgres)
#   - All public URLs use http://auth-lab.${LAB_DOMAIN} (the smoke
#     suite hits internal container hostnames directly, but Kratos
#     emits these URLs in flow responses; the smoke just doesn't
#     follow them externally)
#   - WebAuthn rp.id is the LAB_DOMAIN so the lab can exercise the
#     ceremony bootstrap without colliding with production's
#     dunn.dev rp.id
#
# Substituted at compose-up time via $LAB_DOMAIN env var. Default is
# `test.dunn.dev` (no real DNS resolution needed; only used in URL
# emission).

dsn: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://auth-lab.${LAB_DOMAIN}/
    port: 4433
    cors:
      enabled: true
      allowed_origins:
        - http://auth-lab.${LAB_DOMAIN}
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers:
        - Authorization
        - Content-Type
        - X-Session-Token
        - Cookie
        - X-CSRF-Token
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true

  admin:
    base_url: http://kratos:4434/
    port: 4434

selfservice:
  default_browser_return_url: http://auth-lab.${LAB_DOMAIN}/
  allowed_return_urls:
    - http://auth-lab.${LAB_DOMAIN}/

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: false
        min_password_length: 6

    webauthn:
      enabled: true
      config:
        passwordless: true
        rp:
          id: ${LAB_DOMAIN}
          display_name: Dunn Family Lab
          origins:
            - http://auth-lab.${LAB_DOMAIN}

    totp:
      enabled: true
      config:
        issuer: Dunn Family Lab

    code:
      enabled: true
      passwordless_enabled: false

    profile:
      enabled: true

    link:
      enabled: false

    lookup_secret:
      enabled: true

  flows:
    error:
      ui_url: http://auth-lab.${LAB_DOMAIN}/auth/error

    settings:
      ui_url: http://auth-lab.${LAB_DOMAIN}/auth/settings
      privileged_session_max_age: 15m

    recovery:
      # The e2e exercises the recovery-gate webhook directly (smoke.sh
      # section D, via `compose exec` against the othala app's loopback
      # admin port othala:8431/admin/recovery-gate). The courier/SMTP
      # path stays off — Fastmail credentials don't ship in CI — so
      # recovery itself is disabled, but the production-shape web_hook
      # block is recorded below for config fidelity (it points at the
      # converged app, NOT the retired consent service).
      enabled: false
      # Production converged shape (inert here because recovery is off):
      #   after.code.hooks:
      #     - hook: web_hook
      #       config:
      #         url: http://${RECOVERY_GATE_HOST}:8431/admin/recovery-gate
      #         method: POST
      #         auth:
      #           type: api_key
      #           config:
      #             in: header
      #             name: Authorization
      #             value: Bearer ${RECOVERY_GATE_SECRET}
      #         body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
      #         can_interrupt: true
      # The app's handleRecoveryGate reads Authorization: Bearer and
      # refuses recovery for any identity whose traits.email is on
      # OTHALA_ADMIN_SUBJECTS (the `admin` group is display-only).

    verification:
      enabled: false

    logout:
      after:
        default_browser_return_url: http://auth-lab.${LAB_DOMAIN}/

    login:
      ui_url: http://auth-lab.${LAB_DOMAIN}/auth/login
      lifespan: 10m

    registration:
      # CI smoke creates identities via the admin API, not self-service.
      enabled: false
      ui_url: http://auth-lab.${LAB_DOMAIN}/auth/registration

session:
  lifespan: 24h
  cookie:
    domain: ${LAB_DOMAIN}
    name: ory_kratos_session
    persistent: true
    same_site: Lax
  whoami:
    required_aal: aal1

cookies:
  domain: ${LAB_DOMAIN}
  same_site: Lax

identity:
  default_schema_id: family
  schemas:
    - id: family
      url: file:///etc/config/kratos/identity.schema.json

# No courier configured — recovery is disabled in CI lab.

secrets:
  cookie:
    - ${KRATOS_COOKIE_SECRET_CURRENT}
    - ${KRATOS_COOKIE_SECRET_PREVIOUS}
  cipher:
    - ${KRATOS_CIPHER_SECRET_CURRENT}
    - ${KRATOS_CIPHER_SECRET_PREVIOUS}

log:
  level: info
  format: json
  leak_sensitive_values: false

hashers:
  argon2:
    parallelism: 1
    memory: 64MB
    iterations: 2
    salt_length: 16
    key_length: 32

ciphers:
  algorithm: xchacha20-poly1305

feature_flags:
  cacheable_sessions: false
