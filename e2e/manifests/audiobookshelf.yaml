# Audiobookshelf — audiobookshelf.othala.test
# Generic OSS example fixture for the Othala e2e harness. A clean,
# plain generic_oauth client: authorization-code + refresh, one simple
# admin/user role split driven by group_role_map. No JMESPath, no
# resource_access nesting — the minimal "well-behaved OIDC RP" example.
#
# Audiobookshelf supports OIDC back-channel logout; the logout token is
# accepted at the OpenID callback's logout path.

presentation:
  name: Audiobookshelf
  description: Self-hosted audiobook and podcast server with multi-user progress sync.
  url: https://audiobookshelf.othala.test
  icon: AB
  icon_slug: audiobookshelf
  auth_kind: oidc
  # ENTRY: `audiobookshelf-access` only. `audiobookshelf-admin` is bound for
  # ROLE under consent.group_role_map and grants no entry by itself.
  access:
    - audiobookshelf-access
  order: 40

oidc:
  client_id: audiobookshelf
  client_name: Audiobookshelf
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  # offline_access is required for Hydra to honour the refresh_token grant type;
  # without it the authorization server silently omits the refresh token even
  # when refresh_token is listed in grant_types.
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://audiobookshelf.othala.test/auth/openid/callback
  post_logout_redirect_uris:
    - https://audiobookshelf.othala.test/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://audiobookshelf.othala.test
  skip_consent: true
  backchannel_logout_uri: https://audiobookshelf.othala.test/auth/openid/logout

# Consent claim shape for this client.
#
# Audiobookshelf reads a configurable group claim and maps its values to
# its own admin/user/guest account types. Here we emit a simple `groups`
# claim per role: admins get the `admin` group, everyone else `user`.
# Per-collection permissions are managed inside Audiobookshelf.
#
# Source: https://www.audiobookshelf.org/guides/oidc_authentication/
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Server admin: users, libraries, settings."
      claim_emit:
        groups: ["admin"]
    user:
      description: "Listen and sync progress."
      claim_emit:
        groups: ["user"]
  # Exactly two groups per service; roles declared above in descending
  # privilege (lookupRole ranks by declaration index, portal/src/lib/claims.ts).
  group_role_map:
    audiobookshelf-admin: admin
    audiobookshelf-access: user
