# Promptdesk: the service slug (prompt) and the OAuth2 client_id (promptdesk) may differ;
# the binding is what the runtime reads (access-groups.ts, group-registry.ts). It also
# carries a configurable roles claim (groups) and no back-channel logout.

presentation:
  name: Prompt
  description: Internal chat interface. SSO via othala — no local password required.
  url: https://prompt.othala.test
  icon: PD
  icon_slug: ""
  icon_fallback: chat
  auth_kind: oidc
  access:
    - prompt-access
  order: 120

oidc:
  client_id: promptdesk
  client_name: Prompt
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  # offline_access is required for Hydra to issue a refresh token.
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://prompt.othala.test/oauth/oidc/callback
  post_logout_redirect_uris:
    - https://prompt.othala.test/
  token_endpoint_auth_method: client_secret_basic
  # audience ORIGIN must match a redirect_uri ORIGIN exactly (audienceMatchesRedirect).
  audience:
    - https://prompt.othala.test
  skip_consent: true

# The RP reads its role from the groups claim: admins get admin, everyone else user.
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Admin: model management, user administration, workspace settings."
      claim_emit:
        groups: ["admin"]
    user:
      description: "Member: chat access across permitted models."
      claim_emit:
        groups: ["user"]
  # prompt-admin is a role only: it is absent from presentation.access, so it grants no entry.
  # Roles are declared in descending privilege because lookupRole ranks by declaration index.
  group_role_map:
    prompt-admin: admin
    prompt-access: user
