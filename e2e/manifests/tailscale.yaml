# Tailscale — login.tailscale.com (redirect target)
# Unified app catalog entry for the dag.othala.test instance.
# Merged from: hydra/clients/tailscale.yaml + portal/src/content/apps/tailscale.md
#              + portal/preview-manifests/tailscale.yaml
#
# NOTE: preview-manifests/tailscale.yaml lists auth_kind: external and
# omits access_group. The hydra client is real (Tailscale custom OIDC
# against our Hydra). Keeping auth_kind: oidc from the live hydra client.
#
# Tailscale custom OIDC has no back-channel logout concept; the user
# authenticates once and Tailscale tracks the session in its own
# control plane. There is no per-app cookie for our consent service to
# revoke remotely. Leave backchannel_logout_uri absent.
#
# Tailscale does NOT use PKCE; ensure hydra.yml has pkce.enforced=false.
# Tailscale tries client_secret_basic first, then client_secret_post.
# Both work with Hydra defaults.
#
# WebFinger response for *@othala.test addresses lives at the email domain
# apex: othala.test/.well-known/webfinger, served by a Cloudflare Pages
# function in the othala.test apex repo. RFC 7033 + Tailscale KB-1240
# both require this path (NOT a subdomain). Fetched exactly once during
# Tailscale tenant setup; the issuer URL is locked in afterward.

presentation:
  name: Tailscale
  description: "Private mesh VPN — connects your devices to the home network securely from anywhere, no client config required."
  url: https://login.tailscale.com/admin
  icon: TS
  icon_slug: tailscale
  auth_kind: oidc
  access_group: access-tailscale
  order: 130

oidc:
  client_id: tailscale
  client_name: Tailscale
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile
  redirect_uris:
    - https://login.tailscale.com/a/oauth_response
  # Tailscale custom OIDC has no post-logout redirect concept (per
  # https://tailscale.com/kb/1240/sso-custom-oidc). Hydra also rejects a
  # post_logout_redirect_uri whose host differs from any redirect_uri,
  # so leaving this absent both matches Tailscale's contract and keeps
  # apply-clients.sh from failing the manifest.
  token_endpoint_auth_method: client_secret_basic
  # LOW-4 / Tailscale audience note:
  #
  # Tailscale's relying-party check uses `client_id`, NOT `aud`. The
  # audience field below exists only to satisfy the consent-service
  # manifest validator (audienceMatchesRedirect: at least one aud
  # entry's host must overlap the redirect_uri host). Setting it to
  # https://login.tailscale.com matches the redirect host; no
  # downstream service on our side actually verifies this aud value.
  #
  # Cross-app token replay: a compromised Tailscale integration that
  # exfiltrates an id_token cannot present it to another <app>.othala.test
  # because every other app's aud lists its own domain. The unverified
  # aud here is a known harmless mismatch.
  audience:
    - https://login.tailscale.com
  skip_consent: true
  # backchannel_logout_uri: not applicable to Tailscale custom OIDC.

# Consent claim shape for this client.
#
# Tailscale custom OIDC does not support user/group provisioning. It
# requests only openid + profile + email, identifies the user by sub,
# and admin/owner role is assigned inside Tailscale's own admin
# console. The claim_emit blocks below are documented for completeness
# and for the consent service to omit the groups claim entirely
# (Tailscale ignores it; emitting it inflates the id_token for no
# reason).
#
# Source: https://tailscale.com/kb/1240/sso-custom-oidc
consent:
  emit_groups_claim: false
  roles:
    user:
      description: "Identity-only authn. Roles assigned inside Tailscale."
      claim_emit: {}
  group_role_map:
    admin: user
    family: user
    friends: user
    kids: user
