# Grafana — grafana.othala.test
# Generic OSS example fixture for the Othala e2e harness. This is THE
# role-mapping example: a Grafana generic_oauth client with a JMESPath
# role attribute (grafana_role) plus a groups claim and an
# identity-group → Grafana-role map.
#
# Grafana 10.2+ supports OIDC back-channel logout in the generic_oauth
# provider; the logout token is accepted at the standard logout path
# /login/generic_oauth/logout. Front-channel logout is also supported
# but back-channel is preferred when both ends agree.

presentation:
  name: Grafana
  description: Dashboards and metrics — CPU, disk, network, and service health at a glance.
  url: https://grafana.othala.test
  icon: GR
  icon_slug: grafana
  auth_kind: oidc
  access_group: access-grafana
  order: 110

oidc:
  client_id: grafana
  client_name: Grafana
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://grafana.othala.test/login/generic_oauth
  post_logout_redirect_uris:
    - https://grafana.othala.test/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://grafana.othala.test
  skip_consent: true
  backchannel_logout_uri: https://grafana.othala.test/login/generic_oauth/logout

# Consent claim shape for this client.
#
# Grafana generic OAuth evaluates `role_attribute_path` (a JMESPath)
# against the id_token, the userinfo response, and the access token
# in that order. Result must be one of: None, Viewer, Editor, Admin,
# GrafanaAdmin. allow_assign_grafana_admin=true is required for
# GrafanaAdmin to actually elevate to instance admin; otherwise Admin
# is org-admin only. groups_attribute_path is read independently for
# Team Sync (Enterprise; we use OSS, so groups are emitted but ignored).
# allow_sign_up=true gives JIT.
#
# Recommended app config (set in grafana.ini / env on the Grafana side):
#   GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=
#     contains(grafana_role[*], 'GrafanaAdmin') && 'GrafanaAdmin'
#     || contains(grafana_role[*], 'Admin') && 'Admin'
#     || contains(grafana_role[*], 'Editor') && 'Editor'
#     || 'Viewer'
#   GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
#   GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
#
# Source: https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/generic-oauth/
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Instance + org admin (GrafanaAdmin)."
      claim_emit:
        grafana_role: ["GrafanaAdmin"]
        groups: ["admin"]
    editor:
      description: "Create and edit dashboards in the default org."
      claim_emit:
        grafana_role: ["Editor"]
        groups: ["family"]
    viewer:
      description: "Read-only dashboard access."
      claim_emit:
        grafana_role: ["Viewer"]
        groups: ["family"]
  group_role_map:
    admin: admin
    family: viewer
    friends: viewer
    kids: viewer
