# Grafana: the role-mapping example (JMESPath grafana_role plus a groups claim) and the
# access-model fixture (t-access-model.spec.ts T1-T4; site guides/per-app-oidc.md;
# DECISIONS.md § Nothing is derived).

presentation:
  name: Grafana
  description: Dashboards and metrics — CPU, disk, network, and service health at a glance.
  url: https://grafana.othala.test
  icon: GR
  auth_kind: oidc
  # Entry only; grafana-admin is a role and is deliberately absent (T4 fails if added back).
  access:
    - grafana-access
  order: 110

oidc:
  client_id: grafana
  client_name: Grafana
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  # offline_access is required or Hydra silently omits the refresh token; groups is
  # required for the groups claim to clear the OIDC Core 5.4 scope gate.
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://grafana.othala.test/login/generic_oauth
  post_logout_redirect_uris:
    - https://grafana.othala.test/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://grafana.othala.test
  skip_consent: true
  backchannel_logout_uri: http://playwright:4500/backchannel

# Grafana-side config, not a manifest field. role_attribute_path is a JMESPath over the
# id_token; groups_attribute_path feeds Team Sync (Enterprise only):
# https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/generic-oauth/
#   GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=
#     contains(grafana_role[*], 'GrafanaAdmin') && 'GrafanaAdmin'
#     || contains(grafana_role[*], 'Admin') && 'Admin'
#     || contains(grafana_role[*], 'Editor') && 'Editor'
#     || 'Viewer'
#   GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
#   GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
consent:
  emit_groups_claim: true
  roles:
    # Declaration order is rank, descending privilege; lookupRole keeps the highest match,
    # so resolution is independent of stored group order (T2/T3 pin it).
    admin:
      description: "Instance + org admin (GrafanaAdmin)."
      claim_emit:
        grafana_role: ["GrafanaAdmin"]
        groups: ["admin"]
    editor:
      description: "Create and edit dashboards in the default org."
      claim_emit:
        grafana_role: ["Editor"]
        groups: ["editor"]
    viewer:
      description: "Read-only dashboard access."
      claim_emit:
        grafana_role: ["Viewer"]
        groups: ["viewer"]
  # editor is deliberately unmapped: reachable only via metadata_admin.roles.grafana.
  group_role_map:
    grafana-admin: admin
    grafana-access: viewer
