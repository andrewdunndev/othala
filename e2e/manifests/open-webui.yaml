# Prompt — prompt.othala.test (Open WebUI)
# OIDC SSO client for Open WebUI, the human chat UI over the inference stack.
# The API path (bearer/virtual-key auth via LiteLLM) is NOT represented here —
# that is a client_credentials shape, not human SSO.
#
# Open WebUI OIDC notes:
#   - Callback path: /oauth/oidc/callback (Open WebUI 0.3+).
#   - Role mapping: Open WebUI reads OAUTH_ROLES_CLAIM (default "roles") and
#     maps claim values to its own admin/user model. We emit via the `groups`
#     claim (claim_emit.groups) and configure Open WebUI with
#     OAUTH_ROLES_CLAIM=groups on the RP side. Admins get "admin" in the claim;
#     users get "user". ENABLE_OAUTH_ROLE_MANAGEMENT=true must also be set.
#   - Back-channel logout: Open WebUI does not implement OIDC back-channel
#     logout as of 0.4.x — omitted here.
#
# Source: https://docs.openwebui.com/features/sso

presentation:
  name: Prompt
  description: AI chat interface backed by the estate inference stack. SSO via othala — no local password required.
  url: https://prompt.othala.test
  icon: AI
  icon_slug: openwebui
  auth_kind: oidc
  # ENTRY: `prompt-access` and nothing else. `prompt-admin` is bound under
  # consent.group_role_map only. Group names track the SERVICE slug (this tile
  # is Prompt at prompt.othala.test), not the OAuth2 client_id (`openwebui`) —
  # further proof that the name is convention and the BINDING is what the
  # runtime reads (portal/src/lib/access-groups.ts, group-registry.ts).
  access:
    - prompt-access
  order: 120

oidc:
  client_id: openwebui
  client_name: Prompt
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  # offline_access is required for Hydra to issue a refresh_token alongside
  # the access_token; without it the refresh_token grant type is a no-op.
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://prompt.othala.test/oauth/oidc/callback
  post_logout_redirect_uris:
    - https://prompt.othala.test/
  token_endpoint_auth_method: client_secret_basic
  # audience ORIGIN must match a redirect_uri ORIGIN exactly (audienceMatchesRedirect).
  audience:
    - https://prompt.othala.test
  skip_consent: true

# Consent claim shape for this client.
#
# Open WebUI maps OAUTH_ROLES_CLAIM (set to "groups" on the RP side) to its
# own admin/user account type. Admins receive the "admin" group value in the
# claim; all other household members receive "user". Per-model and per-workspace
# permissions are managed inside Open WebUI.
#
# Required Open WebUI env on the RP side:
#   ENABLE_OAUTH_ROLE_MANAGEMENT=true
#   OAUTH_ROLES_CLAIM=groups
#   OAUTH_ADMIN_ROLES=admin
#   OAUTH_ALLOWED_ROLES=admin,user
#   ENABLE_LOGIN_FORM=false        # SSO-only; disable local password login
#
# Source: https://docs.openwebui.com/features/sso
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Estate admin: model management, user administration, workspace settings."
      claim_emit:
        groups: ["admin"]
    user:
      description: "Household member: chat access across permitted models."
      claim_emit:
        groups: ["user"]
  # Exactly two groups for this service. `prompt-admin` appears HERE (role) and
  # NOT under presentation.access (entry) — holding it alone gets you nothing.
  # Roles are declared above in descending privilege because lookupRole
  # (portal/src/lib/claims.ts) ranks by declaration index.
  group_role_map:
    prompt-admin: admin
    prompt-access: user
