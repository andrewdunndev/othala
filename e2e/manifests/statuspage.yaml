# Statuspage — status.othala.test (external SaaS tile)
# Generic example fixture for the Othala e2e harness. A stand-in for an
# external, hosted service that the portal links to but does not
# authenticate — auth_kind: external. Presentation ONLY; no oidc:/
# consent: block. There is no SSO session on our side.
#
# access_group is deliberately ABSENT here to demonstrate the default-group
# fallback: tiles without an explicit access_group gate on the configured
# default group (OTHALA_DEFAULT_GROUP, default value 'everyone'). The portal's
# tile filter gates ALL tiles on group membership — there is no ungated/bypass
# concept. Adding a user to the default group is an explicit admin act; it is
# never automatic.

presentation:
  name: Statuspage
  description: Public status and incident history — an external hosted service the portal links out to.
  url: https://status.othala.test
  icon: ST
  icon_slug: ""
  icon_fallback: statuspage
  auth_kind: external
  # access_group omitted: gates on the default group (OTHALA_DEFAULT_GROUP,
  # default 'everyone'). Set access_group explicitly to restrict further.
  order: 200
