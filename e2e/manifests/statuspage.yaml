# Statuspage — status.othala.test (external SaaS tile)
# Generic example fixture for the Othala e2e harness. A stand-in for an
# external, hosted service that the portal links to but does not
# authenticate — auth_kind: external. Presentation ONLY; no oidc:/
# consent: block. There is no SSO session on our side.
#
# skip_access_check: true is set because auth_kind: external tiles are links
# to public or externally-authenticated services — there is no othala-managed
# SSO gate on the link target. The tile is shown to all logged-in portal users
# regardless of group membership (they are already authenticated to reach the
# dashboard). To restrict visibility, set consent.skip_access_check: false and
# add an access binding in presentation.access.

presentation:
  name: Statuspage
  description: Public status and incident history — an external hosted service the portal links out to.
  url: https://status.othala.test
  icon: ST
  icon_slug: ""
  icon_fallback: statuspage
  auth_kind: external
  order: 200

consent:
  skip_access_check: true
