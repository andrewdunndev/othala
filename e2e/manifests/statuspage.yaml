# Statuspage: an external hosted service (auth_kind: external), presentation only.
# skip_access_check suppresses the load-time BLOCK for a manifest with no access binding;
# it does not affect tile visibility (parseTile reads presentation only, so the tile falls
# back to OTHALA_DEFAULT_GROUP). Add access or access_group to bind it.

presentation:
  name: Statuspage
  description: Public status and incident history — an external hosted service the portal links out to.
  url: https://status.othala.test
  icon: ST
  icon_slug: ""
  icon_fallback: statuspage
  auth_kind: external
  order: 200

consent:
  skip_access_check: true
