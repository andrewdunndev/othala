# vLLM — llm.othala.test
# Unified app catalog entry for the dag.othala.test instance.
# Merged from: hydra/clients/llm.yaml + portal/src/content/apps/llm.md
# No preview-manifest: preview-manifests/infer.yaml is a PLANNED-RENAME
# prototype (llm → infer) — not merged here. Keep as llm until the rename
# is executed across the full estate. (Future task: rename llm → infer.)
#
# Machine-to-machine OAuth2 client. Caddy in front of vLLM validates
# the bearer token via Hydra introspection. There is no user, no
# id_token, and no logout concept (the bearer token expires on its
# own; revocation goes through Hydra's /admin/oauth2/auth/clients).

presentation:
  name: LLM
  description: Family LLM endpoint. Bearer-token auth via Hydra client credentials.
  url: https://llm.othala.test
  icon: LM
  auth_kind: oidc
  access_group: access-llm
  order: 120

oidc:
  client_id: llm
  client_name: vLLM
  grant_types:
    - client_credentials
  response_types: []
  scope: api
  audience:
    - https://llm.othala.test
  token_endpoint_auth_method: client_secret_basic
  skip_consent: true
  # backchannel_logout_uri: not applicable to client_credentials. There
  # is no per-user session at vLLM; access tokens expire normally and
  # are revoked at Hydra.

# Consent claim shape for this client.
#
# vLLM upstream supports only static API key auth; it does not parse
# OIDC roles or groups. The Caddy sidecar in front of vLLM does
# Hydra introspect on the bearer token and admits requests when active.
# There is no per-user role distinction at the app: a valid token =
# allowed, anything else = 401. This is a client-credentials flow, so
# there is no Kratos identity in scope: the token belongs to the
# machine client.
#
# When per-user gating is needed (e.g., to restrict the kids cohort),
# the gate must live in Caddy, not in claims. For now: any valid token
# can hit the model.
#
# skip_access_check: true because the c_c flow has no user and no
# access-llm group can apply. The consent gate would never fire here in
# practice, but setting the flag makes the intent explicit.
#
# Source: https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
consent:
  emit_groups_claim: false
  skip_access_check: true
  roles:
    client:
      description: "Bearer token holder. No per-user distinction."
      claim_emit: {}
  group_role_map: {}
