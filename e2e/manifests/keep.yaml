# Vaultwarden — keep.othala.test
# Unified app catalog entry for the dag.othala.test instance.
# Merged from: hydra/clients/keep.yaml + portal/src/content/apps/keep.md
#              + portal/preview-manifests/keep.yaml
#
# Vaultwarden mainline accepts SSO via OIDC; the SSO module supports
# OIDC back-channel logout when configured with the appropriate logout
# endpoint, but the surface is fragile (the wiki documents OIDC SLO
# without explicitly listing back-channel). The endpoint below is set
# optimistically; if Vaultwarden returns 4xx on the logout token in the
# lab, fall back to admin session revoke and document the gap.

presentation:
  name: Keep
  description: "Family password vault. End-to-end encrypted; SSO controls account access, master password unlocks the vault."
  url: https://keep.othala.test
  icon: KP
  icon_slug: vaultwarden
  auth_kind: oidc
  access_group: access-keep
  order: 10

oidc:
  client_id: keep
  client_name: Vaultwarden
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://keep.othala.test/identity/connect/oidc-signin
  post_logout_redirect_uris:
    - https://keep.othala.test/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://keep.othala.test
  skip_consent: true
  backchannel_logout_uri: https://keep.othala.test/identity/connect/oidc-logout

# Consent claim shape for this client.
#
# Vaultwarden upstream (dani-garcia, the redirect_uri matches its
# /identity/connect/oidc-signin path) accepts SSO via OIDC but does not
# yet expose role-to-claim mapping in mainline; the role-mapping work
# tracks in PR #6158 / fork OIDCWarden. Org membership via groups is on
# the same trajectory. Until upstream lands these, the consent service
# emits a `groups` array claim and Vaultwarden treats every signed-in
# user as a regular member; admin-console access uses the local admin
# token, not OIDC.
#
# When upstream merges role mapping, the app side will read
# /resource_access/keep/roles by default (SSO_ROLES_TOKEN_PATH). The
# claim shape below pre-stages that path so flipping the app env is the
# only production change.
#
# Source: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-SSO-support-using-OpenId-Connect
# Role-mapping PR: https://github.com/dani-garcia/vaultwarden/pull/6158
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Admin console access once upstream role mapping ships."
      claim_emit:
        groups: ["admin"]
        resource_access:
          keep:
            roles: ["admin"]
    user:
      description: "Browse and manage own vault."
      claim_emit:
        groups: ["family"]
        resource_access:
          keep:
            roles: ["user"]
  group_role_map:
    admin: admin
    family: user
    friends: user
    kids: user
