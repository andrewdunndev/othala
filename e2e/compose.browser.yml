# Browser-profile compose override, layered on compose.yml only for the browser run:
#
#   docker compose -f compose.yml -f compose.browser.yml --profile browser up -d
#
# The recovery webhooks reach the portal's admin port from the kratos container, so it cannot
# stay on loopback, and listen.mjs FATALs on a wildcard ADMIN_HOST. Production has the same shape:
# portal and Kratos are separate containers on one internal bridge, the portal binds its own
# static IP and Kratos reaches it via the `othala` hostname. The smoke run keeps loopback since
# it never exercises the cross-container webhook path.

services:
  othala:
    environment:
      ADMIN_HOST: "10.89.11.12"
    networks:
      default:
        ipv4_address: 10.89.11.12
    healthcheck:
      # The admin port is on the static IP, not loopback.
      test: ["CMD", "node", "-e", "fetch('http://10.89.11.12:4431/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.89.11.0/24
