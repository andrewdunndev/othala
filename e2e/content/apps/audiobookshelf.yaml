# Audiobookshelf: the minimal generic_oauth client and the access-model fixture
# (t-access-model.spec.ts; site guides/per-app-oidc.md; DECISIONS.md).

presentation:
  name: Audiobookshelf
  description: Self-hosted audiobook and podcast server with multi-user progress sync.
  url: https://audiobookshelf.othala.test
  icon: AB
  auth_kind: oidc
  # Entry only; audiobookshelf-admin is a role and is deliberately absent here.
  access:
    - audiobookshelf-access
  order: 40
  group: media

oidc:
  client_id: audiobookshelf
  client_name: Audiobookshelf
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  # offline_access is required or Hydra silently omits the refresh token.
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://audiobookshelf.othala.test/auth/openid/callback
  post_logout_redirect_uris:
    - https://audiobookshelf.othala.test/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://audiobookshelf.othala.test
  skip_consent: true
  backchannel_logout_uri: https://audiobookshelf.othala.test/auth/openid/logout

# Audiobookshelf maps a configurable group claim to its own account types:
# https://www.audiobookshelf.org/guides/oidc_authentication/
consent:
  emit_groups_claim: true
  roles:
    # Declaration order is rank, descending privilege (see grafana.yaml).
    admin:
      description: "Server admin: users, libraries, settings."
      claim_emit:
        groups: ["admin"]
    user:
      description: "Listen and sync progress."
      claim_emit:
        groups: ["user"]
  group_role_map:
    audiobookshelf-admin: admin
    audiobookshelf-access: user
