# Hydra config for CI lab. Mirrors production hydra/hydra.yml with the
# lab DSN host + http issuer URL (the smoke suite hits container ports
# directly; the issuer string is what Hydra emits in id_token iss claims,
# which the smoke matches against the WebFinger fixture and openid-config).

dsn: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable

serve:
  public:
    port: 4444
    cors:
      enabled: true
      allowed_origins:
        - http://auth-lab.${LAB_DOMAIN}
      allowed_methods: [GET, POST, PUT, DELETE]
      allowed_headers:
        - Authorization
        - Content-Type
      allow_credentials: true
  admin:
    port: 4445

urls:
  self:
    issuer: http://auth-lab.${LAB_DOMAIN}/
    public: http://auth-lab.${LAB_DOMAIN}/

  login: http://auth-lab.${LAB_DOMAIN}/oauth2/login
  consent: http://auth-lab.${LAB_DOMAIN}/oauth2/consent
  logout: http://auth-lab.${LAB_DOMAIN}/oauth2/logout
  error: http://auth-lab.${LAB_DOMAIN}/auth/error
  post_logout_redirect: http://auth-lab.${LAB_DOMAIN}/

oidc:
  subject_identifiers:
    supported_types:
      - public
    pairwise:
      salt: ${HYDRA_PAIRWISE_SALT}

ttl:
  access_token: 1h
  refresh_token: 720h
  id_token: 1h
  auth_code: 10m
  login_consent_request: 1h

oauth2:
  pkce:
    enforced: false
    enforced_for_public_clients: false
  hashers:
    bcrypt:
      cost: 10
  expose_internal_errors: true   # lab: leak details for debug
  client_credentials:
    default_grant_allowed_scope: false

secrets:
  system:
    - ${HYDRA_SYSTEM_SECRET}
  cookie:
    - ${HYDRA_COOKIE_SECRET_CURRENT}
    - ${HYDRA_COOKIE_SECRET_PREVIOUS}

log:
  level: info
  format: json
  leak_sensitive_values: true   # lab: debug-friendly
