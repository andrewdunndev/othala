# Othala end-to-end harness — converged substrate for compose.
#
# This is the project's canonical OSS-facing end-to-end example: it shows
# how Othala ("Ory for your home") stands up on plain `docker compose`
# from the published images. It doubles as the CI `e2e` gate, consumed by
# e2e/validate.sh inside a per-job Fedora VM spawned by the carmine GitLab
# Runner (Custom Executor, tag carmine,qemu). The VM is ephemeral; the
# substrate dies with the VM at job end. An adopter can run the same file
# on a workstation (see README.md "Local operator invocation").
#
# Converged topology (mirrors what the deploy repo's services/dag now models):
#   - postgres (kratos + hydra dbs)
#   - kratos-migrate (oneshot)
#   - kratos (public 4433, admin 4434)
#   - hydra-migrate (oneshot)
#   - hydra (public 4444, admin 4445)
#   - othala (the converged Astro Node SSR app, ONE image at the registry
#     ROOT ${AUTH_REGISTRY}). Public SSR port 8080 serves the family UI +
#     /auth/* + /admin/* pages + the Hydra login/consent/logout challenge
#     handlers at /oauth2/{login,consent,logout}. A SEPARATE loopback
#     admin port 4431 serves /healthz, /readyz, /admin/revoke-user and
#     /admin/recovery-gate. The two muxes are disjoint by construction.
#   NOTE: the LDAP bridge (glauth-kratos) is now a separate standalone
#   project at gitlab.com/dunn.dev/kratos-ldap. No e2e spec exercises
#   LDAP, so no ldap-bridge service is pulled here. Operators who need
#   LDAP in their lab compose can add the kratos-ldap image directly.
#
# Convergence note: the legacy `consent` (Go) and `util` (Bash) services
# are GONE. Their roles folded INTO the othala app: consent's challenge
# handlers + recovery-gate are now the app's /oauth2/* public routes and
# its /admin/recovery-gate loopback route; util's apply-clients is the
# app's in-process registrar (the e2e invokes it as a one-shot — see
# smoke.sh section B). No consent/util CONTAINER or image is pulled.
#
# What's intentionally absent vs production:
#   - No Caddy / TLS / public DNS. Smoke probes hit container HTTP ports
#     directly via the compose default network. Production-shape TLS +
#     issuer-byte-match is validated separately (manual lab on real DNS,
#     or a future iteration that wires Caddy with `tls internal`).
#
# Image versions: ${AUTH_VERSION} comes from the environment. In CI the
# `e2e` job declares `needs: [build-othala, build-e2e-tester]`, so
# AUTH_VERSION resolves to the just-built tag (v-tag on tags, short-SHA
# on push). Local operator runs use AUTH_VERSION=latest. The app image is
# ${AUTH_REGISTRY} at the registry root.

services:
  postgres:
    image: docker.io/library/postgres:18-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa
    container_name: lab-postgres
    restart: "no"
    # --- Container hardening (P11) ---
    # no-new-privileges: safe on all OCI runtimes; prevents any setuid
    # binary inside the container from elevating past the container user.
    security_opt:
      - "no-new-privileges:true"
    # Drop ALL Linux capabilities, then add back ONLY what the postgres
    # entrypoint needs DURING INITIALIZATION. The container starts as root,
    # chowns/chmods PGDATA + /var/run/postgresql, then setuid-drops to the
    # postgres user (it does not bind a port < 1024). Under cap_drop: [ALL]
    # those startup steps fail with "chown: Operation not permitted" — even as
    # real root on the rootful socket, because dropping ALL removes CAP_CHOWN /
    # CAP_DAC_OVERRIDE / CAP_FOWNER, and the setpriv to postgres needs
    # CAP_SETUID / CAP_SETGID. (Proven on carmine: cap_drop:[ALL] alone fails
    # the chown; adding these five reaches "ready to accept connections".)
    # These are init-time only; postgres holds none of them once it has dropped
    # to its unprivileged user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # NEEDS-CARMINE-VALIDATION: read_only on postgres is deliberately omitted.
    # Postgres writes to: its PGDATA directory (named volume / bind), the
    # pg_wal directory, temporary sort files under /tmp, Unix socket files
    # under /var/run/postgresql, and various lock files. While tmpfs mounts
    # can cover /tmp and /var/run/postgresql, the PGDATA tree is a named volume
    # (not rootfs) so it would not be blocked by read_only — BUT the postgres
    # entrypoint script also writes init markers and pg_hba.conf into PGDATA at
    # startup, which means any residual writes outside PGDATA (e.g. /run, /etc
    # minor writes by the entrypoint) could silently break startup. Adding
    # read_only: true to postgres risks an opaque startup failure; validate on
    # carmine before enabling.
    pids_limit: 512
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Mail catcher — proves the courier path (Kratos recovery/verification) AND
  # the portal contact form actually deliver. SMTP on :1025 (what both Kratos
  # and the portal mailer dial via OTHALA_SMTP_CONNECTION_URI), HTTP API on
  # :8025 (smoke.sh Section H queries /api/v1/messages to assert delivery).
  # No auth/TLS: mailpit accepts plain SMTP, matching the e2e connection URI.
  mailpit:
    image: docker.io/axllent/mailpit:latest@sha256:956d688cbd13dca36c72d8e94c34d6d1cdf4a005aa6aa4ff6edaaac56c34d8df
    container_name: lab-mailpit
    restart: unless-stopped
    # --- Container hardening (P11) ---
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # read_only: mailpit writes UI state / message storage to an in-process
    # sqlite DB (default /data/mailpit.db). If run without a named volume for
    # /data it writes to rootfs. NEEDS-CARMINE-VALIDATION: add read_only: true
    # plus tmpfs: [/tmp] once the data path is confirmed (either a named volume
    # or confirmed to be irrelevant for the e2e ephemeral run).
    pids_limit: 256
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      # mailpit ships a built-in healthcheck helper on its own binary.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  kratos-migrate:
    image: docker.io/oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    container_name: lab-kratos-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
      # All vars consumed by the canonical kratos/kratos.yml after the scripts/render-config.sh render.
      # Instance identity
      OTHALA_PUBLIC_URL: ${OTHALA_PUBLIC_URL}
      OTHALA_APEX: ${OTHALA_APEX}
      OTHALA_WEBAUTHN_RP_ID: ${OTHALA_WEBAUTHN_RP_ID}
      OTHALA_WEBAUTHN_RP_ORIGINS: ${OTHALA_WEBAUTHN_RP_ORIGINS}
      OTHALA_INSTANCE_NAME: ${OTHALA_INSTANCE_NAME}
      OTHALA_SMTP_FROM_ADDRESS: ${OTHALA_SMTP_FROM_ADDRESS}
      OTHALA_HIBP_ENABLED: ${OTHALA_HIBP_ENABLED}
      OTHALA_PASSWORD_MIN_LENGTH: ${OTHALA_PASSWORD_MIN_LENGTH}
      # Host routing (compose service names)
      KRATOS_PG_HOST: postgres
      KRATOS_ADMIN_HOST: kratos
      CONSENT_HOST: othala
      # Secrets (needed by kratos.yml even in migrate mode to pass config validation)
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      KRATOS_COOKIE_SECRET_CURRENT: ${KRATOS_COOKIE_SECRET_CURRENT}
      KRATOS_CIPHER_SECRET_CURRENT: ${KRATOS_CIPHER_SECRET_CURRENT}
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
      SMTP_USER: lab
      SMTP_PASS: lab
    volumes:
      - ./kratos.rendered.yml:/etc/config/kratos/kratos.yml:ro,z
      - ../kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro,z
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos/kratos.yml"]

  kratos:
    image: docker.io/oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    container_name: lab-kratos
    restart: unless-stopped
    # --- Container hardening (P11) ---
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Kratos binds ports 4433/4434 (both > 1024) so NET_BIND_SERVICE is NOT
    # needed. No cap_add required.
    read_only: true
    tmpfs:
      - /tmp
    # Kratos writes only to /tmp at runtime (temp flow files, session state
    # is in postgres). Its config + identity schema are mounted read-only
    # above. No additional tmpfs paths needed.
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
      # All vars consumed by the canonical kratos/kratos.yml after the scripts/render-config.sh render.
      # Instance identity
      OTHALA_PUBLIC_URL: ${OTHALA_PUBLIC_URL}
      OTHALA_APEX: ${OTHALA_APEX}
      OTHALA_WEBAUTHN_RP_ID: ${OTHALA_WEBAUTHN_RP_ID}
      OTHALA_WEBAUTHN_RP_ORIGINS: ${OTHALA_WEBAUTHN_RP_ORIGINS}
      OTHALA_INSTANCE_NAME: ${OTHALA_INSTANCE_NAME}
      OTHALA_SMTP_FROM_ADDRESS: ${OTHALA_SMTP_FROM_ADDRESS}
      OTHALA_HIBP_ENABLED: ${OTHALA_HIBP_ENABLED}
      OTHALA_PASSWORD_MIN_LENGTH: ${OTHALA_PASSWORD_MIN_LENGTH}
      # Secrets
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      KRATOS_COOKIE_SECRET_CURRENT: ${KRATOS_COOKIE_SECRET_CURRENT}
      KRATOS_CIPHER_SECRET_CURRENT: ${KRATOS_CIPHER_SECRET_CURRENT}
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
      SMTP_USER: lab
      SMTP_PASS: lab
      # Host routing (compose service names)
      KRATOS_PG_HOST: postgres
      KRATOS_ADMIN_HOST: kratos
      CONSENT_HOST: othala
    volumes:
      - ./kratos.rendered.yml:/etc/config/kratos/kratos.yml:ro,z
      - ../kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro,z
      - ../kratos/hooks/recovery-gate.jsonnet:/etc/config/kratos/hooks/recovery-gate.jsonnet:ro,z
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml", "--dev", "--watch-courier"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4434/admin/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s

  hydra-migrate:
    image: docker.io/oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    container_name: lab-hydra-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable
      HYDRA_PG_HOST: postgres
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
    command: ["migrate", "sql", "-e", "--yes"]

  hydra:
    image: docker.io/oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    container_name: lab-hydra
    restart: unless-stopped
    # --- Container hardening (P11) ---
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Hydra binds ports 4444/4445 (both > 1024). No cap_add required.
    read_only: true
    tmpfs:
      - /tmp
    # Hydra writes only to /tmp at runtime (crypto scratch, temp JWK files).
    # Its config is mounted read-only; JWKS material is stored in postgres.
    pids_limit: 512
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
      HYDRA_SYSTEM_SECRET: ${HYDRA_SYSTEM_SECRET}
      HYDRA_COOKIE_SECRET_CURRENT: ${HYDRA_COOKIE_SECRET_CURRENT}
      HYDRA_PAIRWISE_SALT: ${HYDRA_PAIRWISE_SALT}
      # Host routing + instance identity consumed by canonical hydra.yml
      HYDRA_PG_HOST: postgres
      OTHALA_PUBLIC_URL: ${OTHALA_PUBLIC_URL}
    volumes:
      - ./hydra.rendered.yml:/etc/config/hydra/hydra.yml:ro,z
    command: ["serve", "all", "--config", "/etc/config/hydra/hydra.yml", "--dev"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4445/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s

  # The converged Othala app — ONE image at the registry ROOT
  # (${AUTH_REGISTRY}, e.g. registry.gitlab.com/dunn.dev/othala). No
  # /portal sub-path, no separate consent/util container. The single
  # process binds two listeners (portal/src/server/listen.mjs):
  #   - PUBLIC SSR port 8080: family UI + /auth/* + /admin/* pages + the
  #     Hydra login/consent/logout challenge handlers /oauth2/{login,
  #     consent,logout}.
  #   - ADMIN port 4431 (bound on loopback 127.0.0.1 inside the
  #     container): /healthz, /readyz, /admin/revoke-user,
  #     /admin/recovery-gate. Disjoint from the public mux.
  # The admin port is loopback-only, so the healthcheck and the
  # admin-route smoke probes run via `compose exec` against
  # localhost:4431 INSIDE the container — they are not reachable across
  # the compose network (production-faithful: only Caddy fronts 8080).
  # ADMIN_PORT=4431 aligns with the portal code default (listen.mjs:40)
  # and the deployed quadlet — single admin-port convention across envs.
  othala:
    image: ${AUTH_REGISTRY}:${AUTH_VERSION}
    container_name: lab-othala
    restart: unless-stopped
    # --- Container hardening (P11) ---
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Othala binds ports 8080 (public SSR) and 4431 (loopback admin) — both
    # > 1024. No NET_BIND_SERVICE needed. The Node.js process does not require
    # any other capability.
    read_only: true
    tmpfs:
      - /tmp
    # Node.js writes temp files under /tmp (e.g. form upload scratch, V8
    # snapshot files). The manifests volume is mounted read-only. No other
    # rootfs paths are written at runtime.
    # NEEDS-CARMINE-VALIDATION: confirm that the Astro SSR adapter (Node
    # standalone) does not write to /app or any other non-/tmp rootfs path at
    # startup (e.g. compiled route caches). If it does, add that path to tmpfs.
    pids_limit: 512
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      # Internal service URLs (compose names; the deploy plane uses container names on auth.network)
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      # Instance identity (consumed by the app for UI + OIDC issuer context)
      OTHALA_PUBLIC_URL: ${OTHALA_PUBLIC_URL}
      OTHALA_INSTANCE_NAME: ${OTHALA_INSTANCE_NAME}
      OTHALA_APEX: ${OTHALA_APEX}
      MANIFEST_DIR: /etc/portal/manifests
      CSRF_SECRET: ${CSRF_SECRET}
      # ADR 0008 admin model: authority is metadata_admin.admin===true (boolean
      # marker in Kratos, set via admin API only). The OTHALA_ADMIN_IDS env var
      # is retired — no UUID allowlist, no portal recreate after seeding.
      # The recovery-gate reads is_admin from the webhook payload (set by
      # recovery-gate.jsonnet from the metadata_admin.admin field).
      OTHALA_ADMIN_ENDPOINT_BEARER: ${OTHALA_ADMIN_ENDPOINT_BEARER}
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
      # Contact-form mailer: SAME courier connection Kratos uses (mailpit in
      # the e2e). The portal contact form (/api/request) delivers here.
      OTHALA_SMTP_CONNECTION_URI: ${OTHALA_SMTP_CONNECTION_URI}
      OTHALA_SMTP_FROM_ADDRESS: ${OTHALA_SMTP_FROM_ADDRESS}
      OTHALA_CONTACT_RECIPIENT: ${OTHALA_CONTACT_RECIPIENT}
      HOST: 0.0.0.0
      PORT: "8080"
      ADMIN_HOST: 127.0.0.1
      ADMIN_PORT: "4431"
    volumes:
      - ./manifests:/etc/portal/manifests:ro,z
    healthcheck:
      # /healthz lives on the loopback ADMIN port (4431), not the public
      # SSR port. Probe it from inside the container.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4431/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Client registration — the active production registration path (E1 cutover
  # complete). util/apply-clients.sh is deleted; its role is now the in-process
  # registrar (portal/src/lib/register-clients.ts -> registerAllClients),
  # bundled into the image at dist/server/register-clients.mjs
  # (npm run build:register-clients, same esbuild pattern as admin-runtime).
  # In production the deploy repo runs this as a --rm one-shot on boot and on
  # SIGHUP (dag-reload-clients). The e2e activates it as a `compose run --rm`
  # one-shot on the SAME othala image to prove the registrar registers every
  # manifest in MANIFEST_DIR=/etc/portal/manifests (mounted from
  # e2e/manifests/) against Hydra admin. See smoke.sh section B.
  # `profiles: [oneshot]` keeps it out of the up/healthcheck loop —
  # smoke runs it explicitly via `compose run`.
  register-clients:
    image: ${AUTH_REGISTRY}:${AUTH_VERSION}
    container_name: lab-register-clients
    profiles: ["oneshot"]
    depends_on:
      hydra:
        condition: service_healthy
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      MANIFEST_DIR: /etc/portal/manifests
      # register-clients.mjs imports the app config module (config.ts), which
      # requires OTHALA_PUBLIC_URL at load (required-no-default in production).
      # The othala/ldap services already get it; the one-shot registrar needs it too.
      OTHALA_PUBLIC_URL: http://auth.othala.test
      # config.ts also requires OTHALA_SMTP_CONNECTION_URI (the contact-form
      # mailer). The registrar doesn't send mail but shares the image + its
      # config contract, so it sets the same relay the othala service does.
      OTHALA_SMTP_CONNECTION_URI: ${OTHALA_SMTP_CONNECTION_URI}
      # config.ts resolves a contact recipient at load. Same image, same config contract.
      OTHALA_CONTACT_RECIPIENT: ${OTHALA_CONTACT_RECIPIENT}
      # Per-client secrets for every fixture with an oidc: block. The
      # generic example set registers three OIDC clients: grafana,
      # audiobookshelf, openwebui (client_id "openwebui").
      GRAFANA_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET}
      AUDIOBOOKSHELF_CLIENT_SECRET: ${AUDIOBOOKSHELF_CLIENT_SECRET}
      OPENWEBUI_CLIENT_SECRET: ${OPENWEBUI_CLIENT_SECRET}
    volumes:
      - ./manifests:/etc/portal/manifests:ro,z
    command: ["node", "./dist/server/register-clients.mjs"]

  # OIDC dance runner (profile: oneshot) — Section G of smoke.sh.
  # Runs oidc-dance.mjs from inside the compose net using the PREBAKED
  # e2e-tester image (Containerfile): the npm deps (@ory/client-fetch,
  # tough-cookie, fetch-cookie, jose) AND the e2e sources are baked in at
  # /test at image-build time, so there is NO runtime `npm install` — the
  # carmine inner VM can't reach the npm registry (it would stall + exit
  # 124). Runs as a one-shot via
  # `docker compose --profile oneshot run --rm --no-deps dance-runner`.
  # smoke.sh Section G's run_dance helper drives this.
  # Uses othala:8080 (service name) as APP since it is NOT inside the othala container.
  dance-runner:
    image: ${AUTH_REGISTRY}/e2e-tester:${AUTH_VERSION}
    # No container_name: compose run --rm creates ephemeral unique names;
    # a fixed name would conflict when G1/G2/G3 run in sequence.
    profiles: ["oneshot"]
    depends_on:
      othala:
        condition: service_healthy
      hydra:
        condition: service_healthy
    environment:
      OTHALA_URL: http://othala:8080
    working_dir: /test
    # Deps + sources are prebaked at /test; just run node. smoke.sh passes
    # the substituted dance script via stdin.
    entrypoint: ["node"]

  # Browser-test edge (profile: browser ONLY). Fronts app + Kratos + Hydra on ONE
  # host so a real browser can drive the integrated login -> consent -> token flow.
  # NOT part of the golden run (D10: the edge is operator-out-of-scope) — starts only
  # with `docker compose --profile browser up`. Published on the host :8088 so an
  # interactive agent-browser (Playwright) can reach it via an ssh tunnel to the VM.
  caddy:
    image: docker.io/library/caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: lab-caddy
    profiles: ["browser"]
    restart: unless-stopped
    # --- Container hardening (P11) ---
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # This e2e Caddy binds port 80 INSIDE the container (published as 8088 on
    # the host). Port 80 is < 1024, so the process needs NET_BIND_SERVICE to
    # bind it without running as root. Caddy's Alpine image drops to a
    # non-root user after startup; if it doesn't, check the image. Add
    # NET_BIND_SERVICE conservatively.
    # NEEDS-CARMINE-VALIDATION: confirm Caddy in caddy:2-alpine uses a
    # non-root user (UID != 0). If it runs as root, NET_BIND_SERVICE is
    # redundant (root can bind any port) but harmless. If non-root, it is
    # required to bind :80.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      # Caddy writes its ACME/cert state and auto-HTTPS data here. In this
      # e2e context it uses plain HTTP (port 80, no TLS), but Caddy still
      # writes a data dir at startup.
      - /data
      - /config
      - /tmp
    pids_limit: 256
    depends_on:
      othala:
        condition: service_healthy
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
    volumes:
      - ./caddy.Caddyfile:/etc/caddy/Caddyfile:ro,z
    ports:
      - "8088:80"
    networks:
      default:
        # ONE public host that resolves to the edge from inside the net — both the
        # in-net browser AND the app's server-side use it (the production split-
        # horizon shape: browser -> Caddy, server-side -> Caddy, one host). MUST be a
        # subdomain of the Kratos cookie domain (othala.test) or the CSRF cookie is
        # never sent back and the login flow redirect-loops (finding 2026-06-03).
        aliases:
          - auth.othala.test

  # Browser e2e test runner (profile: browser ONLY). Runs INSIDE the compose net,
  # resolves auth.othala.test → Caddy, drives the four human-flow assertions (A/B/C/D)
  # via @playwright/test specs (e2e/playwright/tests/*.spec.ts). Screenshots + test
  # output land in ./browser-out for CI artifact upload.
  #
  # The base mcr.microsoft.com/playwright image ships Chromium + all browser
  # binaries pre-installed at /ms-playwright. The PREBAKED e2e-tester image
  # (Containerfile, FROM that base) additionally bakes the @playwright/test
  # npm package + the e2e sources into /test at image-build time. There is
  # therefore NO runtime `npm install` — the install happens on the
  # egress-capable build runner, not in the no-egress carmine inner VM
  # where a runtime install stalls and times out the gate (exit 124).
  # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 (also set in the image) prevents a
  # redundant download.
  #
  # Split-horizon fix: compose.browser.yml overrides othala
  # KRATOS_PUBLIC_URL=http://auth.othala.test for the browser profile. The golden
  # run keeps the internal kratos:4433 (fast, no Caddy hop); the browser profile
  # needs the public host so browserFlows redirect URLs resolve in Chromium and
  # ory_kratos_session is scoped to othala.test. See compose.browser.yml for the
  # full rationale (finding 2026-06-10).
  playwright:
    image: ${AUTH_REGISTRY}/e2e-tester:${AUTH_VERSION}
    container_name: lab-playwright
    profiles: ["browser"]
    depends_on:
      caddy:
        condition: service_started
      othala:
        condition: service_healthy
    environment:
      BASE: http://auth.othala.test
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      # J2 direct probe: recovery-gate on the othala admin port.
      # In the browser profile othala binds :4431 to its static internal IP
      # (ADMIN_HOST override in compose.browser.yml); the `othala` service
      # hostname resolves to that IP inside the compose net.
      OTHALA_ADMIN_URL: http://othala:4431
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
      GRAFANA_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes:
      # Only the artifact sink is mounted: specs + node_modules are baked
      # into the image at /test. browser-out captures screenshots + the
      # html report for CI artifact upload.
      - ./browser-out:/out:z
    working_dir: /test
    # Deps + specs prebaked at /test; just run the suite. No npm install.
    command: ["npx", "playwright", "test", "--config=playwright.config.ts"]
