# Othala end-to-end harness: the converged substrate on plain docker compose, and the
# CI e2e gate (driven by e2e/validate.sh; local runs: README.md).
# Absent vs production: Caddy, TLS and DNS; smoke probes hit container ports directly.
# AUTH_VERSION comes from the environment (CI: the just-built tag; local: latest);
# the app image is ${AUTH_REGISTRY} at the registry root.

services:
  postgres:
    image: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: lab-postgres
    restart: "no"
    # Container hardening: no-new-privileges, drop all caps.
    security_opt:
      - "no-new-privileges:true"
    # cap_add is init-time only: the entrypoint chowns PGDATA, then drops to postgres;
    # cap_drop ALL alone fails with "chown: Operation not permitted".
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # Writable on purpose: throwaway e2e harness.
    pids_limit: 512
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Mail catcher: SMTP :1025 for Kratos and the portal mailer, HTTP API :8025 for
  # smoke.sh Section H.
  mailpit:
    image: docker.io/axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    container_name: lab-mailpit
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Writable on purpose: throwaway e2e harness.
    pids_limit: 256
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  kratos-migrate:
    image: docker.io/oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    container_name: lab-kratos-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./kratos.rendered.yml:/etc/config/kratos/kratos.yml:ro,z
      - ./kratos.e2e.yml:/etc/config/kratos/e2e.yml:ro,z
      - ../kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro,z
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos/kratos.yml", "--config", "/etc/config/kratos/e2e.yml"]

  kratos:
    image: docker.io/oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    container_name: lab-kratos
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Writes only to /tmp at runtime; config is mounted read-only.
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    volumes:
      - ./kratos.rendered.yml:/etc/config/kratos/kratos.yml:ro,z
      - ./kratos.e2e.yml:/etc/config/kratos/e2e.yml:ro,z
      - ../kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro,z
      - ../kratos/hooks/recovery-gate.jsonnet:/etc/config/kratos/hooks/recovery-gate.jsonnet:ro,z
      - ./courier.rendered:/etc/config/kratos/courier:ro,z
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml", "--config", "/etc/config/kratos/e2e.yml", "--dev", "--watch-courier"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4434/admin/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s

  hydra-migrate:
    image: docker.io/oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    container_name: lab-hydra-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./hydra.rendered.yml:/etc/config/hydra/hydra.yml:ro,z
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/hydra/hydra.yml"]

  hydra:
    image: docker.io/oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    container_name: lab-hydra
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Writes only to /tmp at runtime; config is mounted read-only.
    pids_limit: 512
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    volumes:
      - ./hydra.rendered.yml:/etc/config/hydra/hydra.yml:ro,z
    command: ["serve", "all", "--config", "/etc/config/hydra/hydra.yml", "--dev"]
    healthcheck:
      # Public listener: the only one whose request_log.disable_for_health
      # silences a health probe (hydra.yml serve.admin.request_log).
      test: ["CMD-SHELL", "wget -qO- http://localhost:4444/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s

  # The converged app: one image, two listeners (portal/src/server/listen.ts): public SSR
  # 8080 and an internal-network admin listener (PORTAL_ADMIN_BIND_HOST) on 4431 (/healthz, /readyz, Kratos webhooks; smoke, the browser overlay binds the static IP), so the
  # healthcheck and admin smoke probes run via `compose exec` inside the container.
  othala:
    image: ${AUTH_REGISTRY}:${AUTH_VERSION}
    container_name: lab-othala
    restart: unless-stopped
    # Static in-net IP from first creation so the browser overlay's PORTAL_ADMIN_BIND_HOST recreate
    # cannot collide; needs the subnet declared at the bottom.
    networks:
      default:
        ipv4_address: 10.89.11.12
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      # Instance identity (consumed by the app for UI + OIDC issuer context)
      OTHALA_PUBLIC_URL: ${OTHALA_PUBLIC_URL}
      OTHALA_INSTANCE_NAME: ${OTHALA_INSTANCE_NAME}
      OTHALA_APEX: ${OTHALA_APEX}
      CSRF_SECRET: ${CSRF_SECRET}
      # Admin authority is metadata_admin.admin===true, set via the Kratos admin API only.
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
      # Contact-form mailer: the same courier connection Kratos uses.
      OTHALA_SMTP_CONNECTION_URI: ${OTHALA_SMTP_CONNECTION_URI}
      OTHALA_CONTACT_RECIPIENT: ${OTHALA_CONTACT_RECIPIENT}
      # Per-client secrets the boot reconcile resolves for each oidc: fixture.
      GRAFANA_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET}
      AUDIOBOOKSHELF_CLIENT_SECRET: ${AUDIOBOOKSHELF_CLIENT_SECRET}
      PROMPTDESK_CLIENT_SECRET: ${PROMPTDESK_CLIENT_SECRET}
      PORTAL_ADMIN_BIND_HOST: 127.0.0.1
    volumes:
      - ./manifests:/etc/portal/manifests:ro,z
    healthcheck:
      # /healthz is on the loopback admin port; probe inside the container.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4431/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # OIDC dance runner (profile: oneshot), smoke.sh Section G. Runs oidc-dance.mjs against
  # othala:8080 from the prebaked e2e-tester image (deps + sources at /test; the inner
  # VM has no npm egress).
  dance-runner:
    image: ${AUTH_REGISTRY}/e2e-tester:${AUTH_VERSION}
    # No container_name: a fixed name would conflict across G1/G2/G3.
    profiles: ["oneshot"]
    depends_on:
      othala:
        condition: service_healthy
      hydra:
        condition: service_healthy
    environment:
      OTHALA_URL: http://othala:8080
    working_dir: /test
    # smoke.sh passes the dance script via stdin.
    entrypoint: ["node"]

  # Edge: fronts app, Kratos and Hydra on one host (auth.othala.test, :8088 published) so smoke
  # and the browser run reach the stack as in production; the portal itself calls Kratos and Hydra directly.
  caddy:
    # dunn.dev/caddy, not stock caddy: n-rate-limits.spec.ts needs rate_limit. Same
    # tag as production (iac dag-caddy.container); re-resolve via skopeo inspect.
    image: registry.gitlab.com/dunn.dev/caddy:v2.11.4-3@sha256:78e84240c3c703bb374aa003424c56143376c621a0b7e17cc6bcf009eec86446
    container_name: lab-caddy
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Binds port 80 (< 1024), so NET_BIND_SERVICE is added.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      # ACME/cert data dir (plain HTTP here, but Caddy still writes it).
      - /data
      - /config
      - /tmp
    pids_limit: 256
    depends_on:
      othala:
        condition: service_healthy
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
    volumes:
      - ./caddy.Caddyfile:/etc/caddy/Caddyfile:ro,z
    ports:
      - "8088:80"
    networks:
      default:
        # One public host resolving to the edge for browser and server-side alike; MUST be
        # a subdomain of the Kratos cookie domain (othala.test) or the CSRF cookie is never sent.
        aliases:
          - auth.othala.test
          - proxywatch.othala.test

  # Browser e2e runner (profile: browser only): resolves auth.othala.test to Caddy and runs
  # the /test specs from the prebaked e2e-tester image (no runtime npm install;
  # the inner VM has no egress).
  playwright:
    image: ${AUTH_REGISTRY}/e2e-tester:${AUTH_VERSION}
    container_name: lab-playwright
    profiles: ["browser"]
    depends_on:
      caddy:
        condition: service_started
      othala:
        condition: service_healthy
    environment:
      BASE: http://auth.othala.test
      OTHALA_INSTANCE_NAME: ${OTHALA_INSTANCE_NAME}
      # J2: recovery-gate on the othala admin port (static IP via PORTAL_ADMIN_BIND_HOST in compose.browser.yml).
      OTHALA_ADMIN_URL: http://othala:4431
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
      GRAFANA_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    volumes:
      # Only the artifact sink is mounted; specs are baked in at /test.
      - ./browser-out:/out:z
    working_dir: /test
    command: ["npx", "playwright", "test", "--config=playwright.config.ts"]

# Declared here so the default network is created with this subnet at smoke time (the
# overlay's static 10.89.11.12 must be in-subnet). Keep in lockstep with compose.browser.yml.
networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.89.11.0/24
