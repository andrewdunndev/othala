# Othala end-to-end harness — converged substrate for compose.
#
# This is the project's canonical OSS-facing end-to-end example: it shows
# how Othala ("Ory for your home") stands up on plain `docker compose`
# from the published images. It doubles as the CI `e2e` gate, consumed by
# e2e/validate.sh inside a per-job Fedora VM spawned by the carmine GitLab
# Runner (Custom Executor, tag carmine,qemu). The VM is ephemeral; the
# substrate dies with the VM at job end. An adopter can run the same file
# on a workstation (see README.md "Local operator invocation").
#
# Converged topology (mirrors what dunn.dev/iac services/dag now models):
#   - postgres (kratos + hydra dbs)
#   - kratos-migrate (oneshot)
#   - kratos (public 4433, admin 4434)
#   - hydra-migrate (oneshot)
#   - hydra (public 4444, admin 4445)
#   - othala (the converged Astro Node SSR app, ONE image at the registry
#     ROOT ${AUTH_REGISTRY}). Public SSR port 8080 serves the family UI +
#     /auth/* + /admin/* pages + the Hydra login/consent/logout challenge
#     handlers at /oauth2/{login,consent,logout}. A SEPARATE loopback
#     admin port 8431 serves /healthz, /readyz, /admin/revoke-user and
#     /admin/recovery-gate. The two muxes are disjoint by construction.
#   - ldap-bridge (LDAP 389; admin /healthz on 6478)
#
# Convergence note: the legacy `consent` (Go) and `util` (Bash) services
# are GONE. Their roles folded INTO the othala app: consent's challenge
# handlers + recovery-gate are now the app's /oauth2/* public routes and
# its /admin/recovery-gate loopback route; util's apply-clients is the
# app's in-process registrar (the e2e invokes it as a one-shot — see
# smoke.sh section B). No consent/util CONTAINER or image is pulled.
#
# What's intentionally absent vs production:
#   - No Caddy / TLS / public DNS. Smoke probes hit container HTTP ports
#     directly via the compose default network. Production-shape TLS +
#     issuer-byte-match is validated separately (manual lab on real DNS,
#     or a future iteration that wires Caddy with `tls internal`).
#
# Image versions: ${AUTH_VERSION} comes from the environment. In CI the
# `e2e` job declares `needs: [build-othala, build-ldap-bridge]`, so
# AUTH_VERSION resolves to the just-built tag (v-tag on tags, short-SHA
# on push). Local operator runs use AUTH_VERSION=latest. The app image is
# ${AUTH_REGISTRY} at the registry root; ldap-bridge is the
# ${AUTH_REGISTRY}/ldap-bridge sub-image.

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: lab-postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  kratos-migrate:
    image: docker.io/oryd/kratos:v26.2.0
    container_name: lab-kratos-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
      # Host env-vars used by canonical kratos.yml (env-substituted at
      # config load). Lab compose service names; iac quadlets set the
      # auth.network container names.
      KRATOS_PG_HOST: postgres
      KRATOS_ADMIN_HOST: kratos
      # Recovery-gate webhook target: the converged othala app's loopback
      # admin port. consent is gone; the gate is the app's
      # /admin/recovery-gate route.
      RECOVERY_GATE_HOST: othala
    volumes:
      - ./kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos/kratos.yml"]

  kratos:
    image: docker.io/oryd/kratos:v26.2.0
    container_name: lab-kratos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      KRATOS_COOKIE_SECRET_CURRENT: ${KRATOS_COOKIE_SECRET_CURRENT}
      KRATOS_COOKIE_SECRET_PREVIOUS: ${KRATOS_COOKIE_SECRET_PREVIOUS}
      KRATOS_CIPHER_SECRET_CURRENT: ${KRATOS_CIPHER_SECRET_CURRENT}
      KRATOS_CIPHER_SECRET_PREVIOUS: ${KRATOS_CIPHER_SECRET_PREVIOUS}
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
      SMTP_USER: lab
      SMTP_PASS: lab
      # Host env-vars consumed by canonical kratos.yml (env-substituted
      # at config load). See kratos-migrate above for the pattern.
      KRATOS_PG_HOST: postgres
      KRATOS_ADMIN_HOST: kratos
      # Recovery-gate webhook target host: the converged othala app
      # (admin port 8431). Was the consent service pre-convergence.
      RECOVERY_GATE_HOST: othala
    volumes:
      - ./kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./identity.schema.json:/etc/config/kratos/identity.schema.json:ro
      - ./recovery-gate.jsonnet:/etc/config/kratos/hooks/recovery-gate.jsonnet:ro
    command: ["serve", "all", "--config", "/etc/config/kratos/kratos.yml", "--dev"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4434/admin/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s

  hydra-migrate:
    image: docker.io/oryd/hydra:v26.2.0
    container_name: lab-hydra-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable
      HYDRA_PG_HOST: postgres
    command: ["migrate", "sql", "-e", "--yes"]

  hydra:
    image: docker.io/oryd/hydra:v26.2.0
    container_name: lab-hydra
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
      HYDRA_SYSTEM_SECRET: ${HYDRA_SYSTEM_SECRET}
      HYDRA_COOKIE_SECRET_CURRENT: ${HYDRA_COOKIE_SECRET_CURRENT}
      HYDRA_COOKIE_SECRET_PREVIOUS: ${HYDRA_COOKIE_SECRET_PREVIOUS}
      HYDRA_PAIRWISE_SALT: ${HYDRA_PAIRWISE_SALT}
      # Host env-var consumed by canonical hydra.yml.
      HYDRA_PG_HOST: postgres
    volumes:
      - ./hydra.yml:/etc/config/hydra/hydra.yml:ro
    command: ["serve", "all", "--config", "/etc/config/hydra/hydra.yml", "--dev"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4445/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s

  # The converged Othala app — ONE image at the registry ROOT
  # (${AUTH_REGISTRY}, e.g. registry.gitlab.com/dunn.dev/othala). No
  # /portal sub-path, no separate consent/util container. The single
  # process binds two listeners (portal/src/server/listen.mjs):
  #   - PUBLIC SSR port 8080: family UI + /auth/* + /admin/* pages + the
  #     Hydra login/consent/logout challenge handlers /oauth2/{login,
  #     consent,logout}.
  #   - ADMIN port 8431 (bound on loopback 127.0.0.1 inside the
  #     container): /healthz, /readyz, /admin/revoke-user,
  #     /admin/recovery-gate. Disjoint from the public mux.
  # The admin port is loopback-only, so the healthcheck and the
  # admin-route smoke probes run via `compose exec` against
  # localhost:8431 INSIDE the container — they are not reachable across
  # the compose network (production-faithful: only Caddy fronts 8080).
  othala:
    image: ${AUTH_REGISTRY}:${AUTH_VERSION}
    container_name: lab-othala
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
    environment:
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      HYDRA_ISSUER_URL: http://auth-lab.${LAB_DOMAIN}/
      MANIFEST_DIR: /etc/portal/manifests
      CSRF_SECRET: ${CSRF_SECRET}
      # CU3 admin model: the allowlist is the sole admin authority. The
      # recovery-gate refuses recovery for any identity whose email is on
      # this list. The smoke seeds a known admin email to exercise the
      # refuse path; everything else is non-admin.
      OTHALA_ADMIN_SUBJECTS: ${OTHALA_ADMIN_SUBJECTS}
      OTHALA_ADMIN_ENDPOINT_BEARER: ${OTHALA_ADMIN_ENDPOINT_BEARER}
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
      HOST: 0.0.0.0
      PORT: "8080"
      ADMIN_HOST: 127.0.0.1
      ADMIN_PORT: "8431"
    volumes:
      - ../hydra/clients:/etc/portal/manifests:ro
    healthcheck:
      # /healthz lives on the loopback ADMIN port (8431), not the public
      # SSR port. Probe it from inside the container.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8431/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  ldap-bridge:
    image: ${AUTH_REGISTRY}/ldap-bridge:${AUTH_VERSION}
    container_name: lab-ldap-bridge
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      KRATOS_BRIDGE_ADMIN_TOKEN: lab-bridge-token
      # Canonical glauth.cfg uses public_url_env / admin_url_env so the
      # file is topology-neutral. iac quadlets set the auth.network
      # container names; lab uses the compose service name.
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
    volumes:
      - ./glauth.cfg:/etc/glauth/glauth.cfg:ro
    # Bridge has a /healthz on its admin port (:6478 default per
    # main.go adminListenEnv). UBI 9 minimal runtime ships curl
    # (Containerfile base swap from micro → minimal for this reason),
    # so the healthcheck self-validates without a sidecar.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6478/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Client registration — the converged successor to the deleted util/
  # apply-clients.sh. util's role folded INTO the othala app as the
  # in-process registrar (portal/src/lib/register-clients.ts ->
  # registerAllClients), bundled into the image at
  # dist/server/register-clients.mjs (npm run build:register-clients,
  # same esbuild pattern as admin-runtime). The registrar is DORMANT in
  # the deployed app (iac's dag-apply-clients.sh drives registration at
  # deploy time); the e2e activates it as a `compose run --rm` one-shot
  # on the SAME othala image to prove the in-app registrar registers
  # every hydra/clients/*.yaml against Hydra admin. See smoke.sh
  # section B. `profiles: [oneshot]` keeps it out of the up/healthcheck
  # loop — smoke runs it explicitly via `compose run`.
  register-clients:
    image: ${AUTH_REGISTRY}:${AUTH_VERSION}
    container_name: lab-register-clients
    profiles: ["oneshot"]
    depends_on:
      hydra:
        condition: service_healthy
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      MANIFEST_DIR: /etc/portal/manifests
      KEEP_CLIENT_SECRET: ${KEEP_CLIENT_SECRET}
      OBSERVE_CLIENT_SECRET: ${OBSERVE_CLIENT_SECRET}
      LARDER_CLIENT_SECRET: ${LARDER_CLIENT_SECRET}
      LISTEN_CLIENT_SECRET: ${LISTEN_CLIENT_SECRET}
      CINEMA_CLIENT_SECRET: ${CINEMA_CLIENT_SECRET}
      MEMORY_CLIENT_SECRET: ${MEMORY_CLIENT_SECRET}
      VAULT_CLIENT_SECRET: ${VAULT_CLIENT_SECRET}
      LIBRARY_CLIENT_SECRET: ${LIBRARY_CLIENT_SECRET}
      FORGE_CLIENT_SECRET: ${FORGE_CLIENT_SECRET}
      TAILSCALE_CLIENT_SECRET: ${TAILSCALE_CLIENT_SECRET}
      LLM_CLIENT_SECRET: ${LLM_CLIENT_SECRET}
    volumes:
      - ../hydra/clients:/etc/portal/manifests:ro
    command: ["node", "./dist/server/register-clients.mjs"]
