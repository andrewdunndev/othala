# Kratos configuration — Phase 1 lab spike (auth-lab.${DOMAIN})
#
# Lab-only overrides on top of the production-shape config:
#   - rp.id = ${DOMAIN} (passkeys enrolled in lab are throwaway)
#   - All URLs point at auth-lab.${DOMAIN} (single-host lab)
#   - registration ENABLED (so we can self-create a test identity)
#   - SMTP courier disabled (no recovery email path tested in spike)

dsn: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable

serve:
  public:
    base_url: https://auth-lab.${DOMAIN}/
    port: 4433
    cors:
      enabled: true
      allowed_origins:
        - https://auth-lab.${DOMAIN}
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers:
        - Authorization
        - Content-Type
        - X-Session-Token
        - Cookie
        - X-CSRF-Token
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true

  admin:
    base_url: http://kratos:4434/
    port: 4434

selfservice:
  # LOW-3: trailing slash is load-bearing. Kratos allowed_return_urls
  # is a prefix match; an entry without the slash matches the evil
  # cousin host (e.g. https://auth-lab.<sslip>.evil.example). Keep
  # every entry trailing-slash-terminated.
  default_browser_return_url: https://auth-lab.${DOMAIN}/
  allowed_return_urls:
    - https://auth-lab.${DOMAIN}/
    - https://keep-lab.${DOMAIN}/

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: false
        min_password_length: 6

    webauthn:
      enabled: true
      config:
        passwordless: true
        rp:
          id: ${DOMAIN}
          display_name: Dunn Family Lab
          origins:
            - https://auth-lab.${DOMAIN}

    totp:
      enabled: true
      config:
        issuer: Dunn Family Lab

    code:
      enabled: true
      passwordless_enabled: false

    profile:
      enabled: true

    link:
      enabled: false

    lookup_secret:
      enabled: true

  flows:
    error:
      ui_url: https://auth-lab.${DOMAIN}/error

    settings:
      ui_url: https://auth-lab.${DOMAIN}/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: false

    verification:
      enabled: false

    logout:
      after:
        default_browser_return_url: https://auth-lab.${DOMAIN}/

    login:
      ui_url: https://auth-lab.${DOMAIN}/login
      lifespan: 10m

    registration:
      enabled: true
      ui_url: https://auth-lab.${DOMAIN}/registration
      lifespan: 1h
      after:
        password:
          hooks:
            - hook: session

session:
  lifespan: 24h
  cookie:
    domain: auth-lab.${DOMAIN}
    name: ory_kratos_session
    persistent: true
    same_site: Lax
  whoami:
    required_aal: aal1

cookies:
  domain: auth-lab.${DOMAIN}
  same_site: Lax

identity:
  default_schema_id: family
  schemas:
    - id: family
      url: file:///etc/config/kratos/identity.schema.json

secrets:
  # H3: rotation slots. Both _CURRENT and _PREVIOUS are populated with
  # distinct secrets on first provision (gen-secrets.sh seeds both)
  # because Kratos rejects empty list entries.
  cookie:
    - ${KRATOS_COOKIE_SECRET_CURRENT}
    - ${KRATOS_COOKIE_SECRET_PREVIOUS}
  cipher:
    - ${KRATOS_CIPHER_SECRET_CURRENT}
    - ${KRATOS_CIPHER_SECRET_PREVIOUS}

log:
  level: info
  format: json
  leak_sensitive_values: false

hashers:
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 3
    salt_length: 16
    key_length: 32

ciphers:
  algorithm: xchacha20-poly1305

feature_flags:
  cacheable_sessions: false
