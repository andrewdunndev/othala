# Phase 3 lab compose: validates Kratos + Hydra + dunn.dev/consent +
# Vaultwarden + Astro portal end-to-end. Replaces the reference
# oryd/hydra-login-consent-node with our own consent service (the one
# carmine will run in production), so the lab exercises the same code
# path that ships.
#
# Production carmine deploys equivalent components via pyinfra-managed
# rootless podman quadlets.
#
# Out of scope for this spike (deferred to later phases):
#   - glauth-kratos LDAP bridge (Phase 2; covered by compose-ldap.yml)
#   - all 11 production OIDC clients + LDAP + forward-auth (Phase 4)

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_MULTIPLE_DATABASES: kratos,hydra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  hydra-migrate:
    image: docker.io/oryd/hydra:v2.2.0
    container_name: auth-hydra-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]

  kratos-migrate:
    image: docker.io/oryd/kratos:v1.3.0
    container_name: auth-kratos-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./kratos.rendered.yml:/etc/config/kratos/kratos.yml:ro
      - ./identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos/kratos.yml"]

  kratos:
    image: docker.io/oryd/kratos:v1.3.0
    container_name: auth-kratos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      # H3: cookie/cipher rotation slots; see docs/runbooks/cookie-rotation.md
      KRATOS_COOKIE_SECRET_CURRENT: ${KRATOS_COOKIE_SECRET_CURRENT}
      KRATOS_COOKIE_SECRET_PREVIOUS: ${KRATOS_COOKIE_SECRET_PREVIOUS:-}
      KRATOS_CIPHER_SECRET_CURRENT: ${KRATOS_CIPHER_SECRET_CURRENT}
      KRATOS_CIPHER_SECRET_PREVIOUS: ${KRATOS_CIPHER_SECRET_PREVIOUS:-}
    volumes:
      - ./kratos.rendered.yml:/etc/config/kratos/kratos.yml:ro
      - ./identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["serve", "all", "--config", "/etc/config/kratos/kratos.yml", "--dev"]
    expose:
      - "4433"
      - "4434"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4434/admin/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  hydra:
    image: docker.io/oryd/hydra:v2.2.0
    container_name: auth-hydra
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
      HYDRA_SYSTEM_SECRET: ${HYDRA_SYSTEM_SECRET}
      # H3: cookie rotation slots; see docs/runbooks/cookie-rotation.md
      HYDRA_COOKIE_SECRET_CURRENT: ${HYDRA_COOKIE_SECRET_CURRENT}
      HYDRA_COOKIE_SECRET_PREVIOUS: ${HYDRA_COOKIE_SECRET_PREVIOUS:-}
      HYDRA_PAIRWISE_SALT: ${HYDRA_PAIRWISE_SALT}
    volumes:
      - ./hydra.rendered.yml:/etc/config/hydra/hydra.yml:ro
    command: ["serve", "all", "--config", "/etc/config/hydra/hydra.yml", "--dev"]
    expose:
      - "4444"
      - "4445"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4445/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Reference Kratos self-service UI (login, registration, settings,
  # recovery, verification, error). Mounted under /auth/ via BASE_URL.
  # Production swap: replaced by our Astro UI at portal/ in Phase 3.
  kratos-ui:
    image: docker.io/oryd/kratos-selfservice-ui-node:v1.3.0
    container_name: auth-kratos-ui
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_BROWSER_URL: https://auth-lab.${DOMAIN}
      SECURITY_MODE: standalone
      PORT: "3000"
      COOKIE_SECRET: ${KRATOS_UI_COOKIE_SECRET}
      CSRF_COOKIE_NAME: __HOST-auth-lab-csrf
      CSRF_COOKIE_SECRET: ${KRATOS_UI_CSRF_SECRET}
    expose:
      - "3000"

  # dunn.dev/consent — our login/consent/logout service. Built locally
  # on the VM via:
  #   cd /opt/auth-lab/consent && podman build -t dunn.dev/consent:lab .
  # Mounts hydra/clients read-only so the manifest-aware claim emission
  # works against the same yamls that ship to production.
  consent:
    image: dunn.dev/consent:lab
    container_name: auth-consent
    restart: unless-stopped
    depends_on:
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      # HYDRA_ISSUER must byte-match Hydra urls.self.issuer; back-channel
      # logout tokens are minted with this iss claim.
      HYDRA_ISSUER: https://auth-lab.${DOMAIN}/
      LOGIN_URL: https://auth-lab.${DOMAIN}/auth/login
      HYDRA_CLIENT_DIR: /etc/consent/manifests
      CONSENT_ADMIN_BEARER: ${CONSENT_ADMIN_BEARER}
      # MEDIUM-1: listener split. Public mux on :4477 (Caddy proxies
      # /login, /consent, /logout, /healthz). Admin mux on :4478
      # (/admin/*, /webhooks/*) — pod-internal only, never proxied
      # publicly. CONSENT_PUBLIC_URL fixes the buildReturnTo scheme
      # without trusting X-Forwarded-* (HIGH-2).
      PUBLIC_LISTEN: ":4477"
      ADMIN_LISTEN: ":4478"
      CONSENT_PUBLIC_URL: https://auth-lab.${DOMAIN}
      # MEDIUM-2: shared secret Kratos sends as X-Webhook-Auth on the
      # recovery-gate POST. Constant-time-compared inside the handler.
      RECOVERY_GATE_SECRET: ${RECOVERY_GATE_SECRET}
    volumes:
      - ../../hydra/clients:/etc/consent/manifests:ro
    expose:
      - "4477"
      - "4478"

  vaultwarden:
    image: docker.io/vaultwarden/server:1.30.5
    container_name: auth-vaultwarden
    restart: unless-stopped
    depends_on:
      hydra:
        condition: service_healthy
    environment:
      DOMAIN: https://keep-lab.${DOMAIN}
      SIGNUPS_ALLOWED: "false"
      SSO_ENABLED: "true"
      SSO_AUTHORITY: https://auth-lab.${DOMAIN}/
      SSO_CLIENT_ID: keep-lab
      SSO_CLIENT_SECRET: ${KEEP_CLIENT_SECRET}
      ROCKET_PORT: "80"
      I_REALLY_WANT_VOLATILE_STORAGE: "true"
    expose:
      - "80"

  # Astro Node SSR portal. Same image carmine runs in production. Build
  # locally with `cd portal && podman build -t dunn.dev/auth-portal:lab .`
  portal:
    image: dunn.dev/auth-portal:lab
    container_name: auth-portal
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      consent:
        condition: service_started
    environment:
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      # F5: webfinger reads HYDRA_ISSUER_URL at request time so the
      # WebFinger href byte-matches whichever issuer this instance is
      # serving. Lab issuer differs from production.
      HYDRA_ISSUER_URL: https://auth-lab.${DOMAIN}/
      CONSENT_ADMIN_URL: http://consent:4477
      CONSENT_ADMIN_BEARER: ${CONSENT_ADMIN_BEARER}
      HOST: 0.0.0.0
      PORT: "8080"
    expose:
      - "8080"

  caddy:
    image: docker.io/library/caddy:2.8-alpine
    container_name: auth-caddy
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      consent:
        condition: service_started
      portal:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  caddy_data:
  caddy_config:
