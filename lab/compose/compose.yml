# Lab compose stack for Ory Kratos + Hydra + glauth-kratos bridge +
# consent service + custom Caddy + app stubs.
#
# Validates the production architecture against real apps in a GCP VM.
# Production carmine deploys the same components via pyinfra-managed
# rootless podman quadlets.

services:
  # --- Postgres (single instance, separate kratos and hydra databases) ---
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_MULTIPLE_DATABASES: kratos,hydra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Hydra schema migration (must run before hydra serve) ---
  hydra-migrate:
    image: oryd/hydra:v2.x
    container_name: auth-hydra-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]

  # --- Kratos ---
  kratos:
    image: oryd/kratos:v1.x
    container_name: auth-kratos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      KRATOS_COOKIE_SECRET: ${KRATOS_COOKIE_SECRET}
      KRATOS_CIPHER_SECRET: ${KRATOS_CIPHER_SECRET}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      - ../../kratos/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ../../kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["serve", "all", "--config", "/etc/config/kratos/kratos.yml"]
    ports:
      - "4433:4433"   # public
      - "4434:4434"   # admin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4434/admin/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Kratos courier (singleton; sends recovery/verification emails) ---
  kratos-courier:
    image: oryd/kratos:v1.x
    container_name: auth-kratos-courier
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      KRATOS_COOKIE_SECRET: ${KRATOS_COOKIE_SECRET}
      KRATOS_CIPHER_SECRET: ${KRATOS_CIPHER_SECRET}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      - ../../kratos/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ../../kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["courier", "watch", "--config", "/etc/config/kratos/kratos.yml"]
    # Singleton: do not scale this service. Multiple couriers can
    # double-send or skip-send messages.

  # --- Hydra (depends on schema migration completing) ---
  hydra:
    image: oryd/hydra:v2.x
    container_name: auth-hydra
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://hydra:${HYDRA_PG_PASS}@postgres:5432/hydra?sslmode=disable
      HYDRA_PG_PASS: ${HYDRA_PG_PASS}
      HYDRA_SYSTEM_SECRET: ${HYDRA_SYSTEM_SECRET}
      HYDRA_COOKIE_SECRET: ${HYDRA_COOKIE_SECRET}
      HYDRA_PAIRWISE_SALT: ${HYDRA_PAIRWISE_SALT}
    volumes:
      - ../../hydra/hydra.yml:/etc/config/hydra/hydra.yml:ro
    command: ["serve", "all", "--config", "/etc/config/hydra/hydra.yml", "--dev"]
    ports:
      - "4444:4444"   # public
      - "4445:4445"   # admin (internal pod network only in production)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4445/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Consent service (carmine-resident; here for lab integration) ---
  consent:
    image: dunn.dev/consent:lab
    container_name: auth-consent
    restart: unless-stopped
    depends_on:
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      KRATOS_PUBLIC_URL: http://kratos:4433
    ports:
      - "4477:4477"

  # --- LDAP bridge (custom glauth binary with Kratos backend) ---
  ldap-bridge:
    image: dunn.dev/glauth-kratos:lab
    container_name: auth-ldap-bridge
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      KRATOS_BRIDGE_ADMIN_TOKEN: ${KRATOS_BRIDGE_ADMIN_TOKEN}
    volumes:
      - ../../ldap-bridge/glauth.cfg:/etc/glauth/glauth.cfg:ro
      - ./tls:/etc/glauth/tls:ro
    ports:
      - "636:636"
      - "389:389"

  # --- Reverse proxy: custom Caddy with cloudflare DNS-01 plugin ---
  caddy:
    image: dunn.dev/caddy-estate:lab
    container_name: auth-caddy
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      consent:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../caddy/snippets:/etc/caddy/snippets:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- App stubs ---
  vaultwarden:
    image: docker.io/vaultwarden/server:latest
    container_name: auth-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://keep.${DOMAIN}
      SIGNUPS_ALLOWED: "false"
      SSO_ENABLED: "true"
      SSO_AUTHORITY: https://auth.${DOMAIN}/
      SSO_CLIENT_ID: keep
      SSO_CLIENT_SECRET: ${KEEP_CLIENT_SECRET}

  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: auth-mealie
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: "false"
      BASE_URL: https://larder.${DOMAIN}
      OIDC_AUTH_ENABLED: "true"
      OIDC_CONFIGURATION_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
      OIDC_CLIENT_ID: larder
      OIDC_CLIENT_SECRET: ${LARDER_CLIENT_SECRET}
      OIDC_AUTO_REDIRECT: "true"
      OIDC_PROVIDER_NAME: Dunn Family
      OIDC_ADMIN_GROUP: admin
      OIDC_USER_GROUP: family

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: auth-audiobookshelf
    restart: unless-stopped

  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: auth-jellyfin
    restart: unless-stopped
    depends_on:
      ldap-bridge:
        condition: service_started
    volumes:
      - ./jellyfin-ldap.xml:/config/plugins/configurations/LDAP-Auth.xml:ro,z

  navidrome:
    image: docker.io/deluan/navidrome:latest
    container_name: auth-navidrome
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: auth-immich
    restart: unless-stopped
    depends_on:
      immich-postgres:
        condition: service_healthy
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_PG_PASS:-bench-immich-pg}
      DB_DATABASE_NAME: immich
      IMMICH_MACHINE_LEARNING_URL: ""

  immich-postgres:
    image: docker.io/tensorchord/pgvecto-rs:pg16-v0.2.0
    container_name: auth-immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_PG_PASS:-bench-immich-pg}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d immich -U immich"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  immich_pg_data:
