# glauth-kratos lab config (Phase 2).
#
# Mounted into the bridge container at /etc/glauth/glauth.cfg. The admin
# token comes from the KRATOS_BRIDGE_ADMIN_TOKEN env var (set by deploy
# script). OSS Kratos's admin port is internal-only and does not enforce
# auth on the bearer token, so the value here is dummy material; it
# exists only so the bridge config validator passes.

debug = true

[ldap]
  enabled = false
  listen = "127.0.0.1:389"

[ldaps]
  enabled = true
  listen = "0.0.0.0:636"
  cert = "/etc/glauth/tls/cert.pem"
  key  = "/etc/glauth/tls/key.pem"

[backend]
  baseDN = "dc=dunn,dc=dev"

[backend.kratos]
  public_url         = "http://kratos:4433"
  admin_url          = "http://kratos:4434"
  admin_token_env    = "KRATOS_BRIDGE_ADMIN_TOKEN"
  base_dn            = "dc=dunn,dc=dev"
  identity_cache_ttl = "30s"
  bind_cache_ttl     = "30s"
