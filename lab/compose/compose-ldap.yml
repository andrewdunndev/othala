# Phase 2 lab spike: validates glauth-kratos LDAP bridge against a live
# Kratos. Pared-down stack: postgres + kratos + caddy + kratos-ui, plus
# the bridge built from /opt/auth-lab/ldap-bridge.
#
# Hydra and Vaultwarden are intentionally absent: Phase 2 is about the
# LDAP path only. Jellyfin integration is deferred (the user accepted
# manual Jellyfin login management).

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kratos
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: ${KRATOS_PG_PASS}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos -d kratos"]
      interval: 10s
      timeout: 5s
      retries: 5

  kratos-migrate:
    image: docker.io/oryd/kratos:v26.2.0
    container_name: auth-kratos-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
    volumes:
      - ./kratos.rendered.yml:/etc/config/kratos/kratos.yml:ro
      - ./identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos/kratos.yml"]

  kratos:
    image: docker.io/oryd/kratos:v26.2.0
    container_name: auth-kratos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASS}@postgres:5432/kratos?sslmode=disable
      KRATOS_PG_PASS: ${KRATOS_PG_PASS}
      # H3: cookie/cipher rotation slots; see docs/runbooks/cookie-rotation.md
      KRATOS_COOKIE_SECRET_CURRENT: ${KRATOS_COOKIE_SECRET_CURRENT}
      KRATOS_COOKIE_SECRET_PREVIOUS: ${KRATOS_COOKIE_SECRET_PREVIOUS:-}
      KRATOS_CIPHER_SECRET_CURRENT: ${KRATOS_CIPHER_SECRET_CURRENT}
      KRATOS_CIPHER_SECRET_PREVIOUS: ${KRATOS_CIPHER_SECRET_PREVIOUS:-}
    volumes:
      - ./kratos.rendered.yml:/etc/config/kratos/kratos.yml:ro
      - ./identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["serve", "all", "--config", "/etc/config/kratos/kratos.yml", "--dev"]
    expose:
      - "4433"
      - "4434"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4434/admin/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kratos-ui:
    image: docker.io/oryd/kratos-selfservice-ui-node:v26.2.0
    container_name: auth-kratos-ui
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_BROWSER_URL: https://auth-lab.${DOMAIN}
      SECURITY_MODE: standalone
      PORT: "3000"
      COOKIE_SECRET: ${KRATOS_UI_COOKIE_SECRET}
      CSRF_COOKIE_NAME: __HOST-auth-lab-csrf
      CSRF_COOKIE_SECRET: ${KRATOS_UI_CSRF_SECRET}
    expose:
      - "3000"

  glauth-kratos:
    image: localhost/dunn.dev/glauth-kratos:lab
    container_name: auth-glauth-kratos
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      KRATOS_BRIDGE_ADMIN_TOKEN: ${KRATOS_BRIDGE_ADMIN_TOKEN}
    volumes:
      - ./glauth.cfg:/etc/glauth/glauth.cfg:ro
      - ./tls/glauth-cert.pem:/etc/glauth/tls/cert.pem:ro
      - ./tls/glauth-key.pem:/etc/glauth/tls/key.pem:ro
    ports:
      - "636:636"

  caddy:
    image: docker.io/library/caddy:2.11-alpine
    container_name: auth-caddy
    restart: unless-stopped
    depends_on:
      kratos:
        condition: service_healthy
      kratos-ui:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile.ldap:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  caddy_data:
  caddy_config:
