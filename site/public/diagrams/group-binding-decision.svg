<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" role="img" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title>Group, binding, decision: what a group actually does in Othala</title>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<defs>
<marker id="gbd-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#707070"/>
</marker>
</defs>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="436" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="396" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<!-- header: house mark + eyebrow -->
<g class="as" stroke="#4a6741" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(37 29) scale(0.3)">
<line x1="32" y1="8" x2="48" y2="24"/>
<line x1="48" y1="24" x2="32" y2="40"/>
<line x1="32" y1="40" x2="16" y2="24"/>
<line x1="16" y1="24" x2="32" y2="8"/>
<line x1="32" y1="40" x2="18" y2="56"/>
<line x1="32" y1="40" x2="46" y2="56"/>
</g>
<text class="m" x="60" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">ACCESS MODEL · WHAT A GROUP ACTUALLY DOES</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<!-- column headers -->
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">1 · THE IDENTITY HOLDS</text>
<text class="m" x="250" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">2 · THE MANIFEST BINDS</text>
<text class="m" x="520" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">3 · THE CODE DECIDES</text>
<!-- column 1: the identity -->
<rect class="s e" x="40" y="88" width="160" height="132" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.6" fill="#707070">metadata_admin.groups</text>
<rect class="p e" x="52" y="114" width="136" height="20" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="60" y="128" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#404040">everyone</text>
<rect class="p e" x="52" y="140" width="136" height="20" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="60" y="154" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#0a0a0a">audiobookshelf-access</text>
<rect class="p e" x="52" y="166" width="136" height="20" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="60" y="180" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#0a0a0a">audiobookshelf-admin</text>
<text class="m" x="52" y="200" font-size="8" fill="#707070">Admin-API only. Not in the</text>
<text class="m" x="52" y="211" font-size="8" fill="#707070">public whoami response.</text>
<!-- arrows: identity → bindings -->
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M204,150 H216 Q222,150 222,144 V132 Q222,126 228,126 H240" marker-end="url(#gbd-arrow)"/>
<path d="M204,176 H216 Q222,176 222,182 V208 Q222,214 228,214 H240" marker-end="url(#gbd-arrow)"/>
</g>
<!-- column 2: the bindings -->
<rect class="p as" x="250" y="88" width="230" height="76" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="262" y="105" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#4a6741">ENTRY BINDING</text>
<text class="i" x="262" y="123" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#0a0a0a">presentation.access:</text>
<text class="i" x="274" y="138" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#0a0a0a">- audiobookshelf-access</text>
<text class="m" x="262" y="155" font-size="8" fill="#707070">Only the access group. Read by parseAccessGroups.</text>
<rect class="p e2" x="250" y="178" width="230" height="92" rx="3" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
<text class="m" x="262" y="195" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">ROLE BINDING</text>
<text class="i" x="262" y="213" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#0a0a0a">consent.group_role_map:</text>
<text class="i" x="274" y="228" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#0a0a0a">audiobookshelf-admin: admin</text>
<text class="i" x="274" y="243" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9.5" fill="#0a0a0a">audiobookshelf-access: user</text>
<text class="m" x="262" y="261" font-size="8" fill="#707070">Rank is the declaration order of consent.roles.</text>
<!-- arrows: bindings → decisions -->
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="484" y1="126" x2="510" y2="126" marker-end="url(#gbd-arrow)"/>
<line x1="484" y1="214" x2="510" y2="214" marker-end="url(#gbd-arrow)"/>
</g>
<!-- column 3: the decisions -->
<rect class="s as" x="520" y="88" width="160" height="76" rx="3" fill="#f4f4f4" stroke="#4a6741" stroke-width="1.4"/>
<text class="m" x="532" y="105" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">ENTRY</text>
<text class="a" x="532" y="128" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#4a6741">admitted</text>
<text class="m" x="532" y="143" font-size="8" fill="#707070">gate.ts enforceAccessGate —</text>
<text class="m" x="532" y="154" font-size="8" fill="#707070">OR over the bound list.</text>
<rect class="s e2" x="520" y="178" width="160" height="92" rx="3" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1"/>
<text class="m" x="532" y="195" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">ROLE</text>
<text class="i" x="532" y="219" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#0a0a0a">admin</text>
<text class="m" x="532" y="235" font-size="8" fill="#707070">claims.ts lookupRole — the</text>
<text class="m" x="532" y="246" font-size="8" fill="#707070">highest-ranked match wins,</text>
<text class="m" x="532" y="257" font-size="8" fill="#707070">in any stored order.</text>
<!-- bottom band: the three consequences -->
<line class="e" x1="40" y1="288" x2="680" y2="288" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="308" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">THE NAME IS CONVENTION · THE BINDING IS THE MECHANISM</text>
<rect class="s e" x="40" y="318" width="200" height="82" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="52" y="337" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" fill="#0a0a0a">audiobookshelf-admin, held alone</text>
<text class="i2" x="52" y="354" font-size="8.5" fill="#404040">presentation.access does not list</text>
<text class="i2" x="52" y="365" font-size="8.5" fill="#404040">it, so it admits nobody. Admin</text>
<text class="i2" x="52" y="376" font-size="8.5" fill="#404040">never implies access.</text>
<text class="n" x="52" y="392" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.1" fill="#a8443a">NO ENTRY</text>
<rect class="s e" x="260" y="318" width="200" height="82" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="272" y="337" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" fill="#0a0a0a">a group nothing binds</text>
<text class="i2" x="272" y="354" font-size="8.5" fill="#404040">group-registry.ts types a group</text>
<text class="i2" x="272" y="365" font-size="8.5" fill="#404040">from its bindings. With none, it</text>
<text class="i2" x="272" y="376" font-size="8.5" fill="#404040">is inert however it is spelled.</text>
<text class="m" x="272" y="392" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.1" fill="#707070">GRANTS NOTHING</text>
<rect class="s e" x="480" y="318" width="200" height="82" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="492" y="337" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" fill="#0a0a0a">bananas, if a manifest binds it</text>
<text class="i2" x="492" y="354" font-size="8.5" fill="#404040">the only rule on a group name is</text>
<text class="i2" x="492" y="365" font-size="8.5" fill="#404040">a safe charset. No code anywhere</text>
<text class="i2" x="492" y="376" font-size="8.5" fill="#404040">requires the access- prefix.</text>
<text class="y" x="492" y="392" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.1" fill="#4a7a4a">GRANTS ENTRY</text>
</g>
</svg>
