<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" width="720" height="510" role="img" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title>Group, binding, decision: what a group actually does in Othala</title>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<defs>
<marker id="gbd-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#707070"/>
</marker>
</defs>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="510" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="470" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">ACCESS MODEL · WHAT A GROUP ACTUALLY DOES</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">1 · THE IDENTITY HOLDS</text>
<text class="m" x="244" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">2 · THE MANIFEST BINDS</text>
<text class="m" x="508" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">3 · THE CODE DECIDES</text>
<rect class="s e" x="40" y="88" width="176" height="146" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#707070">metadata_admin.groups</text>
<rect class="p e" x="52" y="116" width="152" height="22" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="60" y="131" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#404040">everyone</text>
<rect class="p e" x="52" y="144" width="152" height="22" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="60" y="159" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">audiobookshelf-access</text>
<rect class="p e" x="52" y="172" width="152" height="22" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="60" y="187" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">audiobookshelf-admin</text>
<text class="m" x="52" y="211" font-size="10.5" fill="#707070">Admin-API only. Not in the</text>
<text class="m" x="52" y="225" font-size="10.5" fill="#707070">public whoami response.</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M206,155 H222 Q228,155 228,149 V138 Q228,132 234,132 H236" marker-end="url(#gbd-arrow)"/>
<path d="M206,183 H222 Q228,183 228,189 V239 Q228,245 234,245 H236" marker-end="url(#gbd-arrow)"/>
</g>
<rect class="p as" x="244" y="88" width="236" height="88" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="256" y="105" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#4a6741">ENTRY BINDING</text>
<text class="i" x="256" y="124" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">presentation.access:</text>
<text class="i" x="268" y="139" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">- audiobookshelf-access</text>
<text class="m" x="256" y="156" font-size="10.5" fill="#707070">Only the access group.</text>
<text class="m" x="256" y="169" font-size="10.5" fill="#707070">Read by parseAccessGroups.</text>
<rect class="p e2" x="244" y="190" width="236" height="110" rx="3" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
<text class="m" x="256" y="207" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">ROLE BINDING</text>
<text class="i" x="256" y="226" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">consent.group_role_map:</text>
<text class="i" x="268" y="241" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">audiobookshelf-admin: admin</text>
<text class="i" x="268" y="256" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">audiobookshelf-access: user</text>
<text class="m" x="256" y="276" font-size="10.5" fill="#707070">Rank is the declaration order</text>
<text class="m" x="256" y="289" font-size="10.5" fill="#707070">of consent.roles.</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="484" y1="132" x2="500" y2="132" marker-end="url(#gbd-arrow)"/>
<line x1="484" y1="245" x2="500" y2="245" marker-end="url(#gbd-arrow)"/>
</g>
<rect class="s as" x="508" y="88" width="172" height="88" rx="3" fill="#f4f4f4" stroke="#4a6741" stroke-width="1.4"/>
<text class="m" x="520" y="105" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">ENTRY</text>
<text class="a" x="520" y="131" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#4a6741">admitted</text>
<text class="m" x="520" y="152" font-size="10.5" fill="#707070">gate.ts enforceAccessGate —</text>
<text class="m" x="520" y="166" font-size="10.5" fill="#707070">OR over the bound list.</text>
<rect class="s e2" x="508" y="190" width="172" height="110" rx="3" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1"/>
<text class="m" x="520" y="207" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">ROLE</text>
<text class="i" x="520" y="233" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#0a0a0a">admin</text>
<text class="m" x="520" y="254" font-size="10.5" fill="#707070">claims.ts lookupRole — the</text>
<text class="m" x="520" y="268" font-size="10.5" fill="#707070">highest-ranked match wins,</text>
<text class="m" x="520" y="282" font-size="10.5" fill="#707070">in any stored order.</text>
<line class="e" x1="40" y1="318" x2="680" y2="318" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="338" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">THE NAME IS CONVENTION · THE BINDING IS THE MECHANISM</text>
<rect class="s e" x="40" y="350" width="200" height="122" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="52" y="369" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">audiobookshelf-admin,</text>
<text class="i" x="52" y="384" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">held alone</text>
<text class="i2" x="52" y="404" font-size="11" fill="#404040">presentation.access does not list</text>
<text class="i2" x="52" y="418" font-size="11" fill="#404040">it, so it admits nobody. Admin</text>
<text class="i2" x="52" y="432" font-size="11" fill="#404040">never implies access.</text>
<text class="n" x="52" y="459" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#a8443a">NO ENTRY</text>
<rect class="s e" x="260" y="350" width="200" height="122" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="272" y="369" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">a group nothing binds</text>
<text class="i2" x="272" y="404" font-size="11" fill="#404040">group-registry.ts types a group</text>
<text class="i2" x="272" y="418" font-size="11" fill="#404040">from its bindings. With none, it</text>
<text class="i2" x="272" y="432" font-size="11" fill="#404040">is inert however it is spelled.</text>
<text class="m" x="272" y="459" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#707070">GRANTS NOTHING</text>
<rect class="s e" x="480" y="350" width="200" height="122" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="492" y="369" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">bananas, if a manifest</text>
<text class="i" x="492" y="384" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">binds it</text>
<text class="i2" x="492" y="404" font-size="11" fill="#404040">the only rule on a group name is</text>
<text class="i2" x="492" y="418" font-size="11" fill="#404040">a safe charset. No code anywhere</text>
<text class="i2" x="492" y="432" font-size="11" fill="#404040">requires the access- prefix.</text>
<text class="y" x="492" y="459" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#4a7a4a">GRANTS ENTRY</text>
</g>
</svg>
