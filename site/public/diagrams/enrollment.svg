<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 438" width="720" height="438" role="img" aria-labelledby="en-t en-d" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title id="en-t">Enrollment: from an admin-created identity to a member's own password and passkey</title>
<desc id="en-d">Four steps. One: the admin creates the identity at /admin/users/new with traits and metadata_admin.groups set to the default group, and no credentials block at all, so the identity exists but cannot log in. Two: the same request mints a one-time recovery link and code with a 24-hour expiry; both halves are required, because the link lands on a form with an empty code field. Three: the portal composes the link, code and expiry as one block server-side and the admin pastes it into an existing chat — nothing is emailed. Four: the member opens the link, enters the code, receives a privileged settings session and sets up both a password and a passkey in their own browser. The invariant is that no password ever transits a channel: the only secret in motion is the single-use link and code. Three consequences follow — dropping the code silently dead-ends the invitation, admin identities are refused this path and go to break-glass instead, and a newly enrolled member sees no app tiles until an access group is granted separately.</desc>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="438" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="398" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<!-- header -->
<g class="as" stroke="#4a6741" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(37 29) scale(0.3)">
<line x1="32" y1="8" x2="48" y2="24"/>
<line x1="48" y1="24" x2="32" y2="40"/>
<line x1="32" y1="40" x2="16" y2="24"/>
<line x1="16" y1="24" x2="32" y2="8"/>
<line x1="32" y1="40" x2="18" y2="56"/>
<line x1="32" y1="40" x2="46" y2="56"/>
</g>
<text class="m" x="60" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">ENROLLMENT · THERE IS NO SELF-SERVICE REGISTRATION</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">ONE ADMIN ACTION, ONE PASTEABLE MESSAGE, ONE PERSON SETTING THEIR OWN CREDENTIALS</text>
<!-- step 1 -->
<rect class="s e" x="40" y="88" width="148" height="104" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">1 · CREATE</text>
<text class="i" x="52" y="122" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">/admin/users/new</text>
<text class="i2" x="52" y="137" font-size="8.5" fill="#404040">createIdentity: traits and</text>
<text class="i2" x="52" y="148" font-size="8.5" fill="#404040">metadata_admin.groups</text>
<text class="i2" x="52" y="159" font-size="8.5" fill="#404040">= the default group.</text>
<text class="a" x="52" y="175" font-size="8.5" font-weight="600" fill="#4a6741">No credentials block —</text>
<text class="a" x="52" y="186" font-size="8.5" font-weight="600" fill="#4a6741">it cannot yet log in.</text>
<!-- step 2 -->
<rect class="s e" x="204" y="88" width="148" height="104" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="216" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">2 · MINT</text>
<text class="i" x="216" y="122" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">getRecoveryLink(id, 24h)</text>
<text class="i2" x="216" y="137" font-size="8.5" fill="#404040">→ recovery_link</text>
<text class="i2" x="216" y="148" font-size="8.5" fill="#404040">→ recovery_code</text>
<text class="i2" x="216" y="159" font-size="8.5" fill="#404040">→ expires_at</text>
<text class="a" x="216" y="175" font-size="8.5" font-weight="600" fill="#4a6741">Both halves, or the</text>
<text class="a" x="216" y="186" font-size="8.5" font-weight="600" fill="#4a6741">invitation dead-ends.</text>
<!-- step 3 -->
<rect class="p as" x="368" y="88" width="148" height="104" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<g class="as" stroke="#4a6741" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(486.4 113.1) scale(0.35)">
<line x1="16" y1="14.5" x2="16" y2="49.5"/>
<line x1="48" y1="14.5" x2="48" y2="49.5"/>
<line x1="17.9" y1="13.9" x2="30.1" y2="30.1"/>
<line x1="33.9" y1="33.9" x2="46.1" y2="50.1"/>
<line x1="17.9" y1="50.1" x2="30.1" y2="33.9"/>
<line x1="33.9" y1="30.1" x2="46.1" y2="13.9"/>
</g>
<text class="a" x="380" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#4a6741">3 · HAND OVER</text>
<text class="i2" x="380" y="122" font-size="8.5" fill="#404040">The portal composes link,</text>
<text class="i2" x="380" y="133" font-size="8.5" fill="#404040">code and expiry as one</text>
<text class="i2" x="380" y="144" font-size="8.5" fill="#404040">block, server-side, so the</text>
<text class="i2" x="380" y="155" font-size="8.5" fill="#404040">two cannot be sent apart.</text>
<text class="a" x="380" y="175" font-size="8.5" font-weight="600" fill="#4a6741">Sent in a chat that</text>
<text class="a" x="380" y="186" font-size="8.5" font-weight="600" fill="#4a6741">already exists. No mail.</text>
<!-- step 4 -->
<rect class="s e" x="532" y="88" width="148" height="104" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="544" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">4 · THEY SET UP</text>
<text class="i2" x="544" y="122" font-size="8.5" fill="#404040">Open the link, enter the</text>
<text class="i2" x="544" y="133" font-size="8.5" fill="#404040">code. Kratos issues a</text>
<text class="i2" x="544" y="144" font-size="8.5" fill="#404040">privileged settings session.</text>
<text class="a" x="544" y="164" font-size="8.5" font-weight="600" fill="#4a6741">Password AND passkey,</text>
<text class="a" x="544" y="175" font-size="8.5" font-weight="600" fill="#4a6741">both chosen by them, in</text>
<text class="a" x="544" y="186" font-size="8.5" font-weight="600" fill="#4a6741">their own browser.</text>
<!-- step arrows -->
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="190" y1="140" x2="200" y2="140"/>
<polyline points="196,136 200,140 196,144"/>
<line x1="354" y1="140" x2="364" y2="140"/>
<polyline points="360,136 364,140 360,144"/>
<line x1="518" y1="140" x2="528" y2="140"/>
<polyline points="524,136 528,140 524,144"/>
</g>
<!-- the invariant -->
<line class="e" x1="40" y1="212" x2="680" y2="212" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="232" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">THE INVARIANT IS NOT THAT NO PASSWORD EXISTS · IT IS THAT NO PASSWORD TRANSITS A CHANNEL</text>
<rect class="s as" x="40" y="242" width="640" height="48" rx="3" fill="#f4f4f4" stroke="#4a6741" stroke-width="1.4"/>
<text class="i2" x="56" y="264" font-size="9.5" fill="#404040">The only secret in motion is the enrollment link and its code: single-use, expiring in 24 hours, carried in a conversation</text>
<text class="i2" x="56" y="279" font-size="9.5" fill="#404040">that already exists. The password is chosen by its owner, in their own browser, and the admin never sees it.</text>
<!-- consequences -->
<rect class="p e" x="40" y="304" width="200" height="98" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="n" x="52" y="323" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#a8443a">DROP THE CODE, DEAD-END</text>
<text class="i2" x="52" y="340" font-size="8.5" fill="#404040">The link lands on a form with an</text>
<text class="i2" x="52" y="351" font-size="8.5" fill="#404040">empty code field. Both admin pages</text>
<text class="i2" x="52" y="362" font-size="8.5" fill="#404040">once kept only recovery_link, and</text>
<text class="i2" x="52" y="373" font-size="8.5" fill="#404040">nothing looked wrong from the side</text>
<text class="i2" x="52" y="384" font-size="8.5" fill="#404040">that performs the action.</text>
<text class="m" x="52" y="396" font-family="'IBM Plex Mono', Menlo, monospace" font-size="7.5" font-weight="700" letter-spacing="0.8" fill="#707070">UNENFORCED — NO GATE COVERS IT</text>
<rect class="p e" x="260" y="304" width="200" height="98" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="272" y="323" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">ADMINS ARE REFUSED THIS PATH</text>
<text class="i2" x="272" y="340" font-size="8.5" fill="#404040">shouldRefuseRecovery blocks the</text>
<text class="i2" x="272" y="351" font-size="8.5" fill="#404040">action in the portal, and Kratos</text>
<text class="i2" x="272" y="362" font-size="8.5" fill="#404040">refuses again behind it through the</text>
<text class="i2" x="272" y="373" font-size="8.5" fill="#404040">recovery-gate webhook, fail closed.</text>
<text class="i2" x="272" y="384" font-size="8.5" fill="#404040">A locked-out admin goes to the</text>
<text class="i2" x="272" y="395" font-size="8.5" fill="#404040">break-glass runbook instead.</text>
<rect class="p e" x="480" y="304" width="200" height="98" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="492" y="323" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">ENROLLED IS NOT ENTITLED</text>
<text class="i2" x="492" y="340" font-size="8.5" fill="#404040">A new member can sign in and sees</text>
<text class="i2" x="492" y="351" font-size="8.5" fill="#404040">no app tiles at all. Every access</text>
<text class="i2" x="492" y="362" font-size="8.5" fill="#404040">group is a separate, later admin</text>
<text class="i2" x="492" y="373" font-size="8.5" fill="#404040">act on the user's own page — which</text>
<text class="i2" x="492" y="384" font-size="8.5" fill="#404040">is what forces someone to look at</text>
<text class="i2" x="492" y="395" font-size="8.5" fill="#404040">what is being given.</text>
</g>
</svg>
