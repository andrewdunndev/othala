<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="fc-t fc-d" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title id="fc-t">How a first credential arrives without a password ever crossing a wire</title>
<desc id="fc-d">An admin creates the identity through the admin API with no credentials block at all, then mints a one-time recovery link and code together and hands both over on a conversation that already exists with that person; link and code stay apart from any password. The recipient's own browser is where a password and a passkey first get set. One branch refuses outright: when the target carries the admin marker, shouldRefuseRecovery refuses before Kratos is ever asked, and the refusal is console-only. Pinned by portal/scripts/admin-recovery-gate.test.mjs and e2e/playwright/tests/zh-admin-create-identity.spec.ts.</desc>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}.dg .ns{stroke:var(--no)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<defs>
<marker id="fc-arrow-mut" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#707070"/>
</marker>
<marker id="fc-arrow-no" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#a8443a"/>
</marker>
</defs>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="540" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="500" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<!-- header -->
<text class="m" x="40" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">ENROLMENT · NO PASSWORD EVER TRANSITS A CHANNEL</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">THE ADMIN CREATES THE IDENTITY</text>
<!-- creation box -->
<rect class="p as" x="180" y="88" width="360" height="54" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="360" y="109" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.6" fill="#4a6741">createIdentity — admin-api.ts</text>
<text class="i" x="360" y="127" text-anchor="middle" font-size="11" fill="#0a0a0a">NO credentials block, ever</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="360" y1="142" x2="360" y2="179" marker-end="url(#fc-arrow-mut)"/>
</g>
<!-- hand delivery -->
<text class="m" x="210" y="190" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">HAND-DELIVERY</text>
<rect class="s e" x="210" y="200" width="300" height="96" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="222" y="219" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">getRecoveryLink</text>
<text class="i2" x="222" y="237" font-size="11" fill="#404040">link + code minted together,</text>
<text class="i2" x="222" y="252" font-size="11" fill="#404040">one request</text>
<text class="m" x="222" y="272" font-size="11" fill="#707070">handed over on a conversation that</text>
<text class="m" x="222" y="287" font-size="11" fill="#707070">already exists with that person</text>
<!-- refusal branch: the admin-marked-target check gates the top of this path -->
<g data-step="3">
<g class="ns" stroke="#a8443a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 3">
<polyline points="510,218 616,218 616,232" marker-end="url(#fc-arrow-no)"/>
</g>
<text class="n" x="516" y="211" font-size="10" fill="#a8443a">admin-marked target?</text>
<rect class="s e2" x="544" y="236" width="144" height="60" rx="3" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1"/>
<text class="n" x="556" y="256" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#a8443a">REFUSED</text>
<text class="m" x="556" y="272" font-size="10" fill="#707070">console-only —</text>
<text class="m" x="556" y="286" font-size="10" fill="#707070">shouldRefuseRecovery</text>
</g>
<g data-step="2">
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="360" y1="296" x2="360" y2="339" marker-end="url(#fc-arrow-mut)"/>
</g>
<rect class="p as" x="230" y="342" width="260" height="66" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="360" y="362" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.6" fill="#4a6741">RECIPIENT'S OWN BROWSER</text>
<text class="i" x="360" y="381" text-anchor="middle" font-size="11" fill="#0a0a0a">redeems the code, sets a</text>
<text class="i" x="360" y="396" text-anchor="middle" font-size="11" fill="#0a0a0a">password and a passkey</text>
</g>
<!-- footer -->
<line class="e" x1="40" y1="428" x2="680" y2="428" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="448" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">THE INVARIANT</text>
<text class="a" x="40" y="470" font-size="13" font-weight="700" fill="#4a6741">Not "no password exists" — no password ever transits a channel.</text>
<text class="m" x="40" y="490" font-size="10.5" fill="#707070">Link and code stay apart from any password. DECISIONS.md § No password ever transits a channel.</text>
<text class="m" x="40" y="505" font-size="10.5" fill="#707070">Pinned by portal/scripts/admin-recovery-gate.test.mjs and e2e/playwright/tests/zh-admin-create-identity.spec.ts.</text>
</g>
</svg>
