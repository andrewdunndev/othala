<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="fc-t fc-d" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title id="fc-t">How a first credential arrives without a password ever crossing a wire</title>
<desc id="fc-d">An admin creates the identity through the admin API with no credentials block at all. Two channels can then carry the enrolment secret, and both keep link and code apart from any password. Hand-delivery: the admin mints a one-time recovery link and code together and hands both over on a conversation that already exists with that person. Email, the D1 addendum: the admin re-types the target address and the server checks it byte-equal against the identity's own trait before anything is sent; sendInviteRecoveryEmail then drives Kratos's own self-service recovery flow so the Kratos courier sends a code alone, never a link with the code embedded. Either way the recipient's own browser is where a password and a passkey first get set. One branch refuses outright: when the target carries the admin marker, shouldRefuseRecovery refuses before Kratos is ever asked, and the refusal is console-only. Pinned by e2e/playwright/tests/u-admin-invite-email.spec.ts, cases U1 through U3, and portal/scripts/admin-recovery-gate.test.mjs.</desc>
