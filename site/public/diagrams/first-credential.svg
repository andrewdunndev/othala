<text class="m" x="380" y="182" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">D1 · EMAIL, KRATOS COURIER</text>
<rect class="s e" x="380" y="192" width="300" height="112" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="392" y="210" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">confirmsInviteAddress</text>
<text class="m" x="392" y="221" font-size="8.5" fill="#707070">admin re-types the address; byte-</text>
<text class="m" x="392" y="232" font-size="8.5" fill="#707070">equal check runs server-side, before</text>
