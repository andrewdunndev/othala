<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" width="720" height="550" role="img" aria-labelledby="fa-t fa-d" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title id="fa-t">The forward-auth request path: browser, edge, Caddy, portal, Kratos, app</title>
<desc id="fa-d">A browser carrying the apex-scoped Kratos session cookie reaches the estate edge, which hands the request to the service's own Caddy. Caddy does not proxy it yet: it issues a sub-request to the portal's /api/forward-auth endpoint with the required group as a static query parameter set by the edge config. The portal reads that group, verifies the Kratos session from the request's own cookie, re-resolves the identity through the Kratos admin API because metadata_admin.groups is absent from whoami, and applies enforceGroupGate — identity active, every stored group canonical, and in the named group — failing closed at every step. The portal answers one of four statuses: 200 proxy through, 401 no usable session, 403 refused on the merits (inactive identity, a non-canonical stored group, a group miss, or a missing or malformed group parameter), and 503 when Kratos or its admin API did not answer. Caddy proxies to the app only on 200, setting X-Kratos-Authenticated-Identity-Id from the server-verified session id; every other status is a denial, and whether a denial becomes a login redirect is decided by the edge's own status matcher, not by the portal. 503 exists so that an outage cannot be matched into a login loop against the same portal that is down. The app never learns any of this; it sees only the header. The session check is why session.whoami.required_aal must stay aal1.</desc>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}.dg .ns{stroke:var(--no)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<defs>
<marker id="fa-arrow-mut" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#707070"/>
</marker>
<marker id="fa-arrow-no" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#a8443a"/>
</marker>
</defs>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="550" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="510" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">REQUEST PATH · AN APP THAT CANNOT SPEAK OIDC</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">THE REQUEST</text>
<rect class="s e" x="40" y="88" width="104" height="72" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">BROWSER</text>
<text class="i2" x="52" y="123" font-size="11" fill="#404040">carries the</text>
<text class="i2" x="52" y="137" font-size="11" fill="#404040">apex-scoped</text>
<text class="i2" x="52" y="151" font-size="11" fill="#404040">session cookie</text>
<rect class="s e" x="164" y="88" width="104" height="72" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="176" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">ESTATE EDGE</text>
<text class="i2" x="176" y="123" font-size="11" fill="#404040">L4 SNI routing</text>
<text class="i2" x="176" y="137" font-size="11" fill="#404040">— nothing</text>
<text class="i2" x="176" y="151" font-size="11" fill="#404040">decrypted</text>
<rect class="p as" x="288" y="88" width="190" height="72" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="300" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.6" fill="#4a6741">SERVICE CADDY · THE DOOR</text>
<text class="i" x="300" y="125" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">forward_auth, before</text>
<text class="i" x="300" y="141" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">any reverse_proxy</text>
<rect class="s e" x="560" y="88" width="120" height="72" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="572" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">THE APP</text>
<text class="i2" x="572" y="123" font-size="11" fill="#404040">no OIDC support.</text>
<text class="i2" x="572" y="137" font-size="11" fill="#404040">It sees only</text>
<text class="i2" x="572" y="151" font-size="11" fill="#404040">the header.</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="146" y1="132" x2="158" y2="132" marker-end="url(#fa-arrow-mut)"/>
<line x1="270" y1="132" x2="282" y2="132" marker-end="url(#fa-arrow-mut)"/>
<line x1="482" y1="132" x2="554" y2="132" marker-end="url(#fa-arrow-mut)"/>
</g>
<g data-step="3">
<text class="m" x="519" y="108" text-anchor="middle" font-size="11" fill="#707070">proxied only</text>
<text class="m" x="519" y="122" text-anchor="middle" font-size="11" fill="#707070">after 200</text>
<g class="ns" stroke="#a8443a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="4 3">
<polyline points="300,160 300,186 92,186 92,162" marker-end="url(#fa-arrow-no)"/>
</g>
<text class="n" x="104" y="179" font-size="11" fill="#a8443a">denied — the edge's matcher decides</text>
</g>
<text class="m" x="40" y="218" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">THE GATE · A SUB-REQUEST, NOT A REDIRECT</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="436" y1="160" x2="436" y2="222" marker-end="url(#fa-arrow-mut)"/>
<line x1="400" y1="224" x2="400" y2="162" marker-end="url(#fa-arrow-mut)"/>
</g>
<text class="m" x="392" y="200" text-anchor="end" font-size="11" fill="#707070">200 / 401 / 403 / 503</text>
<text class="m" x="444" y="200" font-size="11" fill="#707070">?group=audiobookshelf-access</text>
<rect class="p as" x="180" y="224" width="260" height="160" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="192" y="242" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#4a6741">PORTAL · /api/forward-auth</text>
<text class="i2" x="192" y="260" font-size="11" fill="#404040">1 · the group comes from the query</text>
<text class="m" x="202" y="274" font-size="11" fill="#707070">param the edge config sets — never</text>
<text class="m" x="202" y="288" font-size="11" fill="#707070">from an inbound header</text>
<text class="i2" x="192" y="306" font-size="11" fill="#404040">2 · verify the Kratos session cookie</text>
<text class="i2" x="192" y="322" font-size="11" fill="#404040">3 · re-resolve the identity, admin API</text>
<text class="i2" x="192" y="338" font-size="11" fill="#404040">4 · enforceGroupGate: active, every stored</text>
<text class="m" x="202" y="352" font-size="11" fill="#707070">group canonical, and in the named group</text>
<text class="m" x="192" y="373" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#707070">FAIL CLOSED AT EVERY STEP</text>
<g data-step="2">
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="444" y1="262" x2="468" y2="262" marker-end="url(#fa-arrow-mut)"/>
<line x1="444" y1="324" x2="468" y2="324" marker-end="url(#fa-arrow-mut)"/>
</g>
<rect class="s e2" x="476" y="224" width="204" height="160" rx="3" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1"/>
<text class="m" x="488" y="242" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">KRATOS</text>
<text class="i" x="488" y="262" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">whoami</text>
<text class="m" x="488" y="276" font-size="11" fill="#707070">gives the identity id — pinned</text>
<text class="m" x="488" y="290" font-size="11" fill="#707070">aal1, or this gate locks out</text>
<text class="i" x="488" y="324" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">admin API</text>
<text class="m" x="488" y="338" font-size="11" fill="#707070">gives state and metadata_admin</text>
<text class="m" x="488" y="352" font-size="11" fill="#707070">.groups — not in whoami</text>
<text class="n" x="488" y="372" font-size="11" fill="#a8443a">no answer → a 503</text>
</g>
<g data-step="3">
<line class="e" x1="40" y1="402" x2="680" y2="402" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="424" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">STATUS CONTRACT · CADDY KEYS ON THE STATUS, NEVER THE BODY</text>
<text class="y" x="40" y="448" font-size="13" font-weight="700" fill="#4a7a4a">200</text>
<text class="i2" x="84" y="448" font-size="11" fill="#404040">proxy through, with X-Kratos-Authenticated-Identity-Id set from the server-verified session id.</text>
<text class="m" x="40" y="471" font-size="13" font-weight="700" fill="#707070">401</text>
<text class="i2" x="84" y="471" font-size="11" fill="#404040">no usable session, and nothing else. This is the status an edge can safely turn into a login redirect.</text>
<text class="n" x="40" y="494" font-size="13" font-weight="700" fill="#a8443a">403</text>
<text class="i2" x="84" y="494" font-size="11" fill="#404040">refused on the merits: inactive identity, non-canonical stored group, group miss — plus a bad ?group= param.</text>
<text class="n" x="40" y="517" font-size="13" font-weight="700" fill="#a8443a">503</text>
<text class="i2" x="84" y="517" font-size="11" fill="#404040">Kratos or its admin API did not answer. Denies like a 403 — but must never be matched into a redirect.</text>
</g>
</g>
</svg>
