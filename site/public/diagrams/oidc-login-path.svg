<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580" role="img" aria-labelledby="ol-t ol-d" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title id="ol-t">The OIDC login happy path</title>
<desc id="ol-d">A browser visiting an example relying party, Grafana, is redirected to Hydra's authorize endpoint, which opens a login challenge on the app. With no session yet the app bounces the browser to Kratos, which runs the passkey challenge — passkey is the primary credential, not a second factor. Kratos sets the session cookie and resumes the authorize request at Hydra, which opens a consent challenge on the app. The app gates access again, composes the id_token claims through composeIDTokenClaims — groups only if the manifest opts in, then the resolved role's claim_emit merged in — and accepts. Hydra redirects the browser back to Grafana with a code, and Grafana exchanges it for tokens server-side: signed in. A remembered subject (Hydra skip=true) takes a different first step — it re-verifies a live Kratos session before honouring the skip, shown in the companion diagram 'Hydra remembers; Kratos authenticates.' Pinned end to end by e2e/playwright/tests/a-login-session.spec.ts, b-oidc-claims.spec.ts and i-passkey-register-login.spec.ts.</desc>
