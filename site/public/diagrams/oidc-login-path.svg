<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580" role="img" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title>The OIDC login happy path</title>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}.dg .ns{stroke:var(--no)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<defs>
<marker id="ol-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#707070"/>
</marker>
<marker id="ol-arrow-acc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#4a6741"/>
</marker>
</defs>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="580" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="540" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<!-- header -->
<g class="as" stroke="#4a6741" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(37 29) scale(0.3)">
<line x1="32" y1="8" x2="48" y2="24"/>
<line x1="48" y1="24" x2="32" y2="40"/>
<line x1="32" y1="40" x2="16" y2="24"/>
<line x1="16" y1="24" x2="32" y2="8"/>
<line x1="32" y1="40" x2="18" y2="56"/>
<line x1="32" y1="40" x2="46" y2="56"/>
</g>
<text class="m" x="60" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">OIDC LOGIN · THE HAPPY PATH</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">EXAMPLE RELYING PARTY: GRAFANA</text>
<!-- lifeline headers -->
<rect class="s e" x="50" y="88" width="100" height="26" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="100" y="105" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8" fill="#707070">BROWSER</text>
<rect class="s e" x="230" y="88" width="100" height="26" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="280" y="105" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8" fill="#707070">HYDRA</text>
<rect class="p as" x="410" y="88" width="100" height="26" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="460" y="105" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8" fill="#4a6741">OTHALA APP</text>
<rect class="s e" x="570" y="88" width="100" height="26" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="620" y="105" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8" fill="#707070">KRATOS</text>
<!-- lifelines -->
<g class="e" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3 3">
<line x1="100" y1="114" x2="100" y2="446"/>
<line x1="280" y1="114" x2="280" y2="446"/>
<line x1="460" y1="114" x2="460" y2="446"/>
<line x1="620" y1="114" x2="620" y2="446"/>
</g>
<!-- messages -->
<g class="ms" stroke="#707070" stroke-width="1.3" stroke-linecap="round" fill="none">
<line x1="100" y1="144" x2="278" y2="144" marker-end="url(#ol-arrow)"/>
<line x1="280" y1="180" x2="458" y2="180" marker-end="url(#ol-arrow)"/>
<line x1="460" y1="216" x2="102" y2="216" stroke-dasharray="5 3" marker-end="url(#ol-arrow)"/>
<line x1="100" y1="252" x2="618" y2="252" marker-end="url(#ol-arrow)"/>
<line x1="620" y1="288" x2="102" y2="288" stroke-dasharray="5 3" marker-end="url(#ol-arrow)"/>
<line x1="100" y1="324" x2="278" y2="324" marker-end="url(#ol-arrow)"/>
<line x1="280" y1="360" x2="458" y2="360" marker-end="url(#ol-arrow)"/>
<line x1="460" y1="396" x2="282" y2="396" marker-end="url(#ol-arrow)"/>
</g>
<g class="as" stroke="#4a6741" stroke-width="1.3" stroke-linecap="round" fill="none">
<line x1="280" y1="432" x2="102" y2="432" stroke-dasharray="5 3" marker-end="url(#ol-arrow-acc)"/>
</g>
<text class="m" x="190" y="138" text-anchor="middle" font-size="7.2" fill="#707070">1 · /oauth2/authorize (via Grafana's 302)</text>
<text class="m" x="370" y="174" text-anchor="middle" font-size="7.2" fill="#707070">2 · GET /oauth2/login — login challenge</text>
<text class="m" x="280" y="210" text-anchor="middle" font-size="7.2" fill="#707070">3 · no session yet — 302 to Kratos login</text>
<text class="m" x="360" y="246" text-anchor="middle" font-size="7.2" fill="#707070">4 · passkey challenge — passkey is the primary credential</text>
<text class="m" x="360" y="282" text-anchor="middle" font-size="7.2" fill="#707070">5 · session cookie set — resume /oauth2/authorize</text>
<text class="m" x="190" y="318" text-anchor="middle" font-size="7.2" fill="#707070">6 · resume /oauth2/authorize</text>
<text class="m" x="370" y="354" text-anchor="middle" font-size="7.2" fill="#707070">7 · GET /oauth2/consent — consent challenge</text>
<text class="m" x="370" y="390" text-anchor="middle" font-size="7.2" fill="#707070">8 · accept — gate again; groups → claims (claims.ts)</text>
<text class="a" x="190" y="426" text-anchor="middle" font-size="7.2" fill="#4a6741">9 · 302 with code → Grafana</text>
<!-- terminal marker -->
<rect class="s e" x="40" y="452" width="140" height="34" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="y" x="110" y="474" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="0.6" fill="#4a7a4a">SIGNED IN</text>
<text class="m" x="192" y="470" font-size="8" fill="#707070">Grafana exchanges the code for tokens, server-side.</text>
<!-- footer -->
<line class="e" x1="40" y1="500" x2="680" y2="500" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="518" font-size="8" fill="#707070">A remembered subject (Hydra skip=true) takes a different step 3 — it re-verifies a live Kratos session before</text>
<text class="m" x="40" y="530" font-size="8" fill="#707070">honouring the skip. See "Hydra remembers; Kratos authenticates."</text>
<text class="m" x="40" y="548" font-size="8" fill="#707070">Pinned by e2e/playwright/tests/t-access-model.spec.ts and i-passkey-register-login.spec.ts.</text>
</g>
</svg>
