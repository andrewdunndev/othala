<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" width="720" height="478" role="img" aria-labelledby="sr-t sr-d" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title id="sr-t">Hydra remembers; Kratos authenticates</title>
<desc id="sr-d">Two panels. Left: when Hydra reports skip=true because it remembers a subject, the login handler does not honour that alone — it re-verifies that a live Kratos session exists whose identity.id equals the remembered subject. No live match forces interactive re-authentication at Kratos's own login UI; a match honours the skip and accepts login with the subject and acr taken from that live session. Skip alone is not enough, pinned by the FIX-A cases in portal/scripts/oauth2-handlers.test.mjs. Right: revokeSubject is the one in-process revocation fan-out, triggered by admin force-logout, user sign-out-everywhere, or deactivate. On deactivate only, Kratos state flips to inactive first. Then, for every trigger: Kratos sessions are revoked, Hydra's login-session is revoked to cut the remember window, and Hydra's consent-session is revoked. This cuts sessions and remembered logins but not enrolled credentials — the full eviction procedure audits credentials, deletes the affected credential type, and only then revokes, specified by e2e/playwright/tests/p-eviction.spec.ts but not yet live (every case there is fixme).</desc>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}.dg .ns{stroke:var(--no)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<defs>
<marker id="sr-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#707070"/>
</marker>
</defs>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="478" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="438" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">SESSIONS · HYDRA REMEMBERS, KRATOS AUTHENTICATES</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">(A) LOGIN SKIP ·</text>
<text class="m" x="40" y="93" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">RE-VERIFY BEFORE HONOURING</text>
<g data-step="2">
<text class="m" x="380" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">(B) REVOKE ·</text>
<text class="m" x="380" y="93" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">THE FAN-OUT</text>
</g>
<rect class="s e" x="40" y="104" width="300" height="52" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="122" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">HYDRA · skip = true</text>
<text class="i2" x="52" y="143" font-size="11" fill="#404040">remembers this subject (login.subject)</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="190" y1="156" x2="190" y2="183" marker-end="url(#sr-arrow)"/>
</g>
<text class="m" x="200" y="174" font-size="10" fill="#707070">re-verify</text>
<rect class="p as" x="40" y="186" width="300" height="68" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="52" y="204" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#4a6741">KRATOS SESSION CHECK</text>
<text class="i" x="52" y="223" font-size="11" fill="#0a0a0a">session.active AND</text>
<text class="i" x="52" y="239" font-size="11" fill="#0a0a0a">session.identity.id === login.subject</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="150" y1="254" x2="111.7" y2="278.9" marker-end="url(#sr-arrow)"/>
<line x1="230" y1="254" x2="268.3" y2="278.9" marker-end="url(#sr-arrow)"/>
</g>
<text class="n" x="96" y="274" text-anchor="end" font-size="10.5" font-weight="700" fill="#a8443a">no match</text>
<text class="y" x="284" y="274" text-anchor="start" font-size="10.5" font-weight="700" fill="#4a7a4a">match</text>
<rect class="s e" x="40" y="284" width="146" height="86" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="52" y="303" font-size="10.5" fill="#404040">Hydra remembered the</text>
<text class="i2" x="52" y="317" font-size="10.5" fill="#404040">subject; no live Kratos</text>
<text class="i2" x="52" y="331" font-size="10.5" fill="#404040">session matches it</text>
<text class="n" x="52" y="358" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.8" fill="#a8443a">FORCE RE-AUTH</text>
<rect class="s e" x="194" y="284" width="146" height="86" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="206" y="303" font-size="10.5" fill="#404040">session.active and its</text>
<text class="i2" x="206" y="317" font-size="10.5" fill="#404040">identity match the</text>
<text class="i2" x="206" y="331" font-size="10.5" fill="#404040">remembered subject</text>
<text class="y" x="206" y="358" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.8" fill="#4a7a4a">HONOUR SKIP</text>
<text class="a" x="40" y="398" font-size="12.5" font-weight="700" fill="#4a6741">Skip alone is not enough.</text>
<text class="m" x="40" y="416" font-size="10.5" fill="#707070">Pinned by the FIX-A cases in</text>
<text class="m" x="40" y="430" font-size="10.5" fill="#707070">portal/scripts/oauth2-handlers.test.mjs.</text>
<g data-step="2">
<rect class="s e" x="380" y="104" width="93" height="36" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="426.5" y="126" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#404040">ADMIN LOGOUT</text>
<rect class="s e" x="483" y="104" width="93" height="36" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="529.5" y="126" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#404040">SIGN-OUT ALL</text>
<rect class="s e" x="586" y="104" width="94" height="36" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="633" y="126" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" fill="#404040">DEACTIVATE</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="426.5" y1="140" x2="498.1" y2="163.4" marker-end="url(#sr-arrow)"/>
<line x1="529.5" y1="140" x2="529.5" y2="162" marker-end="url(#sr-arrow)"/>
<line x1="633" y1="140" x2="561.9" y2="163.4" marker-end="url(#sr-arrow)"/>
</g>
<rect class="p as" x="430" y="164" width="200" height="34" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="530" y="186" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#4a6741">revokeSubject(subject)</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="530" y1="198" x2="530" y2="219" marker-end="url(#sr-arrow)"/>
</g>
<rect class="p as" x="380" y="221" width="300" height="142" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="i2" x="392" y="240" font-size="11" fill="#404040">1 · state → inactive (deactivate trigger only,</text>
<text class="m" x="402" y="254" font-size="11" fill="#707070">must precede step 2)</text>
<text class="i2" x="392" y="272" font-size="11" fill="#404040">2 · Kratos sessions revoked</text>
<text class="m" x="402" y="286" font-size="11" fill="#707070">(404 = nothing to revoke = success)</text>
<text class="i2" x="392" y="304" font-size="11" fill="#404040">3 · Hydra login-session revoked</text>
<text class="m" x="402" y="318" font-size="11" fill="#707070">cuts the remember window</text>
<text class="i2" x="392" y="336" font-size="11" fill="#404040">4 · Hydra consent-session revoked</text>
<text class="m" x="392" y="354" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6" fill="#707070">STEPS 1–2 ARE THE HARD CUT — ORDER FIXED</text>
<text class="a" x="380" y="398" font-size="12.5" font-weight="700" fill="#4a6741">Sessions, not credentials.</text>
<text class="m" x="380" y="416" font-size="10.5" fill="#707070">Eviction order — audit, delete the credential type,</text>
<text class="m" x="380" y="430" font-size="10.5" fill="#707070">then revoke — specified by p-eviction.spec.ts,</text>
<text class="m" x="380" y="444" font-size="10.5" fill="#707070">not yet live.</text>
</g>
</g>
</svg>
