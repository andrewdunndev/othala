<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" width="720" height="414" role="img" aria-labelledby="sr-t sr-d" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title id="sr-t">Hydra remembers; Kratos authenticates</title>
<desc id="sr-d">Two panels. Left: when Hydra reports skip=true because it remembers a subject, the login handler does not honour that alone — it re-verifies that a live Kratos session exists whose identity.id equals the remembered subject. No live match forces interactive re-authentication at Kratos's own login UI; a match honours the skip and accepts login with the subject and acr taken from that live session. Skip alone is not enough, pinned by the FIX-A cases in portal/scripts/oauth2-handlers.test.mjs. Right: revokeSubject is the one in-process revocation fan-out, triggered by admin force-logout, user sign-out-everywhere, or deactivate. On deactivate only, Kratos state flips to inactive first. Then, for every trigger: Kratos sessions are revoked, Hydra's login-session is revoked to cut the 24-hour remember window, and Hydra's consent-session is revoked. This cuts sessions and remembered logins but not enrolled credentials — the full eviction procedure audits credentials, deletes the affected credential type, and only then revokes, walked by e2e/playwright/tests/p-eviction.spec.ts.</desc>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}.dg .ns{stroke:var(--no)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="414" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="374" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<!-- header -->
<g class="as" stroke="#4a6741" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(37 29) scale(0.3)">
<line x1="32" y1="8" x2="48" y2="24"/>
<line x1="48" y1="24" x2="32" y2="40"/>
<line x1="32" y1="40" x2="16" y2="24"/>
<line x1="16" y1="24" x2="32" y2="8"/>
<line x1="32" y1="40" x2="18" y2="56"/>
<line x1="32" y1="40" x2="46" y2="56"/>
</g>
<text class="m" x="60" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">SESSIONS · HYDRA REMEMBERS, KRATOS AUTHENTICATES</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<!-- column headers -->
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">(A) LOGIN SKIP · RE-VERIFY BEFORE HONOURING</text>
<text class="m" x="380" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">(B) REVOKE · THE FAN-OUT</text>
<!-- PANEL A -->
<rect class="s e" x="40" y="88" width="300" height="48" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">HYDRA · skip = true</text>
<text class="i2" x="52" y="122" font-size="8.5" fill="#404040">remembers this subject (login.subject)</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="190" y1="136" x2="190" y2="158"/>
<polyline points="185.5,158 190,163 194.5,158"/>
</g>
<text class="m" x="200" y="152" font-size="7.5" fill="#707070">re-verify</text>
<rect class="p as" x="40" y="163" width="300" height="60" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="52" y="181" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#4a6741">KRATOS SESSION CHECK</text>
<text class="i" x="52" y="197" font-size="8.5" fill="#0a0a0a">session.active AND</text>
<text class="i" x="52" y="209" font-size="8.5" fill="#0a0a0a">session.identity.id === login.subject</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="150" y1="223" x2="110" y2="248"/>
<polyline points="102.9,244.8 110,248 108.4,255.7"/>
<line x1="230" y1="223" x2="270" y2="248"/>
<polyline points="271.6,255.7 270,248 277.1,244.8"/>
</g>
<text class="n" x="93" y="245" text-anchor="end" font-size="8" font-weight="700" fill="#a8443a">no match</text>
<text class="y" x="287" y="245" text-anchor="start" font-size="8" font-weight="700" fill="#4a7a4a">match</text>
<rect class="s e" x="40" y="252" width="140" height="66" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="52" y="270" font-size="8" fill="#404040">Hydra remembered the</text>
<text class="i2" x="52" y="281" font-size="8" fill="#404040">subject; no live Kratos</text>
<text class="i2" x="52" y="292" font-size="8" fill="#404040">session matches it</text>
<text class="n" x="52" y="310" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#a8443a">FORCE RE-AUTH</text>
<rect class="s e" x="200" y="252" width="140" height="66" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="212" y="270" font-size="8" fill="#404040">session.active and its</text>
<text class="i2" x="212" y="281" font-size="8" fill="#404040">identity match the</text>
<text class="i2" x="212" y="292" font-size="8" fill="#404040">remembered subject</text>
<text class="y" x="212" y="310" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#4a7a4a">HONOUR SKIP</text>
<text class="a" x="40" y="344" font-size="10.5" font-weight="700" fill="#4a6741">Skip alone is not enough.</text>
<text class="m" x="40" y="362" font-size="8" fill="#707070">Pinned by the FIX-A cases in</text>
<text class="m" x="40" y="374" font-size="8" fill="#707070">portal/scripts/oauth2-handlers.test.mjs.</text>
<!-- PANEL B -->
<rect class="s e" x="380" y="88" width="93" height="34" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="426.5" y="109" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="7" fill="#404040">ADMIN LOGOUT</text>
<rect class="s e" x="483" y="88" width="93" height="34" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="529.5" y="109" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="7" fill="#404040">SIGN-OUT ALL</text>
<rect class="s e" x="586" y="88" width="94" height="34" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="i2" x="633" y="109" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="7" fill="#404040">DEACTIVATE</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="426.5" y1="122" x2="500" y2="146"/>
<line x1="529.5" y1="122" x2="529.5" y2="146"/>
<line x1="633" y1="122" x2="560" y2="146"/>
<polyline points="495,138.8 500,146 492,145.4"/>
<polyline points="525,141 529.5,146 534,141"/>
<polyline points="568,145.4 560,146 565,138.8"/>
</g>
<rect class="p as" x="440" y="146" width="180" height="32" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="530" y="166" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" fill="#4a6741">revokeSubject(subject)</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="530" y1="178" x2="530" y2="196"/>
<polyline points="525.5,196 530,201 534.5,196"/>
</g>
<rect class="p as" x="380" y="201" width="300" height="122" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="i2" x="392" y="219" font-size="8.5" fill="#404040">1 · state → inactive (deactivate trigger only,</text>
<text class="m" x="402" y="230" font-size="8.5" fill="#707070">must precede step 2)</text>
<text class="i2" x="392" y="247" font-size="8.5" fill="#404040">2 · Kratos sessions revoked</text>
<text class="m" x="402" y="258" font-size="8.5" fill="#707070">(404 = nothing to revoke = success)</text>
<text class="i2" x="392" y="275" font-size="8.5" fill="#404040">3 · Hydra login-session revoked</text>
<text class="m" x="402" y="286" font-size="8.5" fill="#707070">cuts the 24h remember window</text>
<text class="i2" x="392" y="303" font-size="8.5" fill="#404040">4 · Hydra consent-session revoked</text>
<text class="m" x="392" y="315" font-family="'IBM Plex Mono', Menlo, monospace" font-size="7.5" font-weight="700" letter-spacing="0.6" fill="#707070">STEPS 1–2 ARE THE HARD CUT — ORDER FIXED</text>
<text class="a" x="380" y="344" font-size="10.5" font-weight="700" fill="#4a6741">Sessions, not credentials.</text>
<text class="m" x="380" y="362" font-size="8" fill="#707070">Eviction order — audit, delete the credential type,</text>
<text class="m" x="380" y="374" font-size="8" fill="#707070">then revoke — walked by p-eviction.spec.ts.</text>
</g>
</svg>
