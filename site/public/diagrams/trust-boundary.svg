<text class="i2" x="287" y="402" font-size="8.5" fill="#404040">separate databases —</text>
<text class="i2" x="287" y="413" font-size="8.5" fill="#404040">Kratos, Hydra</text>
<!-- callout -->
<line class="e" x1="40" y1="480" x2="680" y2="480" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="500" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">ADMIN-API ISOLATION</text>
<text class="a" x="40" y="520" font-size="11" font-weight="700" fill="#4a6741">Admin APIs are reachable only from the app — never from the edge.</text>
<text class="m" x="40" y="538" font-size="8" fill="#707070">Enforced by scripts/render-config.sh (fails the render when the admin bind-address token is unset),</text>
<text class="m" x="40" y="550" font-size="8" fill="#707070">requireAdminSession (portal/src/lib/admin.ts), and pinned by d-admin-aal2-stepup.spec.ts + f-aal2-bypass.spec.ts.</text>
</g>
