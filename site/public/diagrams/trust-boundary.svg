<rect class="p e" x="20" y="20" width="680" height="540" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<!-- header -->
<g class="as" stroke="#4a6741" stroke-width="5" stroke-linecap="round" fill="none" transform="translate(37 29) scale(0.3)">
<line x1="32" y1="8" x2="48" y2="24"/>
<line x1="48" y1="24" x2="32" y2="40"/>
<line x1="32" y1="40" x2="16" y2="24"/>
<line x1="16" y1="24" x2="32" y2="8"/>
<line x1="32" y1="40" x2="18" y2="56"/>
<line x1="32" y1="40" x2="46" y2="56"/>
</g>
<text class="m" x="60" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">TRUST BOUNDARY · WHAT THE NETWORK CAN ACTUALLY REACH</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="78" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#707070">THE NETWORK SEES THREE PORTS</text>
<!-- outside the boundary -->
<rect class="s e" x="40" y="88" width="100" height="54" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">BROWSER</text>
<text class="i2" x="52" y="121" font-size="8.5" fill="#404040">reaches one</text>
<text class="i2" x="52" y="132" font-size="8.5" fill="#404040">hostname per app</text>
<rect class="p as" x="170" y="88" width="170" height="54" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="182" y="106" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8" fill="#4a6741">EDGE PROXY</text>
<text class="i" x="182" y="121" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">one hostname, TLS —</text>
<text class="i" x="182" y="132" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" fill="#0a0a0a">routes to three ports</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="140" y1="115" x2="164" y2="115"/>
<polyline points="158,110.5 164,115 158,119.5"/>
</g>
<!-- fan-out labels, floating in the gap above the trust domain -->
<text class="m" x="130" y="158" text-anchor="middle" font-size="7.5" fill="#707070">self-service, sessions</text>
<text class="m" x="360" y="158" text-anchor="middle" font-size="7.5" fill="#707070">public SSR</text>
<text class="m" x="590" y="158" text-anchor="middle" font-size="7.5" fill="#707070">authorize, token, discovery</text>
<!-- trust domain group -->
<rect class="p as" x="40" y="190" width="640" height="270" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4" stroke-dasharray="5 3"/>
<text class="a" x="52" y="210" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1.1" fill="#4a6741">ONE TRUST DOMAIN · THE ADMIN APIS NEVER LEAVE IT</text>
<!-- fan-out from the edge to each public API -->
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="205" y1="142" x2="155" y2="248"/>
<polyline points="150.8,240.6 155,248 146.9,246.8"/>
<line x1="255" y1="142" x2="360" y2="248"/>
<polyline points="354.4,241.3 360,248 351.9,249.2"/>
<line x1="305" y1="142" x2="565" y2="248"/>
<polyline points="559,242.4 565,248 556.7,248.8"/>
</g>
<!-- node row: kratos / app / hydra -->
<rect class="s e" x="80" y="252" width="140" height="90" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="92" y="270" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">KRATOS</text>
<text class="i2" x="92" y="288" font-size="8.5" fill="#404040">Self-service login,</text>
<text class="i2" x="92" y="299" font-size="8.5" fill="#404040">recovery, settings</text>
<rect class="p as" x="250" y="252" width="220" height="90" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="262" y="270" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#4a6741">THE APP</text>
<line class="e" x1="262" y1="298" x2="458" y2="298" stroke="#e0e0e0" stroke-width="1"/>
<text class="i" x="262" y="282" font-family="'IBM Plex Mono', Menlo, monospace" font-size="7.5" font-weight="700" letter-spacing="0.6" fill="#0a0a0a">PUBLIC SSR</text>
<text class="m" x="262" y="292" font-size="7.5" fill="#707070">challenge providers, UI</text>
<text class="a" x="262" y="312" font-family="'IBM Plex Mono', Menlo, monospace" font-size="7.5" font-weight="700" letter-spacing="0.6" fill="#4a6741">ADMIN · LOOPBACK</text>
<text class="m" x="262" y="322" font-size="7.5" fill="#707070">ADMIN_HOST mux — not</text>
<text class="m" x="262" y="332" font-size="7.5" fill="#707070">the Astro handler</text>
<rect class="s e" x="500" y="252" width="140" height="90" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="512" y="270" font-family="'IBM Plex Mono', Menlo, monospace" font-size="8" font-weight="700" letter-spacing="1.1" fill="#707070">HYDRA</text>
<text class="i2" x="512" y="288" font-size="8.5" fill="#404040">OAuth2 / OIDC —</text>
<text class="i2" x="512" y="299" font-size="8.5" fill="#404040">issues tokens, no UI</text>
<!-- admin API arrows: app to kratos, app to hydra -->
<g class="as" stroke="#4a6741" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="250" y1="278" x2="226" y2="278"/>
<polyline points="232,273.5 226,278 232,282.5"/>
<line x1="470" y1="278" x2="494" y2="278"/>
