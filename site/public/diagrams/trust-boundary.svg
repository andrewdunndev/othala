<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" class="dg" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<title>The trust boundary: what the network can actually reach</title>
<style>
.dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}
@media (prefers-color-scheme:dark){.dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}:root[data-theme="light"] .dg{--paper:#ffffff;--panel:#f4f4f4;--edge:#e0e0e0;--edge2:#b0b0b0;--ink:#0a0a0a;--ink2:#404040;--mut:#707070;--acc:#4a6741;--no:#a8443a;--yes:#4a7a4a}}
:root[data-theme="dark"] .dg{--paper:#1c1c1e;--panel:#242426;--edge:#303032;--edge2:#48484a;--ink:#f2f2f7;--ink2:#aeaeb2;--mut:#8e8e93;--acc:#6aaa58;--no:#d4736a;--yes:#7aaa7a}
.dg .p{fill:var(--paper)}.dg .s{fill:var(--panel)}
.dg .e{stroke:var(--edge)}.dg .e2{stroke:var(--edge2)}.dg .as{stroke:var(--acc)}.dg .ms{stroke:var(--mut)}.dg .ns{stroke:var(--no)}
.dg .i{fill:var(--ink)}.dg .i2{fill:var(--ink2)}.dg .m{fill:var(--mut)}.dg .a{fill:var(--acc)}
.dg .n{fill:var(--no)}.dg .y{fill:var(--yes)}
</style>
<defs>
<marker id="tb-arrow-mut" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#707070"/>
</marker>
<marker id="tb-arrow-acc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#4a6741"/>
</marker>
</defs>
<g font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif">
<rect class="p" x="0" y="0" width="720" height="600" fill="#ffffff"/>
<rect class="p e" x="20" y="20" width="680" height="560" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="45" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">TRUST BOUNDARY · WHAT THE NETWORK CAN ACTUALLY REACH</text>
<text class="m" x="680" y="45" text-anchor="end" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">OTHALA</text>
<line class="e" x1="40" y1="56" x2="680" y2="56" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="80" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#707070">THE NETWORK SEES THREE PORTS</text>
<rect class="s e" x="40" y="92" width="130" height="64" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="52" y="112" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">BROWSER</text>
<text class="i2" x="52" y="130" font-size="11" fill="#404040">reaches one</text>
<text class="i2" x="52" y="145" font-size="11" fill="#404040">hostname per app</text>
<rect class="p as" x="200" y="92" width="200" height="64" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="212" y="112" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#4a6741">EDGE PROXY</text>
<text class="i" x="212" y="130" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">one hostname, TLS —</text>
<text class="i" x="212" y="145" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#0a0a0a">routes to three ports</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="170" y1="124" x2="192" y2="124" marker-end="url(#tb-arrow-mut)"/>
</g>
<text class="m" x="120" y="180" text-anchor="middle" font-size="10" fill="#707070">self-service, sessions</text>
<text class="m" x="362" y="180" text-anchor="middle" font-size="10" fill="#707070">public SSR</text>
<text class="m" x="562" y="180" text-anchor="middle" font-size="10" fill="#707070">authorize, token, discovery</text>
<rect class="p as" x="40" y="208" width="640" height="272" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4" stroke-dasharray="5 3"/>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="230" y1="156" x2="127.6" y2="258.4" marker-end="url(#tb-arrow-mut)"/>
<line x1="300" y1="156" x2="358.5" y2="259.4" marker-end="url(#tb-arrow-mut)"/>
<line x1="370" y1="156" x2="587" y2="260" marker-end="url(#tb-arrow-mut)"/>
</g>
<rect class="p" x="48" y="216" width="382" height="20" fill="#ffffff"/>
<text class="a" x="52" y="231" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.1" fill="#4a6741">ONE TRUST DOMAIN · THE ADMIN APIS NEVER LEAVE IT</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="butt" stroke-linejoin="round" fill="none">
<path d="M400,124 H654 Q660,124 660,130 V200" stroke-dasharray="4 3"/>
<line x1="648" y1="200" x2="672" y2="200" stroke-width="2.5"/>
</g>
<rect class="p" x="436" y="114" width="188" height="18" fill="#ffffff"/>
<text class="m" x="530" y="128" text-anchor="middle" font-size="10" fill="#707070">admin API · no route from the edge</text>
<rect class="s e" x="52" y="266" width="144" height="114" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="64" y="286" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">KRATOS</text>
<text class="i2" x="64" y="305" font-size="11" fill="#404040">Self-service login,</text>
<text class="i2" x="64" y="320" font-size="11" fill="#404040">recovery, settings</text>
<rect class="p as" x="262" y="266" width="196" height="114" rx="3" fill="#ffffff" stroke="#4a6741" stroke-width="1.4"/>
<text class="a" x="274" y="286" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#4a6741">THE APP</text>
<text class="i" x="274" y="304" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6" fill="#0a0a0a">PUBLIC SSR</text>
<text class="m" x="274" y="318" font-size="10" fill="#707070">challenge providers, UI</text>
<line class="e" x1="274" y1="328" x2="446" y2="328" stroke="#e0e0e0" stroke-width="1"/>
<text class="a" x="274" y="344" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.6" fill="#4a6741">ADMIN · INTERNAL</text>
<text class="m" x="274" y="358" font-size="10" fill="#707070">admin-bind mux — not</text>
<text class="m" x="274" y="371" font-size="10" fill="#707070">the Astro handler</text>
<rect class="s e" x="524" y="266" width="140" height="114" rx="3" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="536" y="286" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">HYDRA</text>
<text class="i2" x="536" y="305" font-size="11" fill="#404040">OAuth2 / OIDC —</text>
<text class="i2" x="536" y="320" font-size="11" fill="#404040">issues tokens, no UI</text>
<g class="as" stroke="#4a6741" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="262" y1="350" x2="204" y2="350" marker-end="url(#tb-arrow-acc)"/>
<line x1="458" y1="350" x2="516" y2="350" marker-end="url(#tb-arrow-acc)"/>
</g>
<text class="a" x="229" y="342" text-anchor="middle" font-size="10" fill="#4a6741">admin API</text>
<text class="a" x="491" y="342" text-anchor="middle" font-size="10" fill="#4a6741">admin API</text>
<g class="ms" stroke="#707070" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
<line x1="196" y1="380" x2="270.4" y2="412.6" marker-end="url(#tb-arrow-mut)"/>
<line x1="524" y1="380" x2="449.6" y2="412.6" marker-end="url(#tb-arrow-mut)"/>
</g>
<rect class="s e2" x="275" y="400" width="170" height="64" rx="3" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1"/>
<text class="m" x="287" y="419" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#707070">POSTGRES</text>
<text class="i2" x="287" y="437" font-size="11" fill="#404040">separate databases —</text>
<text class="i2" x="287" y="452" font-size="11" fill="#404040">Kratos, Hydra</text>
<line class="e" x1="40" y1="498" x2="680" y2="498" stroke="#e0e0e0" stroke-width="1"/>
<text class="m" x="40" y="518" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#707070">ADMIN-API ISOLATION</text>
<text class="a" x="40" y="540" font-size="13" font-weight="700" fill="#4a6741">Admin APIs are reachable only from the app — never from the edge.</text>
<text class="m" x="40" y="558" font-size="10.5" fill="#707070">Enforced by the Ory config render (fails when the admin bind-address token is unset),</text>
<text class="m" x="40" y="572" font-size="10.5" fill="#707070">requireAdminSession (portal/src/lib/admin.ts), and pinned by d-admin-aal2-stepup.spec.ts + f-aal2-bypass.spec.ts.</text>
</g>
</svg>
