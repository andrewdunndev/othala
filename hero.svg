<svg viewBox="0 0 1200 430" width="1200" height="430" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="othala hero: Ory Kratos + Hydra identity provider for your home — the door (dagaz) to home (othala).">
  <rect x="0" y="0" width="1200" height="430" fill="#f4f4f4"/>
  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <text x="60" y="34" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">OTHALA · ORY · SINGLE-SIGN-ON FOR THE HOME</text>
  <text x="1140" y="34" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">2026</text>
  <line x1="60" y1="48" x2="1140" y2="48" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="138" font-size="72" font-weight="700" fill="#4a6741" letter-spacing="-2">othala</text>
  <text x="60" y="172" font-size="16" font-style="italic" fill="#404040">Ory for your home.</text>
  <text x="60" y="202" font-size="14" fill="#404040">Kratos + Hydra that hold the home's identity.</text>
  <text x="60" y="222" font-size="14" fill="#404040">config-as-code is the main path to an identity change.</text>
  <g transform="translate(110 246)" font-family="IBM Plex Mono, Menlo, monospace">
    <!-- door (dagaz ᛞ) → home (othala ᛟ), geometric runic line-art coherent with mark/ -->
    <!-- dagaz ᛞ : 64-unit glyph scaled 0.66 (≈42u), top-left placed so glyph sits in y≈4..46 -->
    <g transform="translate(0 4.88) scale(0.66)" stroke="#0a0a0a" stroke-width="2.6" stroke-linecap="round" fill="none">
      <line x1="16" y1="14.5" x2="16" y2="49.5"/>
      <line x1="48" y1="14.5" x2="48" y2="49.5"/>
      <line x1="17.9" y1="13.9" x2="30.1" y2="30.1"/>
      <line x1="33.9" y1="33.9" x2="46.1" y2="50.1"/>
      <line x1="17.9" y1="50.1" x2="30.1" y2="33.9"/>
      <line x1="33.9" y1="30.1" x2="46.1" y2="13.9"/>
      <circle cx="16" cy="12" r="2.5" stroke-width="2"/>
      <circle cx="48" cy="12" r="2.5" stroke-width="2"/>
      <circle cx="16" cy="52" r="2.5" stroke-width="2"/>
      <circle cx="48" cy="52" r="2.5" stroke-width="2"/>
      <circle cx="32" cy="32" r="2" stroke-width="2"/>
    </g>
    <!-- geometric arrow -->
    <g stroke="#707070" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="48" y1="25" x2="74" y2="25"/>
      <polyline points="68,20 74,25 68,30"/>
    </g>
    <!-- othala ᛟ : same idiom as mark/mark.svg, scaled 0.66 -->
    <g transform="translate(82 4.88) scale(0.66)" stroke="#0a0a0a" stroke-width="2.6" stroke-linecap="round" fill="none">
      <line x1="33.8" y1="9.8" x2="46.2" y2="22.2"/>
      <line x1="46.2" y1="25.8" x2="33.8" y2="38.2"/>
      <line x1="30.2" y1="38.2" x2="17.8" y2="25.8"/>
      <line x1="17.8" y1="22.2" x2="30.2" y2="9.8"/>
      <line x1="30.4" y1="41.9" x2="19.6" y2="54.1"/>
      <line x1="33.6" y1="41.9" x2="44.4" y2="54.1"/>
      <circle cx="32" cy="8" r="2.5" stroke-width="2"/>
      <circle cx="48" cy="24" r="2.5" stroke-width="2"/>
      <circle cx="32" cy="40" r="2.5" stroke-width="2"/>
      <circle cx="16" cy="24" r="2.5" stroke-width="2"/>
      <circle cx="18" cy="56" r="2.5" stroke-width="2"/>
      <circle cx="46" cy="56" r="2.5" stroke-width="2"/>
      <circle cx="32" cy="24" r="2" stroke-width="2"/>
    </g>
    <text x="0" y="60" font-size="9" font-weight="700" fill="#707070" letter-spacing="0.8">DOOR TO HOME</text>
  </g>
  <text x="560" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">FLOW</text>
  <text x="850" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">DISCIPLINE</text>
  <rect x="560" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">IN</text>
  <text x="578" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">configs</text>
  <text x="578" y="178" font-size="11" fill="#404040">kratos.yml, hydra.yml, client manifests in git</text>
  <text x="578" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">AS-CODE · GIT-RESIDENT</text>
  <rect x="850" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">POSTURE</text>
  <text x="868" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">self-hosted</text>
  <text x="868" y="178" font-size="11" fill="#404040">single instance, single household, no SaaS IdP</text>
  <text x="868" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">ONE OPERATOR · ONE INSTANCE</text>
  <rect x="560" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">OUT</text>
  <text x="578" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">idp</text>
  <text x="578" y="318" font-size="11" fill="#404040">OIDC + forward-auth for every consumer in the home</text>
  <text x="578" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">OIDC · FORWARD-AUTH</text>
  <rect x="850" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">LIFETIME</text>
  <text x="868" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">auditable</text>
  <text x="868" y="318" font-size="11" fill="#404040">every grant flows from a committed config</text>
  <text x="868" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">GIT LOG · CONFIG TIMELINE</text>
  <line x1="60" y1="386" x2="1140" y2="386" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="412" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">ORY · KRATOS · HYDRA · OIDC</text>
  <text x="1140" y="412" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">MIT · GITLAB.COM/DUNN.DEV/othala</text>
  </g>
</svg>
