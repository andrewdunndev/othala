# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: bench-sso — authentication flow (passkey-first)
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "Passkey-first authentication with password fallback"
entries:
  # --- Authentication Flow ---
  - model: authentik_flows.flow
    id: auth-flow
    identifiers:
      slug: dunn-authentication
    attrs:
      name: "dunn.dev Authentication"
      title: "Sign in to dunn.dev"
      designation: authentication
      authentication: none

  # --- Stages ---

  # Identification stage — email or username
  - model: authentik_stages_identification.identificationstage
    id: auth-identification
    identifiers:
      name: dunn-authentication-identification
    attrs:
      user_fields:
        - email
        - username
      password_stage: !KeyOf auth-password
      passwordless_flow: !KeyOf passwordless-flow
      webauthn_stage: !KeyOf auth-mfa
      show_matched_user: true
      show_source_labels: true

  # Password stage
  - model: authentik_stages_password.passwordstage
    id: auth-password
    identifiers:
      name: dunn-authentication-password
    attrs:
      backends:
        - authentik.core.auth.InbuiltBackend
        - authentik.core.auth.TokenBackend
      configure_flow: !Find [authentik_flows.flow, [slug, default-password-change]]

  # MFA validation stage — passkeys, TOTP, etc.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: auth-mfa
    identifiers:
      name: dunn-authentication-mfa
    attrs:
      device_classes:
        - webauthn
        - totp
        - static
      not_configured_action: skip
      webauthn_user_verification: preferred

  # Login stage — creates session
  - model: authentik_stages_user_login.userloginstage
    id: auth-login
    identifiers:
      name: dunn-authentication-login
    attrs:
      session_duration: seconds=7776000
      remember_me_offset: seconds=7776000
      network_binding: no_binding
      geoip_binding: no_binding

  # --- Flow Stage Bindings ---
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf auth-flow
      stage: !KeyOf auth-identification
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf auth-flow
      stage: !KeyOf auth-password
      order: 20

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf auth-flow
      stage: !KeyOf auth-mfa
      order: 30

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf auth-flow
      stage: !KeyOf auth-login
      order: 100

  # --- Passwordless Flow (WebAuthn/Passkey) ---
  - model: authentik_flows.flow
    id: passwordless-flow
    identifiers:
      slug: dunn-passwordless
    attrs:
      name: "dunn.dev Passwordless"
      title: "Passkey Sign-in"
      designation: authentication
      authentication: none

  # Passwordless validation stage
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: passwordless-validation
    identifiers:
      name: dunn-passwordless-validation
    attrs:
      device_classes:
        - webauthn
      not_configured_action: deny
      webauthn_user_verification: required

  # Passwordless flow bindings
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passwordless-flow
      stage: !KeyOf passwordless-validation
      order: 10

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passwordless-flow
      stage: !KeyOf auth-login
      order: 100
