# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: bench-sso — Audiobookshelf (listen) OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-listen
    identifiers:
      name: listen-audiobookshelf
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_type: confidential
      client_id: bench-listen
      client_secret: bench-listen-secret
      redirect_uris: |
        https://listen.test.dunn.dev/auth/openid/callback
        https://listen.test.dunn.dev/auth/openid/mobile-redirect
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, dunn.dev/scope-email-verified]]

  - model: authentik_core.application
    id: app-listen
    identifiers:
      slug: listen
    attrs:
      name: Audiobookshelf
      provider: !KeyOf provider-listen
      group: "Services"
      policy_engine_mode: any
      meta_launch_url: https://listen.test.dunn.dev/

  - model: authentik_policies_expression.expressionpolicy
    id: policy-listen
    identifiers:
      name: bench-access-listen
    attrs:
      expression: |
        return ak_is_group_member(request.user, name="access-listen")

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-listen
      order: 0
    attrs:
      policy: !KeyOf policy-listen
      enabled: true
      negate: false
