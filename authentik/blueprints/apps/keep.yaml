# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: bench-sso — Vaultwarden (keep) OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-keep
    identifiers:
      name: keep-vaultwarden
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_type: confidential
      client_id: bench-keep
      client_secret: bench-keep-secret
      redirect_uris: |
        https://keep.test.dunn.dev/identity/connect/oidc-signin
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, dunn.dev/scope-email-verified]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, dunn.dev/scope-offline-access]]

  - model: authentik_core.application
    id: app-keep
    identifiers:
      slug: keep
    attrs:
      name: Vaultwarden
      provider: !KeyOf provider-keep
      group: "Services"
      policy_engine_mode: any
      meta_launch_url: https://keep.test.dunn.dev/

  - model: authentik_policies_expression.expressionpolicy
    id: policy-keep
    identifiers:
      name: bench-access-keep
    attrs:
      expression: |
        return ak_is_group_member(request.user, name="access-keep")

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-keep
      order: 0
    attrs:
      policy: !KeyOf policy-keep
      enabled: true
      negate: false
