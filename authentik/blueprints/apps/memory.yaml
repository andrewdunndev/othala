# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: bench-sso — Immich (memory) OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-memory
    identifiers:
      name: memory-immich
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_type: confidential
      client_id: bench-memory
      client_secret: bench-memory-secret
      redirect_uris: |
        https://memory.test.dunn.dev/auth/login
        https://memory.test.dunn.dev/user-settings
        app.immich:///oauth-callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, dunn.dev/scope-email-verified]]

  - model: authentik_core.application
    id: app-memory
    identifiers:
      slug: memory
    attrs:
      name: Immich
      provider: !KeyOf provider-memory
      group: "Services"
      policy_engine_mode: any
      meta_launch_url: https://memory.test.dunn.dev/

  - model: authentik_policies_expression.expressionpolicy
    id: policy-memory
    identifiers:
      name: bench-access-memory
    attrs:
      expression: |
        return ak_is_group_member(request.user, name="access-memory")

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-memory
      order: 0
    attrs:
      policy: !KeyOf policy-memory
      enabled: true
      negate: false
