# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: bench-sso — Navidrome (tune) forward auth
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: provider-tune
    identifiers:
      name: tune-navidrome-proxy
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      mode: forward_single
      external_host: https://tune.test.dunn.dev

  - model: authentik_core.application
    id: app-tune
    identifiers:
      slug: tune
    attrs:
      name: Navidrome
      provider: !KeyOf provider-tune
      group: "Services"
      policy_engine_mode: any
      meta_launch_url: https://tune.test.dunn.dev/

  - model: authentik_policies_expression.expressionpolicy
    id: policy-tune
    identifiers:
      name: bench-access-tune
    attrs:
      expression: |
        return ak_is_group_member(request.user, name="access-tune")

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-tune
      order: 0
    attrs:
      policy: !KeyOf policy-tune
      enabled: true
      negate: false
