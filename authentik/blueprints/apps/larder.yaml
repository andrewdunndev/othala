# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: bench-sso — Mealie (larder) OIDC
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-larder
    identifiers:
      name: larder-mealie
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      client_type: confidential
      client_id: bench-larder
      client_secret: bench-larder-secret
      redirect_uris: |
        https://larder.test.dunn.dev/login
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, dunn.dev/scope-email-verified]]

  - model: authentik_core.application
    id: app-larder
    identifiers:
      slug: larder
    attrs:
      name: Mealie
      provider: !KeyOf provider-larder
      group: "Services"
      policy_engine_mode: any
      meta_launch_url: https://larder.test.dunn.dev/

  - model: authentik_policies_expression.expressionpolicy
    id: policy-larder
    identifiers:
      name: bench-access-larder
    attrs:
      expression: |
        return ak_is_group_member(request.user, name="access-larder")

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-larder
      order: 0
    attrs:
      policy: !KeyOf policy-larder
      enabled: true
      negate: false
