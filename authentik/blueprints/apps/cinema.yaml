# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: bench-sso — Jellyfin (cinema) LDAP
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_ldap.ldapprovider
    id: provider-cinema
    identifiers:
      name: cinema-jellyfin-ldap
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      base_dn: "dc=dunn,dc=dev"
      search_group: !Find [authentik_core.group, [name, access-cinema]]
      mfa_support: false

  - model: authentik_core.application
    id: app-cinema
    identifiers:
      slug: cinema
    attrs:
      name: Jellyfin
      provider: !KeyOf provider-cinema
      group: "Services"
      policy_engine_mode: any
      meta_launch_url: https://cinema.test.dunn.dev/

  - model: authentik_policies_expression.expressionpolicy
    id: policy-cinema
    identifiers:
      name: bench-access-cinema
    attrs:
      expression: |
        return ak_is_group_member(request.user, name="access-cinema")

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-cinema
      order: 0
    attrs:
      policy: !KeyOf policy-cinema
      enabled: true
      negate: false

  # LDAP Outpost — uses embedded outpost (Authentik 2026.2 supports this)
  # The outpost listens on port 3389 (LDAP) and 6636 (LDAPS) inside the
  # authentik-server container. We expose these in docker-compose.
  - model: authentik_outposts.outpost
    id: outpost-ldap
    identifiers:
      name: cinema-ldap-outpost
    attrs:
      type: ldap
      providers:
        - !KeyOf provider-cinema
      config:
        authentik_host: http://authentik-server:9000
        log_level: info
