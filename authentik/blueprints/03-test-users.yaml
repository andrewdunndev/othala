# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: bench-sso — test users
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "Test users for SSO validation bench"
entries:
  # --- Admin users ---
  - model: authentik_core.user
    id: user-andrew
    identifiers:
      username: andrew.dunn
    state: created
    attrs:
      name: "Andrew Dunn"
      email: andrew@dunn.dev
      is_active: true
      path: users
      groups:
        - !Find [authentik_core.group, [name, admin]]
        - !Find [authentik_core.group, [name, access-keep]]
        - !Find [authentik_core.group, [name, access-larder]]
        - !Find [authentik_core.group, [name, access-listen]]
        - !Find [authentik_core.group, [name, access-cinema]]
        - !Find [authentik_core.group, [name, access-tune]]
        - !Find [authentik_core.group, [name, access-memory]]

  - model: authentik_core.user
    id: user-jane
    identifiers:
      username: jane.dunn
    state: created
    attrs:
      name: "Jane Dunn"
      email: jane@dunn.dev
      is_active: true
      path: users
      groups:
        - !Find [authentik_core.group, [name, admin]]
        - !Find [authentik_core.group, [name, access-keep]]
        - !Find [authentik_core.group, [name, access-larder]]
        - !Find [authentik_core.group, [name, access-listen]]
        - !Find [authentik_core.group, [name, access-cinema]]
        - !Find [authentik_core.group, [name, access-tune]]
        - !Find [authentik_core.group, [name, access-memory]]

  # --- Family test user (limited access) ---
  - model: authentik_core.user
    id: user-family
    identifiers:
      username: test.family
    state: created
    attrs:
      name: "Test Family"
      email: family@test.dunn.dev
      is_active: true
      path: users
      groups:
        - !Find [authentik_core.group, [name, family]]
        - !Find [authentik_core.group, [name, access-listen]]
        - !Find [authentik_core.group, [name, access-cinema]]

  # --- LDAP service account ---
  # Authentik's LDAP outpost requires authenticated bind. This account
  # is used by Jellyfin to search the directory for user entries.
  - model: authentik_core.user
    id: user-ldapservice
    identifiers:
      username: ldapservice
    state: created
    attrs:
      name: "LDAP Service Account"
      email: ldap@test.dunn.dev
      is_active: true
      path: users
      type: service_account
      groups:
        - !Find [authentik_core.group, [name, access-cinema]]

  # --- Friend test user (most limited) ---
  - model: authentik_core.user
    id: user-friend
    identifiers:
      username: test.friend
    state: created
    attrs:
      name: "Test Friend"
      email: friend@test.dunn.dev
      is_active: true
      path: users
      groups:
        - !Find [authentik_core.group, [name, friends]]
        - !Find [authentik_core.group, [name, access-listen]]
