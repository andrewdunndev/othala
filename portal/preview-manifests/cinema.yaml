# Jellyfin — cinema.dunn.dev
# Unified-manifest prototype (preview route only; NOT a production manifest).
# Shape: presentation: + oidc: (from hydra/clients/cinema.yaml)

presentation:
  name: Cinema
  description: Movie + TV library with multi-user profiles and offline downloads.
  url: https://cinema.dunn.dev
  icon: MV
  icon_slug: jellyfin
  auth_kind: oidc+ldap
  access_group: access-cinema
  order: 40

oidc:
  client_id: cinema
  client_name: Jellyfin
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://cinema.dunn.dev/sso/OID/redirect/dunn
  post_logout_redirect_uris:
    - https://cinema.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://cinema.dunn.dev
  skip_consent: true
