# Audiobookshelf — listen.dunn.dev
# Unified-manifest prototype (preview route only; NOT a production manifest).
# Shape: presentation: + oidc: (from hydra/clients/listen.yaml)

presentation:
  name: Listen
  description: Audiobook + podcast library. Cross-device progress sync.
  url: https://listen.dunn.dev
  icon: AB
  icon_slug: audiobookshelf
  auth_kind: oidc
  access_group: access-listen
  order: 30

oidc:
  client_id: listen
  client_name: Audiobookshelf
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://listen.dunn.dev/auth/openid/callback
    - https://listen.dunn.dev/auth/openid/mobile-redirect
  post_logout_redirect_uris:
    - https://listen.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://listen.dunn.dev
  skip_consent: true
  backchannel_logout_uri: https://listen.dunn.dev/auth/openid/logout
