# Vaultwarden — keep.dunn.dev
# Unified-manifest prototype (preview route only; NOT a production manifest).
# Shape: presentation: + oidc: (from hydra/clients/keep.yaml)

presentation:
  name: Keep
  description: "Family password vault. End-to-end encrypted; SSO controls account access, master password unlocks the vault."
  url: https://keep.dunn.dev
  icon: KP
  icon_slug: vaultwarden
  auth_kind: oidc
  access_group: access-keep
  order: 10

oidc:
  client_id: keep
  client_name: Vaultwarden
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://keep.dunn.dev/identity/connect/oidc-signin
  post_logout_redirect_uris:
    - https://keep.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://keep.dunn.dev
  skip_consent: true
  backchannel_logout_uri: https://keep.dunn.dev/identity/connect/oidc-logout
