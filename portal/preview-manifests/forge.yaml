# GitLab — forge.dunn.dev
# Unified-manifest prototype (preview route only; NOT a production manifest).
# Shape: presentation: + oidc: (from hydra/clients/forge.yaml)

presentation:
  name: Forge
  description: Self-hosted GitLab for the dunn.dev estate's source code and CI.
  url: https://forge.dunn.dev
  icon: FG
  icon_slug: gitlab
  auth_kind: oidc
  access_group: access-forge
  order: 100

oidc:
  client_id: forge
  client_name: GitLab
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://forge.dunn.dev/users/auth/openid_connect/callback
  post_logout_redirect_uris:
    - https://forge.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://forge.dunn.dev
  skip_consent: true
  backchannel_logout_uri: https://forge.dunn.dev/users/auth/openid_connect/logout
