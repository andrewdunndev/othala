<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dagaz: two staves + crossing X. Line ends sit at (ring radius + cap
       radius) from each vertex (2.75 at corners r2.5, 2.25 at center r2) so
       the round cap tips land on the rings' inner edges — no penetration. -->
  <line x1="18" y1="12.75" x2="18" y2="51.25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="12.75" x2="46" y2="51.25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="19.48" y1="12.32" x2="30.79" y2="30.10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="33.21" y1="33.90" x2="44.52" y2="51.68" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="44.52" y1="12.32" x2="33.21" y2="30.10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="30.79" y1="33.90" x2="19.48" y2="51.68" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="46" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="18" cy="54" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="46" cy="54" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
</svg>
