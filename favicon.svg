<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="othala rune: home and inheritance — the estate.">
  <!-- The ᛟ othala rune (home / inheritance), the destination of the
       ᛞ→ᛟ "door to home" motif. Hardcoded accent moss #4a6741 so the
       favicon reads green in browser chrome regardless of inherited
       document color (matches the estate favicon convention). -->
  <g stroke="#4a6741" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- diamond enclosure -->
    <path d="M32 8 L48 24 L32 40 L16 24 Z"/>
    <!-- two diverging legs from the base -->
    <line x1="32" y1="40" x2="18" y2="56"/>
    <line x1="32" y1="40" x2="46" y2="56"/>
  </g>
</svg>
