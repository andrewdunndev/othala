# Kratos configuration — dunn.dev family SSO
#
# All locked decisions from docs/decision.md and docs/STATUS.md applied.
# Version-pinned in compose; this config targets v1.x current at time of build.

# DSN host is env-substituted so the same file lands in both
# topologies. Lab compose sets KRATOS_PG_HOST=postgres (compose service
# name); iac quadlets set KRATOS_PG_HOST=auth-postgres (container name
# on the auth.network). Same applies to KRATOS_ADMIN_HOST and
# CONSENT_HOST below.
dsn: postgres://kratos:${KRATOS_PG_PASS}@${KRATOS_PG_HOST}:5432/kratos?sslmode=disable

serve:
  public:
    base_url: https://dag.dunn.dev/
    port: 4433
    cors:
      enabled: true
      allowed_origins:
        - https://dag.dunn.dev
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers:
        - Authorization
        - Content-Type
        - X-Session-Token
        - Cookie
        - X-CSRF-Token
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true
      max_age: 0

  admin:
    base_url: http://${KRATOS_ADMIN_HOST}:4434/
    port: 4434

selfservice:
  # LOW-3: trailing slash is load-bearing. Kratos allowed_return_urls
  # uses a prefix match; without the slash, "https://dag.dunn.dev"
  # accepts "https://dag.dunn.dev.evil.example". Every entry MUST
  # end in `/` (or a deeper path). Same in lab/compose/kratos.lab.yml.
  default_browser_return_url: https://dag.dunn.dev/
  allowed_return_urls:
    - https://dag.dunn.dev/

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: true
        max_breaches: 1
        identifier_similarity_check_enabled: true
        min_password_length: 12

    webauthn:
      enabled: true
      config:
        # passwordless: passkey is primary auth, password is fallback
        passwordless: true
        rp:
          # CRITICAL one-way decision: registrable parent so passkeys assertable
          # from any *.dunn.dev origin. Changing this invalidates every passkey.
          id: dunn.dev
          display_name: Dunn Family
          origins:
            - https://dag.dunn.dev

    totp:
      enabled: true
      config:
        issuer: Dunn Family

    # Code strategy for recovery (magic link is deprecated in current Kratos)
    code:
      enabled: true
      passwordless_enabled: false

    # We don't use these but enable explicitly to document the choice
    profile:
      enabled: true

    link:
      # Magic link recovery is deprecated; use 'code' method above
      enabled: false

    lookup_secret:
      enabled: true

  flows:
    error:
      ui_url: https://dag.dunn.dev/auth/error

    settings:
      ui_url: https://dag.dunn.dev/auth/settings
      privileged_session_max_age: 15m
      # AAL not enforced here globally; admin UI does AAL2 step-up at SSR layer
      required_aal: aal1
      after:
        password:
          hooks:
            - hook: revoke_active_sessions
        webauthn:
          hooks:
            - hook: revoke_active_sessions

    recovery:
      enabled: true
      use: code
      ui_url: https://dag.dunn.dev/auth/recovery
      lifespan: 1h
      notify_unknown_recipients: false
      # H1 / D3: admin email-recovery is disabled at the application
      # layer. Kratos calls the recovery-gate webhook before issuing the
      # privileged settings session; the gate replies 403 if the
      # identity carries the `admin` group, and 200 otherwise.
      #
      # Non-admin family members continue to use email recovery. Admins
      # recover via console (`kratos identities` on carmine) per
      # docs/runbooks/admin-recovery.md.
      after:
        code:
          hooks:
            - hook: web_hook
              config:
                # MEDIUM-1 listener split: webhook URL points at the
                # admin port (:4478), not the public port (:4477).
                # MEDIUM-2: auth block carries the shared HMAC secret in
                # the X-Webhook-Auth header; consent constant-time
                # compares it before reading the body. The receiver
                # fails closed on missing/wrong secret.
                url: http://${CONSENT_HOST}:4478/webhooks/recovery-gate
                method: POST
                auth:
                  type: api_key
                  config:
                    in: header
                    name: X-Webhook-Auth
                    value: ${RECOVERY_GATE_SECRET}
                response:
                  ignore: false
                  parse: false
                body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
                can_interrupt: true

    verification:
      enabled: true
      use: code
      ui_url: https://dag.dunn.dev/auth/verification
      lifespan: 1h
      after:
        default_browser_return_url: https://dag.dunn.dev/

    logout:
      after:
        default_browser_return_url: https://dag.dunn.dev/

    login:
      ui_url: https://dag.dunn.dev/auth/login
      lifespan: 10m
      # CRITICAL: aal1 base; AAL2 step-up is requested per-flow via ?aal=aal2
      # by the admin SSR pages, not enforced globally here.
      required_aal: aal1

    registration:
      # Admin-driven onboarding (one-time enrollment URLs); no self-service signup
      enabled: false
      ui_url: https://dag.dunn.dev/auth/registration
      lifespan: 1h
      after:
        password:
          hooks:
            - hook: session

session:
  lifespan: 2160h    # 90 days for normal flows; admin UI enforces shorter via SSR
  cookie:
    # Parent domain so dag.dunn.dev (the IdP) and every *.dunn.dev app
    # pod share the same session cookie. SameSite=Lax permits same-site
    # POSTs across subdomains; HIGH-1 CSRF mitigation is per-request
    # tokens in the portal (portal/src/lib/csrf.ts).
    domain: dunn.dev
    name: ory_kratos_session
    persistent: true
    same_site: Lax
  whoami:
    # CRITICAL: aal1 not highest_available. highest_available causes
    # whoami to return session.identity = null for MFA-enabled identities,
    # which breaks the LDAP bridge BIND path. AAL is enforced per-flow,
    # not at whoami.
    required_aal: aal1

cookies:
  domain: dunn.dev
  same_site: Lax

identity:
  default_schema_id: family
  schemas:
    - id: family
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://${SMTP_USER}:${SMTP_PASS}@smtp.fastmail.com:465
    from_address: noreply@dunn.dev
    from_name: Dunn Family
    # local_name: leave default; Fastmail accepts standard HELO

  # Templates default to Kratos built-ins; override later if needed.
  # templates:
  #   recovery_code:
  #     valid:
  #       email:
  #         subject: Your Dunn Family recovery code

secrets:
  # Cookie signing secret. Two slots: the current secret signs new
  # cookies; the previous secret remains valid for verification until the
  # last cookie minted under it expires.
  #
  # Both slots carry distinct values at all times. Kratos rejects an
  # empty list entry (YAML schema violation), so on first provision
  # _PREVIOUS is seeded with a sentinel secret that becomes meaningful
  # on the first rotation.
  #
  # Rotation runbook (docs/runbooks/cookie-rotation.md):
  #   1. Generate a new secret; set KRATOS_COOKIE_SECRET_PREVIOUS to the
  #      current KRATOS_COOKIE_SECRET_CURRENT value.
  #   2. Set KRATOS_COOKIE_SECRET_CURRENT to the new secret.
  #   3. Restart Kratos.
  #   4. Wait for the session lifespan to elapse (90 days default).
  #   5. Mint a fresh sentinel into KRATOS_COOKIE_SECRET_PREVIOUS and
  #      restart again.
  #
  # lab/scripts/gen-secrets.sh seeds both _CURRENT and _PREVIOUS on first
  # provision.
  cookie:
    - ${KRATOS_COOKIE_SECRET_CURRENT}
    - ${KRATOS_COOKIE_SECRET_PREVIOUS}

  # Cipher for at-rest encryption of identity credentials. Same two-slot
  # shape as cookie.
  cipher:
    - ${KRATOS_CIPHER_SECRET_CURRENT}
    - ${KRATOS_CIPHER_SECRET_PREVIOUS}

log:
  level: info
  format: json
  leak_sensitive_values: false

hashers:
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 3
    salt_length: 16
    key_length: 32

ciphers:
  algorithm: xchacha20-poly1305

feature_flags:
  # Account verification flow as a separate UI; we want it.
  cacheable_sessions: false
