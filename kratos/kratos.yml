# Kratos configuration: generic Othala instance template, ${VAR}-substituted by
# scripts/render-config.sh. KRATOS_PG_HOST, KRATOS_ADMIN_HOST and CONSENT_HOST are compose service
# names in the lab and container names in production.

dsn: "postgres://kratos:${KRATOS_PG_PASS}@${KRATOS_PG_HOST}:5432/kratos?sslmode=disable"
# KRATOS_PG_PASS must be URL-safe (percent-encoded): YAML quoting cannot fix a URL.

serve:
  public:
    base_url: "${OTHALA_PUBLIC_URL}/"
    request_log:
      # Probes would write an access-log line every few seconds, burying real ones. Metrics still count them.
      disable_for_health: true

  admin:
    base_url: "http://${KRATOS_ADMIN_HOST}:4434/"
    # Admin-plane bind address. The admin API is unauthenticated by design (the network is the
    # control): segmented deployments bind an admin-plane address, the e2e harness uses 0.0.0.0.
    host: "${KRATOS_ADMIN_BIND_HOST}"
    request_log:
      # This listener logs before adding the prefix, so probe /admin/health/ready here.
      disable_for_health: true

selfservice:
  # Kratos matches an entry by exact scheme, path PREFIX, and exact host unless the host starts
  # with `*` (suffix match). The `.` in `*.` is load-bearing (`*apex.tld` would match the
  # registrable `evilapex.tld`); every entry ends in `/` so `/app` cannot admit `/apple`. The apex
  # wildcard is as wide as the session cookie's domain below, so it admits no host that is not
  # already handed the session; widening it would be an open redirect. https only.
  default_browser_return_url: "${OTHALA_PUBLIC_URL}/"
  allowed_return_urls:
    - "${OTHALA_PUBLIC_URL}/"
    - "https://*.${OTHALA_APEX}/"

  methods:
    password:
      config:
        # Unquoted: the schema types these as bool/int, and a quoted token renders to a string.
        haveibeenpwned_enabled: ${OTHALA_HIBP_ENABLED}
        ignore_network_errors: false
        min_password_length: ${OTHALA_PASSWORD_MIN_LENGTH}

    # Passkeys: the PRIMARY login method (discoverable credentials, usernameless), distinct from
    # the legacy webauthn strategy below.
    passkey:
      enabled: true
      config:
        rp:
          # CRITICAL one-way decision: the registrable parent, so passkeys work from any subdomain
          # origin. Changing it invalidates every enrolled passkey (shared with the webauthn RP below).
          id: "${OTHALA_APEX}"
          display_name: "${OTHALA_INSTANCE_NAME}"
          origins:
            - "${OTHALA_PUBLIC_URL}"

    # WebAuthn (legacy): second factor / security key only; passkey owns passwordless.
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          id: "${OTHALA_APEX}"
          display_name: "${OTHALA_INSTANCE_NAME}"
          origins:
            - "${OTHALA_PUBLIC_URL}"

    totp:
      enabled: true
      config:
        issuer: "${OTHALA_INSTANCE_NAME}"

    # Code strategy: recovery AND passwordless email-OTP login (fallback for a device without a
    # passkey). max_submissions: 5 bounds brute force of the 6-digit code; lifespan: 15m is the
    # per-method validity, distinct from the login flow lifespan.
    code:
      enabled: true
      passwordless_enabled: true
      config:
        max_submissions: 5
        lifespan: 15m

    lookup_secret:
      enabled: true

  flows:
    error:
      ui_url: "${OTHALA_PUBLIC_URL}/auth/error"

    settings:
      ui_url: "${OTHALA_PUBLIC_URL}/auth/settings"
      privileged_session_max_age: 5m
      # Require the highest available AAL before credential changes, so a stolen AAL1 session
      # cannot swap the second factor. AAL1-only identities and first-passkey enrollment are
      # unaffected. This does NOT touch session.whoami, which must stay aal1 (forward-auth.ts).
      required_aal: highest_available
      after:
        password:
          hooks:
            - hook: revoke_active_sessions
        passkey:
          hooks:
            - hook: revoke_active_sessions
        # An admin keeps a second factor: this interrupting hook refuses a change that could leave
        # no authenticator app and no security key.
        webauthn:
          hooks:
            - hook: revoke_active_sessions
            - hook: web_hook
              config:
                url: "http://${CONSENT_HOST}:4431/admin/second-factor-gate?method=webauthn"
                method: POST
                auth:
                  type: api_key
                  config:
                    in: header
                    name: Authorization
                    value: "Bearer ${RECOVERY_GATE_SECRET}"
                response:
                  ignore: false
                  parse: false
                body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
                can_interrupt: true
        # Revoke on change: a swapped TOTP seed or rotated backup codes is a re-entry path through
        # any other surviving session.
        totp:
          hooks:
            - hook: revoke_active_sessions
            - hook: web_hook
              config:
                url: "http://${CONSENT_HOST}:4431/admin/second-factor-gate?method=totp"
                method: POST
                auth:
                  type: api_key
                  config:
                    in: header
                    name: Authorization
                    value: "Bearer ${RECOVERY_GATE_SECRET}"
                response:
                  ignore: false
                  parse: false
                body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
                can_interrupt: true
        lookup_secret:
          hooks:
            - hook: revoke_active_sessions
        # Username is admin-controlled: an interrupting hook refuses any username other than the
        # stored one. The schema allows no revoke_active_sessions here, so a second non-interrupting
        # hook ends the account's other sessions, keeping the one that saved. An account with a passkey
        # or password changes its email addresses only from a session whose newest sign-in used one; an
        # emailed code proves the mailbox, not the person.
        profile:
          hooks:
            - hook: web_hook
              config:
                url: "http://${CONSENT_HOST}:4431/admin/profile-gate"
                method: POST
                auth:
                  type: api_key
                  config:
                    in: header
                    name: Authorization
                    value: "Bearer ${RECOVERY_GATE_SECRET}"
                response:
                  ignore: false
                  parse: false
                body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
                can_interrupt: true
            - hook: web_hook
              config:
                url: "http://${CONSENT_HOST}:4431/admin/profile-sessions"
                method: POST
                auth:
                  type: api_key
                  config:
                    in: header
                    name: Authorization
                    value: "Bearer ${RECOVERY_GATE_SECRET}"
                response:
                  ignore: false
                  parse: false
                body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
                can_interrupt: false

    recovery:
      enabled: true
      ui_url: "${OTHALA_PUBLIC_URL}/auth/recovery"
      notify_unknown_recipients: false
      # Admin email-recovery is refused by the recovery-gate webhook before the privileged settings
      # session is issued; admins recover via console (docs/runbooks/admin-recovery.md).
      after:
        # v26.2.0: recovery after-hooks sit directly under `after.hooks`; a `code:` wrapper fails validation.
        hooks:
          - hook: web_hook
            config:
              # Webhook to the loopback admin port (:4431, host CONSENT_HOST), not the public port.
              # The app constant-time compares the bearer and fails closed on a missing or wrong secret.
              url: "http://${CONSENT_HOST}:4431/admin/recovery-gate"
              method: POST
              auth:
                # Kratos webhooks support only api_key | basic_auth: api_key with header
                # Authorization and a `Bearer <secret>` value yields the header the app parses.
                type: api_key
                config:
                  in: header
                  name: Authorization
                  value: "Bearer ${RECOVERY_GATE_SECRET}"
              response:
                ignore: false
                parse: false
              body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
              can_interrupt: true

    verification:
      enabled: true
      ui_url: "${OTHALA_PUBLIC_URL}/auth/verification"
      after:
        default_browser_return_url: "${OTHALA_PUBLIC_URL}/"

    logout:
      after:
        default_browser_return_url: "${OTHALA_PUBLIC_URL}/"

    login:
      ui_url: "${OTHALA_PUBLIC_URL}/auth/login"
      # aal1 base: the login flow takes no required_aal. AAL2 step-up is requested per flow by
      # requireAdminSession (admin.ts); a global AAL2 would lock out identities with no second factor.
      after:
        # Admin accounts never get a session from an emailed code: the gate refuses an admin-marked
        # identity (same endpoint, secret and body as the recovery gate above). Per-method hooks
        # replace global login hooks; none are defined.
        code:
          hooks:
            - hook: web_hook
              config:
                url: "http://${CONSENT_HOST}:4431/admin/login-code-gate"
                method: POST
                auth:
                  type: api_key
                  config:
                    in: header
                    name: Authorization
                    value: "Bearer ${RECOVERY_GATE_SECRET}"
                response:
                  ignore: false
                  parse: false
                body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
                can_interrupt: true

    registration:
      # Admin-driven onboarding (one-time enrollment URLs); no self-service signup
      enabled: false
      ui_url: "${OTHALA_PUBLIC_URL}/auth/registration"

session:
  # 720h is the blast-radius knob: the cookie is apex-scoped, so a stolen one is good on every
  # subdomain until it expires. Admin freshness is enforced portal-side (requireAdminSession).
  lifespan: 720h
  cookie:
    # Apex domain so the IdP and every subdomain app share the session cookie. SameSite=Lax permits
    # same-site POSTs; CSRF mitigation is per-request tokens in the portal (csrf.ts).
    domain: "${OTHALA_APEX}"
  whoami:
    # CRITICAL: aal1, not highest_available, which makes whoami return session.identity = null for
    # MFA identities and forward-auth.ts would 401 them. AAL is enforced per flow.
    required_aal: aal1

cookies:
  domain: "${OTHALA_APEX}"

identity:
  default_schema_id: family
  schemas:
    - id: family
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    # Single courier connection, shared with the portal contact-form mailer
    # (OTHALA_SMTP_CONNECTION_URI): one URI, one outbound path.
    connection_uri: "${OTHALA_SMTP_CONNECTION_URI}"
    from_address: "noreply@${OTHALA_APEX}"
    from_name: "${OTHALA_INSTANCE_NAME}"
    # local_name: leave default; Fastmail accepts standard HELO


secrets:
  # Cookie signing + at-rest cipher secrets. The first entry signs/encrypts; older ones still
  # verify. v26.2.0 enforces uniqueItems, so one active secret is a SINGLE-element array.
  # Rotation (docs/runbooks/cookie-rotation.md): prepend the new secret as a distinct first entry,
  # restart, then after the session lifespan drop the old entry and restart again.
  cookie:
    - "${KRATOS_COOKIE_SECRET_CURRENT}"

  cipher:
    - "${KRATOS_CIPHER_SECRET_CURRENT}"

log:
  format: json

# Tracing (OpenTelemetry), opt-in: the block below is OMITTED when OTHALA_OTLP_PROVIDER is empty
# (Ory v26.2.0 rejects a present block with provider "") and emitted when it is "otel".
# OTLP is HTTP/protobuf only, Ory ignores OTEL_* env vars, insecure: true is
# plaintext to the firewall-scoped host alloy receiver, sampling_ratio 0.1 bounds volume.
#@if OTHALA_OTLP_PROVIDER
tracing:
  service_name: kratos
  deployment_environment: ${OTHALA_OTLP_ENVIRONMENT}
  provider: ${OTHALA_OTLP_PROVIDER}     # "otel" when enabled (deploy)
  providers:
    otlp:
      server_url: ${OTHALA_OTLP_ENDPOINT}   # host:port, HTTP — host alloy OTLP receiver
      insecure: true                         # plaintext to the host alloy receiver
      sampling:
        sampling_ratio: 0.1
#@endif

hashers:
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 3
    salt_length: 16
    key_length: 32

ciphers:
  algorithm: xchacha20-poly1305
