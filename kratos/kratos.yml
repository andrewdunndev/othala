# Kratos configuration — dunn.dev family SSO
#
# All locked decisions from docs/decision.md and docs/STATUS.md applied.
# Version-pinned in compose; this config targets v1.x current at time of build.

# DSN host is env-substituted so the same file lands in both
# topologies. Lab compose sets KRATOS_PG_HOST=postgres (compose service
# name); iac quadlets set KRATOS_PG_HOST=auth-postgres (container name
# on the auth.network). Same applies to KRATOS_ADMIN_HOST and
# CONSENT_HOST below.
dsn: postgres://kratos:${KRATOS_PG_PASS}@${KRATOS_PG_HOST}:5432/kratos?sslmode=disable

serve:
  public:
    base_url: ${OTHALA_PUBLIC_URL}/
    port: 4433
    cors:
      enabled: true
      allowed_origins:
        - ${OTHALA_PUBLIC_URL}
      allowed_methods: [GET, POST, PUT, PATCH, DELETE]
      allowed_headers:
        - Authorization
        - Content-Type
        - X-Session-Token
        - Cookie
        - X-CSRF-Token
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true
      max_age: 0

  admin:
    base_url: http://${KRATOS_ADMIN_HOST}:4434/
    # Admin-plane bind address. The admin API is unauthenticated by design
    # (Ory's model: the network IS the control), so segmented deployments
    # bind it to an address only the admin-plane network can reach.
    # Single-network deployments (the e2e harness) use 0.0.0.0.
    host: ${KRATOS_ADMIN_BIND_HOST}
    port: 4434

selfservice:
  # LOW-3: trailing slash is load-bearing. Kratos allowed_return_urls
  # uses a prefix match; without the slash, ${OTHALA_PUBLIC_URL} would
  # accept a prefixed evil cousin host. Every entry MUST end in `/` (or
  # a deeper path).
  default_browser_return_url: ${OTHALA_PUBLIC_URL}/
  allowed_return_urls:
    - ${OTHALA_PUBLIC_URL}/

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: ${OTHALA_HIBP_ENABLED}
        max_breaches: 1
        identifier_similarity_check_enabled: true
        min_password_length: ${OTHALA_PASSWORD_MIN_LENGTH}

    # Passkeys — the PRIMARY login method. This is Kratos's dedicated `passkey`
    # strategy (discoverable credentials + conditional UI), which gives the
    # usernameless one-tap experience: a family member taps "Sign in with
    # passkey" and is in, no username typed. This is distinct from the legacy
    # `webauthn` strategy below — per Ory, use passkey; webauthn is legacy and
    # has limitations in discoverability/conditional UI.
    passkey:
      enabled: true
      config:
        rp:
          # CRITICAL one-way decision: registrable parent so passkeys are
          # assertable from any *.dunn.dev origin. Changing this id invalidates
          # every enrolled passkey. (Shared with the webauthn RP below.)
          id: ${OTHALA_WEBAUTHN_RP_ID}
          display_name: ${OTHALA_INSTANCE_NAME}
          origins:
            - ${OTHALA_WEBAUTHN_RP_ORIGINS}

    # WebAuthn (legacy strategy) — DEMOTED to a second-factor / hardware-
    # security-key option only (passwordless: false). Passkeys (above) own the
    # passwordless primary path; keeping webauthn passwordless would duplicate
    # the login button. Retained (not disabled) so a hardware key can serve as
    # an AAL2 second factor alongside totp/lookup_secret.
    webauthn:
      enabled: true
      config:
        passwordless: false
        rp:
          id: ${OTHALA_WEBAUTHN_RP_ID}
          display_name: ${OTHALA_INSTANCE_NAME}
          origins:
            - ${OTHALA_WEBAUTHN_RP_ORIGINS}

    totp:
      enabled: true
      config:
        issuer: ${OTHALA_INSTANCE_NAME}

    # Code strategy: used for recovery AND as a first-class passwordless login
    # method (email OTP). passwordless_enabled: true makes it available on the
    # login flow so users on new devices / without a passkey can receive a
    # one-time code to sign in. This is the promoted second-tier fallback;
    # it does not weaken security — the code is single-use and expires with
    # the flow lifespan (10m above).
    code:
      enabled: true
      passwordless_enabled: true

    # We don't use these but enable explicitly to document the choice
    profile:
      enabled: true

    link:
      # Magic link recovery is deprecated; use 'code' method above
      enabled: false

    lookup_secret:
      enabled: true

  flows:
    error:
      ui_url: ${OTHALA_PUBLIC_URL}/auth/error

    settings:
      ui_url: ${OTHALA_PUBLIC_URL}/auth/settings
      privileged_session_max_age: 15m
      # AAL not enforced here globally; admin UI does AAL2 step-up at SSR layer
      required_aal: aal1
      after:
        password:
          hooks:
            - hook: revoke_active_sessions
        passkey:
          hooks:
            - hook: revoke_active_sessions
        webauthn:
          hooks:
            - hook: revoke_active_sessions
        # An attacker who swaps a TOTP seed or rotates backup codes gains a
        # re-entry path through any other surviving session. Revoke on change
        # to close that window — mirrors the credential-swap logic above.
        totp:
          hooks:
            - hook: revoke_active_sessions
        lookup_secret:
          hooks:
            - hook: revoke_active_sessions

    recovery:
      enabled: true
      use: code
      ui_url: ${OTHALA_PUBLIC_URL}/auth/recovery
      lifespan: 1h
      notify_unknown_recipients: false
      # H1 / D3: admin email-recovery is disabled at the application
      # layer. Kratos calls the recovery-gate webhook before issuing the
      # privileged settings session; the gate replies 403 if the
      # identity carries the `admin` group, and 200 otherwise.
      #
      # Non-admin family members continue to use email recovery. Admins
      # recover via console (`kratos identities` on carmine) per
      # docs/runbooks/admin-recovery.md.
      after:
        # v26.2.0: recovery after-hooks live directly under `after.hooks`. The
        # `selfServiceAfterRecovery` schema has NO per-method `code:` sub-key
        # (that method nesting is valid for login/registration `after`, not
        # recovery) — a `code:` wrapper here fails config validation at startup.
        hooks:
          - hook: web_hook
            config:
              # MEDIUM-1 listener split: webhook URL points at the
              # admin port (:4431), not the public SSR port (:8080).
              # The admin listener binds on loopback (127.0.0.1) inside
              # the container; within the compose/pod network the host
              # is CONSENT_HOST (= othala). MEDIUM-2: auth block carries
              # the shared bearer secret; the app's handleRecoveryGate
              # constant-time compares Authorization: Bearer before
              # reading the body. Fails closed on missing/wrong secret.
              # 4431 = portal code default (listen.mjs:40) + deployed
              # quadlet; single admin-port convention across envs.
              url: http://${CONSENT_HOST}:4431/admin/recovery-gate
              method: POST
              auth:
                # Kratos webhooks support only api_key | basic_auth (NO `bearer`
                # type). Use api_key with header name `Authorization` and a
                # `Bearer <secret>` value — valid Kratos config that ALSO produces
                # the exact `Authorization: Bearer …` header the app's
                # handleRecoveryGate (parseBearer) expects. Satisfies both sides.
                type: api_key
                config:
                  in: header
                  name: Authorization
                  value: "Bearer ${RECOVERY_GATE_SECRET}"
              response:
                ignore: false
                parse: false
              body: file:///etc/config/kratos/hooks/recovery-gate.jsonnet
              can_interrupt: true

    verification:
      enabled: true
      use: code
      ui_url: ${OTHALA_PUBLIC_URL}/auth/verification
      lifespan: 1h
      after:
        default_browser_return_url: ${OTHALA_PUBLIC_URL}/

    logout:
      after:
        default_browser_return_url: ${OTHALA_PUBLIC_URL}/

    login:
      ui_url: ${OTHALA_PUBLIC_URL}/auth/login
      lifespan: 10m
      # aal1 base — the v26.2.0 login flow takes NO `required_aal` property
      # (it's a `settings`/`session` knob, not a login-flow one). AAL2 step-up
      # is requested per-flow via ?aal=aal2 by the admin SSR pages
      # (requireAdminSession), never enforced globally here.

    registration:
      # Admin-driven onboarding (one-time enrollment URLs); no self-service signup
      enabled: false
      ui_url: ${OTHALA_PUBLIC_URL}/auth/registration
      lifespan: 1h
      after:
        password:
          hooks:
            - hook: session

session:
  lifespan: 2160h    # 90 days for normal flows; admin UI enforces shorter via SSR
  cookie:
    # Parent apex domain so the IdP and every subdomain app share the
    # same session cookie. SameSite=Lax permits same-site POSTs across
    # subdomains; HIGH-1 CSRF mitigation is per-request tokens in the
    # portal (portal/src/lib/csrf.ts).
    domain: ${OTHALA_APEX}
    name: ory_kratos_session
    persistent: true
    same_site: Lax
  whoami:
    # CRITICAL: aal1 not highest_available. highest_available causes
    # whoami to return session.identity = null for MFA-enabled identities,
    # which breaks the LDAP bridge BIND path. AAL is enforced per-flow,
    # not at whoami.
    required_aal: aal1

cookies:
  domain: ${OTHALA_APEX}
  same_site: Lax

identity:
  default_schema_id: family
  schemas:
    - id: family
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    # SINGLE source of truth for the courier connection, shared with the
    # portal's contact-form mailer (portal/src/lib/mailer.ts reads the same
    # OTHALA_SMTP_CONNECTION_URI). One URI, one relay — a dashboard request
    # mail travels the exact same outbound path as a recovery/verification
    # code. gen-secrets.sh / iac default this to the Fastmail implicit-TLS
    # endpoint with the SMTP_USER/SMTP_PASS app-password credentials.
    connection_uri: ${OTHALA_SMTP_CONNECTION_URI}
    from_address: ${OTHALA_SMTP_FROM_ADDRESS}
    from_name: ${OTHALA_INSTANCE_NAME}
    # local_name: leave default; Fastmail accepts standard HELO

  # Templates default to Kratos built-ins; override later if needed.
  # templates:
  #   recovery_code:
  #     valid:
  #       email:
  #         subject: Your ${OTHALA_INSTANCE_NAME} recovery code

secrets:
  # Cookie signing + at-rest cipher secrets. Ory's secrets arrays model
  # rotation via DISTINCT entries (the first signs/encrypts; older entries
  # still verify/decrypt). Kratos v26.2.0 enforces uniqueItems, so a single
  # active secret is a SINGLE-element array — never two identical slots. The
  # collapsed-key deployment (one sops key per slot, golden-path LB#10) is
  # exactly this single-element shape.
  #
  # Rotation runbook (docs/runbooks/cookie-rotation.md):
  #   1. PREPEND the new secret as a distinct first entry (old becomes 2nd):
  #        cookie: [<new>, <current>]
  #   2. Restart Kratos (new signs; old still verifies).
  #   3. After the session lifespan elapses (90 days default), DROP the old
  #      entry — back to a single-element array. Restart again.
  cookie:
    - ${KRATOS_COOKIE_SECRET_CURRENT}

  cipher:
    - ${KRATOS_CIPHER_SECRET_CURRENT}

log:
  level: info
  format: json
  leak_sensitive_values: false

hashers:
  argon2:
    parallelism: 1
    memory: 128MB
    iterations: 3
    salt_length: 16
    key_length: 32

ciphers:
  algorithm: xchacha20-poly1305

feature_flags:
  # Account verification flow as a separate UI; we want it.
  cacheable_sessions: false
