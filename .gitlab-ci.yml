# dunn.dev/auth -- container build + release pipeline.
#
# Four custom images (consent, ldap-bridge, portal, util) build via
# the dunn.dev/pipeline container-image template; caddy lives in the
# separate dunn.dev/caddy-estate repo and auth/caddy/snippets/ are
# volume-mounted at deploy time, not baked into an image here.
#
# util/ ships in v0.1.4 — a one-shot operator container carrying
# apply-clients.sh + curl + jq + yq. iac invokes it via
# `make auth-apply-clients` to register OIDC client manifests against
# the auth.network-internal Hydra admin port.
#
# Per-image release flow on every tag:
#   build       container-image  ->  push :TAG + :latest + cosign sig
#   package     container-sbom   ->  syft scan, upload CycloneDX
#   release     release-create   ->  GitLab Release with SBOM links
#
# Container rebuilds also fire on main + Containerfile change
# (image tagged :short-sha + :latest); release stages are tag-only.

default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

stages:
  - verify
  - build
  - lab-validate
  - package
  - release

include:
  # ----- Verify (push + MR): per-service build clean ---------------
  # Closes the Renovate-MR-without-CI gap. The catalog's go-build and
  # node-build components fire on every push and MR event. go.work at
  # repo root makes the multi-module layout play nicely with
  # `go build ./<dir>`.
  - component: gitlab.com/dunn.dev/pipeline/go-build@2.5.0
    inputs:
      stage: verify
      job_name: verify-consent
      binary_name: consent
      package_path: ./consent

  - component: gitlab.com/dunn.dev/pipeline/go-build@2.5.0
    inputs:
      stage: verify
      job_name: verify-ldap-bridge
      binary_name: ldap-bridge
      package_path: ./ldap-bridge

  - component: gitlab.com/dunn.dev/pipeline/node-build@2.5.0
    inputs:
      stage: verify
      job_name: verify-portal
      package_path: portal


  # ----- consent ---------------------------------------------------
  - component: gitlab.com/dunn.dev/pipeline/container-image@2.5.0
    inputs:
      job_name: build-consent
      image_tag: consent
      containerfile: consent/Containerfile
      context: consent
      tag_pipeline: true

  - component: gitlab.com/dunn.dev/pipeline/container-sbom@2.5.0
    inputs:
      job_name: sbom-consent
      container_image: "${CI_REGISTRY_IMAGE}/consent:${CI_COMMIT_TAG}"
      container_image_job: build-consent
      package_name: auth
      sbom_filename: consent-container.sbom.json

  # ----- ldap-bridge ----------------------------------------------
  - component: gitlab.com/dunn.dev/pipeline/container-image@2.5.0
    inputs:
      job_name: build-ldap-bridge
      image_tag: ldap-bridge
      containerfile: ldap-bridge/Containerfile
      context: ldap-bridge
      tag_pipeline: true

  - component: gitlab.com/dunn.dev/pipeline/container-sbom@2.5.0
    inputs:
      job_name: sbom-ldap-bridge
      container_image: "${CI_REGISTRY_IMAGE}/ldap-bridge:${CI_COMMIT_TAG}"
      container_image_job: build-ldap-bridge
      package_name: auth
      sbom_filename: ldap-bridge-container.sbom.json

  # ----- auth-portal (Astro Node SSR) -----------------------------
  # Context is repo root (legacy from when build needed hydra/clients/;
  # v0.1.4 reads manifests at runtime, but context: . is kept stable
  # because the build is light and changing it requires a CI dance).
  - component: gitlab.com/dunn.dev/pipeline/container-image@2.5.0
    inputs:
      job_name: build-portal
      image_tag: portal
      containerfile: portal/Containerfile
      context: .
      tag_pipeline: true

  - component: gitlab.com/dunn.dev/pipeline/container-sbom@2.5.0
    inputs:
      job_name: sbom-portal
      container_image: "${CI_REGISTRY_IMAGE}/portal:${CI_COMMIT_TAG}"
      container_image_job: build-portal
      package_name: auth
      sbom_filename: portal-container.sbom.json

  # ----- auth-util (one-shot apply-clients runner) ----------------
  # Context is repo root because the build COPYs from util/.
  - component: gitlab.com/dunn.dev/pipeline/container-image@2.5.0
    inputs:
      job_name: build-util
      image_tag: util
      containerfile: util/Containerfile
      context: .
      tag_pipeline: true

  - component: gitlab.com/dunn.dev/pipeline/container-sbom@2.5.0
    inputs:
      job_name: sbom-util
      container_image: "${CI_REGISTRY_IMAGE}/util:${CI_COMMIT_TAG}"
      container_image_job: build-util
      package_name: auth
      sbom_filename: util-container.sbom.json

  # ----- GitLab Release: link SBOMs from all three images -------
  # release-create is binary-shaped (expects binary_job + dist/
  # artifacts). We point binary_job at one container-image build
  # job so the needs: dependency resolves; the dist/ artifact slot
  # stays empty because container builds don't produce one. The
  # value is the GitLab Release record itself plus links to each
  # service's SBOM in the generic package registry.
  - component: gitlab.com/dunn.dev/pipeline/release-create@2.5.0
    inputs:
      package_name: auth
      release_title: "auth $CI_COMMIT_TAG"
      binary_job: build-portal
      sbom_job: sbom-portal


# -----------------------------------------------------------------
# Standalone jobs (not catalog components).
#
# test-portal: v0.1.4 portal test suite. Runs `npm test` which
# invokes node --test against scripts/*.test.mjs. Covers:
#   - manifests-loader.test.mjs (YAML namespace split + parsing)
#   - apps-collection.test.mjs  (Content Collection frontmatter shape)
#   - csrf.test.mjs             (HIGH-1 CSRF token semantics)
#   - admin-recovery-gate.test.mjs (HIGH-3 admin-recovery refusal)
#
# Separate from verify-portal (catalog node-build, which runs
# `npm run build`) because tests gate the change BEFORE the build
# step. Catches Renovate-bumped breakage at the test layer.
# -----------------------------------------------------------------
test-portal:
  stage: verify
  image: registry.access.redhat.com/ubi9/nodejs-22:9.8
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - cd portal
    - npm ci --include=dev
  script:
    - npm test

# -----------------------------------------------------------------
# lab-validate: QEMU-runner substrate validation.
#
# Runs in a fresh Fedora VM spawned by the carmine GitLab Runner
# (Custom Executor; tag carmine,qemu). The VM has podman + docker
# bridge pre-baked. Inside the VM, lab/ci/validate.sh:
#
#   1. Generates per-run secrets
#   2. podman login to the GitLab registry
#   3. docker compose up the Topology B substrate
#   4. Waits for healthchecks
#   5. Runs lab/ci/smoke.sh — substrate sanity, apply-clients,
#      identity admin flow, recovery-gate semantics
#   6. Tears down (VM dies anyway, but be tidy)
#
# Sequence: gates the package + release stages. Build images first
# (stage: build), validate them in the lab (stage: lab-validate),
# then SBOM + release. CI-MR-PR feedback loop catches Ory-upgrade
# regressions + Renovate-bump breakage before tag.
#
# AUTH_VERSION resolves to $CI_COMMIT_SHA on push (image tagged with
# the SHA) or $CI_COMMIT_TAG on tag pipelines. Either way, the lab
# validates the just-built image set, not :latest.
#
# See lab/ci/README.md + docs/qemu-ci-lab.md.
# -----------------------------------------------------------------
lab-validate:
  stage: lab-validate
  tags: [carmine, qemu]
  needs:
    - build-consent
    - build-ldap-bridge
    - build-portal
    - build-util
  variables:
    LAB_DOMAIN: lab.dunn.dev
    AUTH_REGISTRY: "${CI_REGISTRY_IMAGE}"
    # Tag pipelines: use the v-tag. Non-tag: use SHA (matches what
    # container-image @2.5.0 publishes for non-tag pushes).
    AUTH_VERSION: "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  before_script:
    # The baser golden has podman + podman-docker. Verify here so
    # missing tools fail loudly at job start, not mid-compose.
    - podman --version
    - docker --version
    - jq --version || true
    - python3 --version
  script:
    - cd lab/ci
    - bash validate.sh
  artifacts:
    when: on_failure
    paths:
      - /tmp/lab-smoke-failure.log
      - /tmp/lab-healthcheck-failure.log
      - /tmp/apply-clients.log
    expire_in: 1 week
  rules:
    # Run on every push to main + on every MR + on every tag.
    # Renovate-MR bumps + Ory image bumps fire this loop.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
