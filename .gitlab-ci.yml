# dunn.dev/othala -- container build + release pipeline.
# build-othala publishes at the registry root.
# Tags run build, e2e, promote (sign and move :latest), sbom, release; promote,
# sbom and release wait on e2e. Pipelines exist for MRs, main, tags and web/api
# runs; a push to a feature branch with no open MR gets no pipeline.

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE =~ /^(web|api)$/
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

stages:
  - lint
  - verify
  - build
  - e2e
  - package
  - deploy
  - release
  - verdict
  - automerge-gate

include:
  - component: gitlab.com/dunn.dev/pipeline/reference-check@4.16.0
    inputs:
      reference_ref: v0.11.0

  # secret-verdict fails the pipeline on a detected secret; pin-audit on an
  # image pin Renovate cannot track.
  - component: gitlab.com/dunn.dev/pipeline/osv-verdict@4.16.0
  - component: gitlab.com/dunn.dev/pipeline/secret-verdict@4.16.0
    inputs:
      # Fake SMTP credentials on example.com, parser fixtures.
      excluded_paths: "portal/src/lib/contact.test.ts,portal/scripts/config.test.mjs,portal/scripts/admin-port.test.mjs"
  - component: gitlab.com/dunn.dev/pipeline/pin-audit@4.16.0
  - component: gitlab.com/dunn.dev/pipeline/automerge-gate@4.16.0
    inputs:
      stage: automerge-gate
      required-checks: "osv,secret"

  - component: gitlab.com/dunn.dev/pipeline/node-build@4.16.0
    inputs:
      stage: verify
      job_name: verify-othala
      package_path: portal


  # e2e-tester: prebaked Playwright image. The e2e inner VM cannot reach npm, so
  # deps are baked at build time. Test-only: no SBOM or release.
  - component: gitlab.com/dunn.dev/pipeline/container-image@4.16.0
    inputs:
      job_name: build-e2e-tester
      image_tag: e2e-tester
      containerfile: e2e/Containerfile
      context: e2e
      tag_pipeline: true
      sign_image: false

  # othala: context stays at the repo root because changing it needs a CI dance.
  - component: gitlab.com/dunn.dev/pipeline/container-image@4.16.0
    inputs:
      job_name: build-othala
      publish_at_root: true
      containerfile: portal/Containerfile
      context: .
      tag_pipeline: true
      promote_later: true

  # Signs the release image and moves :latest once e2e passes; the package
  # stage sits after e2e and before the release jobs.
  - component: gitlab.com/dunn.dev/pipeline/container-promote@4.16.0
    inputs:
      container_image_job: build-othala
      stage: package

  - component: gitlab.com/dunn.dev/pipeline/container-sbom@4.16.0
    inputs:
      job_name: sbom-othala
      container_image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      container_image_job: build-othala
      package_name: auth
      sbom_filename: othala-container.sbom.json

  # release-create expects binary_job; it points at the image build and the
  # dist/ slot stays empty.
  - component: gitlab.com/dunn.dev/pipeline/release-create@4.16.0
    inputs:
      package_name: auth
      release_title: "auth $CI_COMMIT_TAG"
      binary_job: build-othala
      sbom_job: sbom-othala
  - component: gitlab.com/dunn.dev/pipeline/github-release@4.16.0
    inputs:
      github_repo: andrewdunndev/othala

  # Docs site as a Cloudflare Worker (not GitLab Pages: dotted domains break LE).
  - component: gitlab.com/dunn.dev/pipeline/cloudflare-worker@4.16.0
    inputs:
      wrangler_config: site/wrangler.toml
      build_command: npx astro build
      output_dir: site/dist
      needs_npm_install: true
      npm_dir: site
      production_url: https://othala.dunn.dev

# Heavy chain: build-othala, build-e2e-tester, verify-othala, check-portal, e2e.
# Runs on every MR, on tags and on web/api runs; a main push skips it because the
# tag pipeline is the release gate.
.heavy-image-rules:
  - if: '$CI_COMMIT_TAG'
    variables:
      VERSION: $CI_COMMIT_TAG
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    variables:
      VERSION: $CI_COMMIT_SHORT_SHA
  - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
    variables:
      VERSION: $CI_COMMIT_SHORT_SHA

build-othala:
  rules: !reference [.heavy-image-rules]

build-e2e-tester:
  rules: !reference [.heavy-image-rules]

# Only a protected tag signs the image and moves :latest.
promote-image:
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'

# node-build never runs on tags (component rule); that stays.
verify-othala:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
# Installs the previous release, upgrades it per DEPLOY.md and checks identity, session and grant survive.
# GIT_DEPTH 0: it reads the release tags. Rules replace the e2e job's: it gates the release on tags, and
# on an MR it runs only where an upgrade could break (the deployment, the Ory configs, the upgrade steps and the
# harness and image they run on).
e2e-upgrade:
  extends: e2e
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        AUTH_VERSION: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - deploy/**/*
        - kratos/**/*
        - hydra/**/*
        - DEPLOY.md
        - e2e/upgrade.sh
        - e2e/smoke.sh
        - e2e/lib.sh
        - e2e/compose*.yml
        - .gitlab-ci.yml
        - portal/Containerfile
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
  script:
    - cd e2e
    - bash upgrade.sh

# promote, sbom and release wait on e2e. The components' own needs stop at the image
# build, so the jobs are extended here (needs arrays replace, not merge).
sbom-othala:
  needs: [build-othala, e2e]

create-release:
  needs:
    - job: build-othala
      artifacts: false
    - e2e
    - e2e-upgrade
    - promote-image

upload-release-assets:
  needs:
    - create-release
    - job: build-othala
      artifacts: true
    - job: sbom-othala
      artifacts: true
    - e2e
    - e2e-upgrade
    - promote-image

# check-purity: OSS purity and deprecated-name gate, plus a bash -n over tracked
# shell scripts (`just purity`). The jobs run the justfile's recipes, so the
# local and CI paths cannot drift; the ci image bakes node and just, and the
# justfile fails if its node major differs from mise.toml's.
check-purity:
  stage: verify
  image: registry.gitlab.com/dunn.dev/pipeline/ci:4.16.0@sha256:7f2f7c1c9fe4ec3a8f4a4c51b6c2eba0ff452de662e2ab4ef8a18d685ecc58d1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/'
    - if: '$CI_COMMIT_TAG'
  before_script:
    # Checkout uid differs from the job user; without this git ls-files exits 128.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - just purity

# check-portal: `just setup` (npm ci without install scripts in portal, e2e and
# site), then `just check`: astro check, tsc over e2e and site, vitest (src and
# scripts), the manifest lint, and a well-formedness parse of the tracked
# plain-YAML set.
check-portal:
  stage: verify
  image: registry.gitlab.com/dunn.dev/pipeline/ci:4.16.0@sha256:7f2f7c1c9fe4ec3a8f4a4c51b6c2eba0ff452de662e2ab4ef8a18d685ecc58d1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
    - if: '$CI_COMMIT_TAG'
  before_script:
    # Same safe.directory fix as check-purity.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - just setup
  script:
    - just check

# e2e: QEMU-runner harness, the release gate (e2e/README.md). validate.sh
# generates secrets, brings up the compose stack, waits for health, runs smoke.sh.
# AUTH_REGISTRY is the registry root; AUTH_VERSION is the tag or short sha, so
# the just-built image is validated, not :latest.
e2e:
  stage: e2e
  # Real runner labels selecting the QEMU executor; a fork needs both. The first
  # names one machine, so it is a project CI/CD variable with no default:
  # tags: ignores ${VAR:-fallback} and a literal would put a host name here.
  tags: ["$E2E_RUNNER_TAG", qemu]
  needs:
    - build-othala
    # Pulled by compose.e2e.yml's playwright + dance-runner services.
    - build-e2e-tester
  variables:
    AUTH_REGISTRY: "${CI_REGISTRY_IMAGE}"
    # GitLab variables ignore ${VAR:-default}; tag pipelines override in rules:.
    AUTH_VERSION: "$CI_COMMIT_SHORT_SHA"
  before_script:
    # Fail loudly at job start if a tool is missing.
    - podman --version
    - docker --version
    - jq --version || true
    - python3 --version
  script:
    - cd e2e
    - bash validate.sh
  artifacts:
      # Bind-mounted from the playwright container's /out.
    when: always
    paths:
      # Playwright report, screenshots and diagnostics.
      - e2e/browser-out
    expire_in: 1 week
  rules:
    # Same gate as the image builds it needs; source-keyed, not branch names.
    - if: '$CI_COMMIT_TAG'
      variables:
        AUTH_VERSION: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
