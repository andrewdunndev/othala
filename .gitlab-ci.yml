# dunn.dev/othala -- container build + release pipeline.
# build-othala publishes at the registry root; the production Caddyfile
# snippets live in dunn.dev/caddy-estate (caddy/snippets/ is a reference copy).
# Tags run build, e2e, sbom, release (sbom and release wait on e2e); main + Containerfile changes rebuild :short-sha.

default:
  interruptible: true

# Forces the image builds (e2e needs them). The components push :latest and
# sign only on the default branch or a tag; other builds push :short-sha alone.
variables:
  BUILD_CI_IMAGE: "true"

workflow:
  # One pipeline per commit: the MR pipeline wins over the push pipeline.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

stages:
  - lint
  - verify
  - build
  - e2e
  - package
  - deploy
  - release
  - verdict
  - automerge-gate

include:
  # Advisory until verified clean (fail_on_violation: false).
  - component: gitlab.com/dunn.dev/pipeline/reference-check@4.10.0
    inputs:
      reference_ref: v0.6.0
      fail_on_violation: false

  # secret-verdict fails the pipeline on a detected secret; pin-audit on an
  # image pin Renovate cannot track.
  - component: gitlab.com/dunn.dev/pipeline/osv-verdict@4.10.0
  - component: gitlab.com/dunn.dev/pipeline/secret-verdict@4.10.0
  - component: gitlab.com/dunn.dev/pipeline/pin-audit@4.10.0
  - component: gitlab.com/dunn.dev/pipeline/automerge-gate@4.10.0
    inputs:
      stage: automerge-gate
      required-checks: "osv,secret"

  - component: gitlab.com/dunn.dev/pipeline/node-build@4.10.0
    inputs:
      stage: verify
      job_name: verify-othala
      package_path: portal


  # e2e-tester: prebaked Playwright image. The e2e inner VM cannot reach npm, so
  # deps are baked at build time. Test-only: no SBOM or release.
  - component: gitlab.com/dunn.dev/pipeline/container-image@4.10.0
    inputs:
      job_name: build-e2e-tester
      image_tag: e2e-tester
      containerfile: e2e/Containerfile
      context: e2e
      tag_pipeline: true
      sign_image: false

  # othala: context stays at the repo root because changing it needs a CI dance.
  - component: gitlab.com/dunn.dev/pipeline/container-image@4.10.0
    inputs:
      job_name: build-othala
      publish_at_root: true
      containerfile: portal/Containerfile
      context: .
      tag_pipeline: true

  - component: gitlab.com/dunn.dev/pipeline/container-sbom@4.10.0
    inputs:
      job_name: sbom-othala
      container_image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      container_image_job: build-othala
      package_name: auth
      sbom_filename: othala-container.sbom.json

  # release-create expects binary_job; it points at the image build and the
  # dist/ slot stays empty.
  - component: gitlab.com/dunn.dev/pipeline/release-create@4.10.0
    inputs:
      package_name: auth
      release_title: "auth $CI_COMMIT_TAG"
      binary_job: build-othala
      sbom_job: sbom-othala

  # Docs site as a Cloudflare Worker (not GitLab Pages: dotted domains break LE).
  - component: gitlab.com/dunn.dev/pipeline/cloudflare-worker@4.10.0
    inputs:
      wrangler_config: site/wrangler.toml
      build_command: npx astro build
      output_dir: site/dist
      needs_npm_install: true
      npm_dir: site
      production_url: https://othala.dunn.dev


# sbom and release wait on e2e. The components' own needs stop at the image
# build, so the jobs are extended here (needs arrays replace, not merge).
sbom-othala:
  needs: [build-othala, e2e]

create-release:
  needs:
    - job: build-othala
      artifacts: false
    - e2e

upload-release-assets:
  needs:
    - create-release
    - job: build-othala
      artifacts: true
    - job: sbom-othala
      artifacts: true
    - e2e

# check-purity: OSS purity, deprecated, dated-debt and prose-budget gate, plus a
# bash -n over tracked shell scripts. The script names every check; the gate
# scans this file too, so a runner tag or comment naming a private host fails.
check-purity:
  stage: verify
  image: registry.access.redhat.com/ubi10/nodejs-24:10.2@sha256:80c87fe2b161979a961911c837efff1198bdd597c6dbe7d2e59bf1c60638188d
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    # Checkout uid differs from the job user; without this git ls-files exits 128.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - bash scripts/check-purity.sh
    - |
      echo "=== bash -n: tracked shell scripts ==="
      FILES=()
      while IFS= read -r -d '' f; do FILES+=("$f"); done < <(git ls-files -z -- '*.sh')
      if [ "${#FILES[@]}" -eq 0 ]; then
        echo "ERROR: 0 tracked .sh files — bash -n would check nothing"
        exit 1
      fi
      rc=0
      for f in "${FILES[@]}"; do
        bash -n "$f" || { echo "FAIL: bash -n $f"; rc=1; }
      done
      [ "$rc" -eq 0 ] && echo "OK: bash -n clean on ${#FILES[@]} scripts"
      exit $rc

# check-portal: npm ci (portal, e2e, site), then astro check, tsc over e2e and site, vitest (src and scripts), the manifest lint, and a
# well-formedness parse of the tracked plain-YAML set. kratos.yml and hydra.yml
# are  templates, so they are excluded.
check-portal:
  stage: verify
  image: registry.access.redhat.com/ubi10/nodejs-24:10.2@sha256:80c87fe2b161979a961911c837efff1198bdd597c6dbe7d2e59bf1c60638188d
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    # Same safe.directory fix as check-purity.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - cd portal
    - npm ci --include=dev
    - npm ci --include=dev --prefix ../e2e
    - npm ci --include=dev --prefix ../site
  script:
    - npm run check
    - node_modules/.bin/tsc --noEmit -p ../e2e
    - node_modules/.bin/tsc --noEmit -p ../site
    - npm test
    - npm run lint:manifests
    - |
      echo "=== YAML parse: tracked plain-YAML ==="
      FILES=()
      while IFS= read -r -d '' f; do FILES+=("../$f"); done < <(git -C .. ls-files -z -- .gitlab-ci.yml 'e2e/compose*.yml' 'e2e/manifests/*.yaml')
      if [ "${#FILES[@]}" -eq 0 ]; then
        echo "ERROR: 0 tracked plain-YAML files — nothing was parsed"
        exit 1
      fi
      node -e '
        const fs = require("fs");
        const YAML = require("yaml");
        const files = process.argv.slice(1);
        let bad = 0;
        for (const f of files) {
          try {
            const doc = YAML.parse(fs.readFileSync(f, "utf8"));
            const empty = doc === null || doc === undefined ||
              (typeof doc === "object" && !Array.isArray(doc) && Object.keys(doc).length === 0) ||
              (Array.isArray(doc) && doc.length === 0);
            if (empty) { console.error(`FAIL: ${f} parsed to an empty document`); bad = 1; }
          } catch (e) {
            console.error(`FAIL: ${f}: ${e.message}`);
            bad = 1;
          }
        }
        if (!bad) console.log(`OK: ${files.length} tracked YAML files parse to non-empty documents`);
        process.exit(bad);
      ' "${FILES[@]}"

# e2e: QEMU-runner harness, the release gate (e2e/README.md). validate.sh
# generates secrets, brings up the compose stack, waits for health, runs smoke.sh.
# AUTH_REGISTRY is the registry root; AUTH_VERSION is the tag or short sha, so
# the just-built image is validated, not :latest.
e2e:
  stage: e2e
  # Real runner labels selecting the QEMU executor; a fork needs both. The first
  # names one machine, so it is a project CI/CD variable with no default:
  # tags: ignores ${VAR:-fallback} and a literal would put a host name here.
  tags: ["$E2E_RUNNER_TAG", qemu]
  needs:
    - build-othala
    # Pulled by compose.yml's playwright + dance-runner services.
    - build-e2e-tester
  variables:
    AUTH_REGISTRY: "${CI_REGISTRY_IMAGE}"
    # GitLab variables ignore ${VAR:-default}; tag pipelines override in rules:.
    AUTH_VERSION: "$CI_COMMIT_SHORT_SHA"
  before_script:
    # Fail loudly at job start if a tool is missing.
    - podman --version
    - docker --version
    - jq --version || true
    - python3 --version
  script:
    - cd e2e
    - bash validate.sh
  artifacts:
      # Bind-mounted from the playwright container's /out.
    when: always
    paths:
      # Playwright report, screenshots and diagnostics.
      - e2e/browser-out
    expire_in: 1 week
  rules:
    # MR, main, tag, or RUN_E2E=true; source-keyed, not branch names.
    - if: '$CI_COMMIT_TAG'
      variables:
        AUTH_VERSION: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$RUN_E2E == "true"'
