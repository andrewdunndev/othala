# dunn.dev/othala -- container build + release pipeline.
#
# One custom image builds via the dunn.dev/pipeline container-image
# template:
#   - othala       the converged Astro Node SSR app, published at the
#                  registry root (registry.gitlab.com/dunn.dev/othala)
#                  via publish_at_root: true (the oryd/kratos-style
#                  namespace/name shape).
# caddy lives in the separate dunn.dev/caddy-estate repo; the
# production Caddyfile snippets live in the deploy repo's services/dag/.
#
# The legacy consent/ (Go) and util/ (Bash) modules were retired at the
# E1 cutover: their roles converged into the othala app. The LDAP bridge
# (glauth-kratos) has been extracted to a separate standalone repo:
# gitlab.com/dunn.dev/kratos-ldap. Its source no longer lives here.
#
# Per-image release flow on every tag:
#   build       container-image  ->  push :TAG + :latest + cosign sig
#   package     container-sbom   ->  syft scan, upload CycloneDX
#   release     release-create   ->  GitLab Release with SBOM links
#
# Container rebuilds also fire on main + Containerfile change
# (image tagged :short-sha + :latest); release stages are tag-only.

default:
  interruptible: true

workflow:
  # Prevent duplicate pipelines: when a branch has an open MR, suppress
  # the redundant push pipeline and let the merge_request_event pipeline
  # be the only pipeline for that commit. This fixes the 0-job
  # merge_request_event pipelines caused by GitLab spawning BOTH a push
  # pipeline and an MR-event pipeline for the same commit; without this
  # rule the MR-event pipeline was immediately failed (0 jobs, started_at
  # null) because the e2e job's `needs` reference jobs that have no
  # merge_request_event rules in the container-image component.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all

stages:
  - verify
  - build
  - e2e
  - package
  - deploy
  - release

include:
  # ----- Verify (push + MR): per-service build clean ---------------
  # Closes the Renovate-MR-without-CI gap. The catalog's node-build
  # component fires on every push and MR event.
  - component: gitlab.com/dunn.dev/pipeline/node-build@4.3.1
    inputs:
      stage: verify
      job_name: verify-othala
      package_path: portal


  # ----- e2e-tester (prebaked Playwright browser-test image) ------
  # The browser e2e leg runs inside the carmine inner VM, which can pull
  # container images from the registry but CANNOT reach the npm registry
  # (a runtime `npm install` there stalls and times out the gate, exit
  # 124). This image bakes the @playwright/test deps + the e2e specs into
  # a thin layer over the playwright base at BUILD time (npm ci against
  # e2e/package-lock.json, on the egress-capable build runner), so the
  # inner VM only PULLS it — no runtime npm install. compose.yml's
  # playwright + dance-runner services consume it as the
  # ${AUTH_REGISTRY}/e2e-tester sub-image. tag_pipeline: true keeps its
  # tag set (v-tag on tags, short-sha on main / BUILD_CI_IMAGE) in lockstep
  # with build-othala + build-e2e-tester, so AUTH_VERSION resolves the
  # same tag for both in the e2e job. No SBOM/release: this is a
  # test-only image, not a shipped artifact.
  - component: gitlab.com/dunn.dev/pipeline/container-image@4.3.1
    inputs:
      job_name: build-e2e-tester
      image_tag: e2e-tester
      containerfile: e2e/Containerfile
      context: e2e
      tag_pipeline: true
      sign_image: false

  # ----- othala (converged Astro Node SSR app) --------------------
  # Published at the registry ROOT (registry.gitlab.com/dunn.dev/othala)
  # via publish_at_root: true — the oryd/kratos-style namespace/name
  # shape. Mirrors dunn.dev/caddy-estate: publish_at_root: true, no
  # image_tag.
  #
  # Context is repo root (legacy from when build needed hydra/clients/;
  # v0.2.0 reads manifests at runtime, but context: . is kept stable
  # because the build is light and changing it requires a CI dance).
  - component: gitlab.com/dunn.dev/pipeline/container-image@4.3.1
    inputs:
      job_name: build-othala
      publish_at_root: true
      containerfile: portal/Containerfile
      context: .
      tag_pipeline: true

  - component: gitlab.com/dunn.dev/pipeline/container-sbom@4.3.1
    inputs:
      job_name: sbom-othala
      container_image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      container_image_job: build-othala
      package_name: auth
      sbom_filename: othala-container.sbom.json

  # ----- GitLab Release: link SBOMs from the built images -------
  # release-create is binary-shaped (expects binary_job + dist/
  # artifacts). We point binary_job at one container-image build
  # job so the needs: dependency resolves; the dist/ artifact slot
  # stays empty because container builds don't produce one. The
  # value is the GitLab Release record itself plus links to each
  # service's SBOM in the generic package registry.
  - component: gitlab.com/dunn.dev/pipeline/release-create@4.3.1
    inputs:
      package_name: auth
      release_title: "auth $CI_COMMIT_TAG"
      binary_job: build-othala
      sbom_job: sbom-othala

  # ----- Docs site: othala.dunn.dev (main + MR) ---------------------
  # Astro site under site/, styled by @dunn.dev/reference (see
  # site/.npmrc for the anonymous group-registry scope mapping).
  # Deployed as a Cloudflare Worker against site/wrangler.toml — NOT
  # GitLab Pages (dotted custom domains break Pages LE issuance).
  # Same group CI vars as reference.dunn.dev: CLOUDFLARE_API_TOKEN,
  # CLOUDFLARE_ACCOUNT_ID.
  - component: gitlab.com/dunn.dev/pipeline/cloudflare-worker@4.3.1
    inputs:
      wrangler_config: site/wrangler.toml
      build_command: npx astro build
      output_dir: site/dist
      needs_npm_install: true
      npm_dir: site
      production_url: https://othala.dunn.dev


# -----------------------------------------------------------------
# Standalone jobs (not catalog components).
#
# lint-identity-schema: schema-drift guard.
#
# Asserts that e2e/identity.schema.json and kratos/identity.schema.json
# are identical after JSON normalization (recursive key sort). Fails the
# pipeline on any divergence so a schema change in one copy cannot
# silently break the other.
#
# The passkey-first-login drift (recoveryEmail + passkey credential
# block) was reconciled at the feature merge — the schemas are in sync.
# The comparison runs in node because the ubi9/nodejs-22 image does not
# ship jq; the original jq form failed on "command not found", which
# masked the actual schema diff and read as drift.
# -----------------------------------------------------------------
lint-identity-schema:
  stage: verify
  image: registry.access.redhat.com/ubi9/nodejs-22:9.8@sha256:de0ec3cba702e28f2ea3c232e8e1b53aa0acee4d25f5acfb458afe22a7b66709
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      node -e '
        const fs = require("fs");
        const sort = (v) => Array.isArray(v) ? v.map(sort)
          : v && typeof v === "object"
            ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, sort(v[k])]))
            : v;
        const norm = (p) => JSON.stringify(sort(JSON.parse(fs.readFileSync(p, "utf8"))), null, 2);
        const a = norm("e2e/identity.schema.json");
        const b = norm("kratos/identity.schema.json");
        if (a !== b) {
          console.error("ERROR: e2e/identity.schema.json and kratos/identity.schema.json have diverged.");
          console.error("Reconcile by copying kratos/identity.schema.json to e2e/identity.schema.json");
          console.error("and verifying the e2e test fixtures still match the updated schema.");
          process.exit(1);
        }
        console.log("OK: identity schemas are in sync.");
      '

# -----------------------------------------------------------------
# lint-jsonnet-hooks: webhook jsonnet drift + existence guard.
#
# The Kratos recovery-gate and login-gate webhooks are defined in
# kratos/hooks/. The e2e harness mounts those files DIRECTLY into the
# kratos container (../kratos/hooks/*.jsonnet — see e2e/compose.yml).
# There is NO separate e2e copy of login-gate.jsonnet; the sole
# separate copy is e2e/recovery-gate.jsonnet (a structural mirror kept
# for the e2e harness's own reference).
#
# This job does two things:
#   1. Diffs e2e/recovery-gate.jsonnet vs kratos/hooks/recovery-gate.jsonnet
#      (byte-for-byte after stripping comments), failing on any divergence
#      so the lab copy cannot silently drift from the production hook.
#      Comments are stripped with a node one-liner (no jsonnet binary
#      needed; the image ships nodejs-22). The diff compares the function
#      body only — comment updates are intentionally allowed without
#      triggering a false alarm, so we normalize by removing // lines.
#   2. Asserts that both kratos/hooks/recovery-gate.jsonnet and
#      kratos/hooks/login-gate.jsonnet exist and are non-empty, so a
#      rename or deletion cannot silently remove the gate.
#
# Runs in the same UBI9 nodejs-22 image as lint-identity-schema (matching
# its toolchain: node available, jq may be absent). No jsonnet binary
# required — existence + comment-stripped diff is enough for the invariant.
# -----------------------------------------------------------------
lint-jsonnet-hooks:
  stage: verify
  image: registry.access.redhat.com/ubi9/nodejs-22:9.8@sha256:de0ec3cba702e28f2ea3c232e8e1b53aa0acee4d25f5acfb458afe22a7b66709
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      # 1. Assert the recovery-gate file exists and is non-empty.
      # (login-gate.jsonnet was RETIRED in ADR 08 — the after.code login
      # interrupt is superseded by required_aal: aal2 on /admin.)
      for f in kratos/hooks/recovery-gate.jsonnet; do
        if [ ! -s "$f" ]; then
          echo "ERROR: $f missing or empty — gate webhook file must exist."
          exit 1
        fi
        echo "OK: $f exists and is non-empty."
      done

      # 2. Diff e2e/recovery-gate.jsonnet vs kratos/hooks/recovery-gate.jsonnet.
      # Strip single-line comments (// ...) before diffing so comment-only
      # changes in the header don't trigger a false alarm. The function body
      # (the actual payload shape) must be identical between the two copies.
      strip_comments() {
        node -e "
          const fs = require('fs');
          const txt = fs.readFileSync(process.argv[1], 'utf8');
          // Remove // comment lines and blank lines, then trim whitespace.
          const stripped = txt
            .split('\n')
            .filter(l => !l.trim().startsWith('//') && l.trim() !== '')
            .join('\n');
          process.stdout.write(stripped);
        " "$1"
      }

      A=$(strip_comments e2e/recovery-gate.jsonnet)
      B=$(strip_comments kratos/hooks/recovery-gate.jsonnet)

      if [ "$A" != "$B" ]; then
        echo "ERROR: e2e/recovery-gate.jsonnet and kratos/hooks/recovery-gate.jsonnet have diverged."
        echo "--- e2e/recovery-gate.jsonnet (stripped) ---"
        echo "$A"
        echo "--- kratos/hooks/recovery-gate.jsonnet (stripped) ---"
        echo "$B"
        echo "Reconcile by updating e2e/recovery-gate.jsonnet to match the production hook body."
        exit 1
      fi
      echo "OK: recovery-gate.jsonnet function bodies are in sync."

# -----------------------------------------------------------------
# check-purity: OSS purity + no-deprecated + dated-debt detection gate.
#
# Runs scripts/check-purity.sh against the repo tree to detect instance-
# specific strings (dunn.dev in configs/tests/docs), references to deleted
# commands (dag-apply-clients, dag-sync-manifests), lingering DORMANT/
# (pending) markers, and intentional-failure stubs. No npm deps needed —
# pure bash + grep.
# -----------------------------------------------------------------
check-purity:
  stage: verify
  image: registry.access.redhat.com/ubi9/nodejs-22:9.8@sha256:de0ec3cba702e28f2ea3c232e8e1b53aa0acee4d25f5acfb458afe22a7b66709
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
  script:
    - bash scripts/check-purity.sh

# -----------------------------------------------------------------
# test-portal: v0.2.0 portal test suite. Runs `npm test` which
# invokes node --test against scripts/*.test.mjs. Covers:
#   - manifests-loader.test.mjs (YAML namespace split + parsing)
#   - apps-collection.test.mjs  (Content Collection frontmatter shape)
#   - csrf.test.mjs             (HIGH-1 CSRF token semantics)
#   - admin-recovery-gate.test.mjs (HIGH-3 admin-recovery refusal)
#
# Separate from verify-portal (catalog node-build, which runs
# `npm run build`) because tests gate the change BEFORE the build
# step. Catches Renovate-bumped breakage at the test layer.
# -----------------------------------------------------------------
test-portal:
  stage: verify
  image: registry.access.redhat.com/ubi9/nodejs-22:9.8@sha256:de0ec3cba702e28f2ea3c232e8e1b53aa0acee4d25f5acfb458afe22a7b66709
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - cd portal
    - npm ci --include=dev
  script:
    - npm test

# -----------------------------------------------------------------
# check-portal: the standing QUALITY GATE.
#
# Closes the "no standing linter" caveat: `astro check`
# (type + content checks across the .astro/.ts tree) was previously NOT
# gated in CI, so type drift could merge silently. This job runs it on
# every push + MR + tag, alongside the portal test suite — together they
# are the portal quality gate: `npm run check` is the type/lint half,
# test-portal's `npm test` is the behavioral half.
#
# Same shape as test-portal (ubi9 nodejs-22, cd portal, npm ci) so the
# two jobs share one mental model. `npm test` is run here too so the gate
# is self-contained as a single quality checkpoint; it is cheap (node
# --test over scripts/*.test.mjs) and the redundancy with test-portal is
# intentional belt-and-suspenders, not a mistake. astro check fails the
# job only on type ERRORS; the current tree's residual hints (the
# "handful of type hints" the caveat names) do not fail it.
# -----------------------------------------------------------------
check-portal:
  stage: verify
  image: registry.access.redhat.com/ubi9/nodejs-22:9.8@sha256:de0ec3cba702e28f2ea3c232e8e1b53aa0acee4d25f5acfb458afe22a7b66709
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - cd portal
    - npm ci --include=dev
  script:
    - npm run check
    - npm test

# -----------------------------------------------------------------
# e2e: QEMU-runner end-to-end harness.
#
# The project's canonical OSS-facing "stand Othala up on compose"
# example (e2e/README.md), run here as the release gate. Executes in a
# fresh Fedora VM spawned by the carmine GitLab Runner (Custom Executor;
# tag carmine,qemu). The VM has podman + docker bridge pre-baked. Inside
# the VM, e2e/validate.sh:
#
#   1. Generates per-run secrets
#   2. podman login to the GitLab registry
#   3. docker compose up the converged substrate (postgres, kratos,
#      hydra, the othala app — consent + util are folded into the othala
#      app, no separate containers)
#   4. Waits for healthchecks
#   5. Runs e2e/smoke.sh — substrate sanity, in-app client registration,
#      identity admin flow, recovery-gate semantics (the converged app's
#      /oauth2/* public challenge handlers + /admin/* loopback endpoints)
#   6. Tears down (VM dies anyway, but be tidy)
#
# Sequence: gates the package + release stages. Build images first
# (stage: build), validate them end-to-end (stage: e2e), then SBOM +
# release. The CI/MR feedback loop catches Ory-upgrade regressions +
# Renovate-bump breakage before tag.
#
# AUTH_REGISTRY=${CI_REGISTRY_IMAGE} is the registry ROOT — the converged
# othala app image itself (publish_at_root: true). AUTH_VERSION resolves
# to $CI_COMMIT_TAG on tag pipelines or $CI_COMMIT_SHORT_SHA on push —
# either way the harness validates the just-built image, not :latest.
# The LDAP bridge is now the standalone gitlab.com/dunn.dev/kratos-ldap
# project; e2e/compose.yml no longer pulls it.
#
# See e2e/README.md + docs/qemu-ci-lab.md.
# -----------------------------------------------------------------
e2e:
  stage: e2e
  # NOTE: requires a carmine-tagged QEMU runner; forks without one will see this job pending. See docs/qemu-ci-lab.md.
  tags: [carmine, qemu]
  needs:
    - build-othala
    # Prebaked browser-test image — pulled by compose.yml's playwright +
    # dance-runner services. Same VERSION tag as the app image above.
    - build-e2e-tester
  variables:
    AUTH_REGISTRY: "${CI_REGISTRY_IMAGE}"
    # Default to the commit short-SHA (what container-image @2.5.1 publishes
    # for non-tag / BUILD_CI_IMAGE builds). GitLab variables: do NOT honor
    # bash ${VAR:-default}, so tag pipelines override AUTH_VERSION in rules:.
    AUTH_VERSION: "$CI_COMMIT_SHORT_SHA"
  before_script:
    # The baser golden has podman + podman-docker. Verify here so
    # missing tools fail loudly at job start, not mid-compose.
    - podman --version
    - docker --version
    - jq --version || true
    - python3 --version
  script:
    - cd e2e
    - bash validate.sh
  artifacts:
    when: on_failure
    paths:
      - /tmp/lab-smoke-failure.log
      - /tmp/lab-healthcheck-failure.log
      - /tmp/apply-clients.log
    expire_in: 1 week
  rules:
    # Run on every tag + on-demand (BUILD_CI_IMAGE below). Plain main
    # pushes and merge_request_event are intentionally absent: the
    # container-image component jobs that populate `needs` (build-othala,
    # build-ldap-bridge, build-e2e-tester) fire on main only when their
    # Containerfile changes — and e2e needs ALL THREE images at the same
    # short-sha tag. Any rule that puts e2e into a pipeline where those
    # builds are absent makes GitLab fail the whole pipeline at creation
    # (0 jobs, unresolvable needs) — that kept main red 2026-06-05→06-10.
    # Renovate-bump verification is covered by verify-* and
    # test-/check-portal; full-substrate e2e gates tags (all builds fire
    # via tag_pipeline) and the BUILD_CI_IMAGE pre-tag path.
    # Tag pipelines pull the v-tag image — override the SHA default above.
    # (GitLab variables: do NOT honor bash ${VAR:-default}, so tag pipelines
    # override AUTH_VERSION in rules:.)
    - if: '$CI_COMMIT_TAG'
      variables:
        AUTH_VERSION: "$CI_COMMIT_TAG"
    # On-demand pre-tag validation: a branch pipeline triggered with
    # BUILD_CI_IMAGE=true builds the images (container-image @2.5.1 honors
    # the same flag — see its rule 3) and runs e2e against them. Lets us
    # validate the converged substrate on the carmine runner BEFORE cutting
    # a tag or merging to main. The builds publish :<short-sha>, which the
    # AUTH_VERSION default ($CI_COMMIT_SHORT_SHA) matches.
    - if: '$BUILD_CI_IMAGE == "true"'
