# Observe — observe.dunn.dev (ClickStack / HyperDX: logs, traces, metrics).
#
# Forward-auth gated, NOT OIDC: HyperDX OSS has no native OIDC/SSO (local
# accounts only; SSO is an upstream contribution opportunity). So dag SSO
# gates at the edge — observe-caddy does forward_auth → the portal's
# /api/forward-auth?group=access-observe endpoint. Only identities in the
# access-observe group may enter; HyperDX keeps its own local account behind
# the gate (no header→user mapping until that lands upstream).
#
# This manifest is presentation-only (no oidc/consent block): it renders the
# tile and makes `access-observe` a known, assignable access group (Edit page
# "App access"). access_group MUST equal access-<filename-slug> = access-observe.
presentation:
  name: Observe
  description: Logs, traces, and metrics for the estate — the ClickStack/HyperDX observability surface.
  url: https://observe.dunn.dev
  icon: OB
  icon_slug: hyperdx
  auth_kind: forward_auth
  access_group: access-observe
  order: 900
