# GitLab — forge.dunn.dev
#
# Self-managed GitLab supports OIDC back-channel logout via the OmniAuth
# OpenID Connect strategy from v15.4+. The endpoint accepts standard
# logout tokens at /users/auth/openid_connect/logout.

oidc:
  client_id: forge
  client_name: GitLab
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://forge.dunn.dev/users/auth/openid_connect/callback
  post_logout_redirect_uris:
    - https://forge.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://forge.dunn.dev
  skip_consent: true
  backchannel_logout_uri: https://forge.dunn.dev/users/auth/openid_connect/logout

# Consent claim shape for this client.
#
# Self-managed GitLab OmniAuth OpenID Connect reads:
#   groups_attribute  (where to find groups in the id_token; we use `groups`)
#   required_groups   (must be a member to sign in)
#   admin_groups      (member -> instance admin)
#   external_groups   (member -> marked external)
# All accept string arrays of group names. JIT user creation is on by
# default for the OmniAuth provider.
#
# Per-project Maintainer/Developer/etc roles are assigned inside GitLab
# and not driven by claims.
#
# App config (set in gitlab.rb / values.yml on the forge side):
#   gitlab_rails['omniauth_providers'] = [{
#     name: "openid_connect",
#     args: {
#       ...
#       client_options: { gitlab: {
#         groups_attribute: "groups",
#         required_groups:  ["forge-user"],
#         admin_groups:     ["forge-admin"],
#         external_groups:  ["forge-external"]
#       }}
#     }
#   }]
#
# Source: https://docs.gitlab.com/administration/auth/oidc/
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Instance admin: settings, runners, all projects."
      claim_emit:
        groups: ["forge-admin", "forge-user"]
    user:
      description: "Member: own projects, contribute to shared ones."
      claim_emit:
        groups: ["forge-user"]
    external:
      description: "External user: read-only on public, no internal access."
      claim_emit:
        groups: ["forge-user", "forge-external"]
  group_role_map:
    admin: admin
    family: user
    friends: external
    kids: user
