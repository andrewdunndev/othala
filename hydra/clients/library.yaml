# BookLore — library.dunn.dev
#
# BookLore OIDC support is minimal (reads preferred_username, email,
# name only). Back-channel logout is not implemented in the upstream
# auth code as of v0.x. Logout falls back to admin session revoke +
# BookLore's own session expiry. Track upstream and add when supported.

oidc:
  client_id: library
  client_name: BookLore
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://library.dunn.dev/api/auth/oidc/callback
  post_logout_redirect_uris:
    - https://library.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://library.dunn.dev
  skip_consent: true
  # backchannel_logout_uri: not implemented by BookLore upstream.

# Consent claim shape for this client.
#
# BookLore reads `preferred_username`, `email`, and `name` claims at
# login. There is no upstream group-claim or role-claim mapping; admin
# is set inside BookLore itself ("only administrators can register new
# users" and the admin flag is local). OIDC users get an `OIDC` badge;
# the role granted is "regular user" with library/permission controls
# disabled for any locally-marked admin. JIT user creation requires an
# administrator to enable it; left at default (manual provisioning) for
# now.
#
# Per-library ACLs are managed inside BookLore. The consent service
# still emits a `groups` claim for symmetry; BookLore ignores it today.
#
# Source: https://booklore.org/docs/tools/user-management
# Authelia integration profile: https://www.authelia.com/integration/openid-connect/clients/booklore/
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Local admin set inside BookLore. Not driven by claims."
      claim_emit:
        groups: ["admin"]
    user:
      description: "Read books in libraries the local admin granted."
      claim_emit:
        groups: ["family"]
  group_role_map:
    admin: admin
    family: user
    friends: user
    kids: user
