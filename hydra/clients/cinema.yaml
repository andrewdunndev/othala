# Jellyfin — cinema.dunn.dev
#
# OIDC back-channel logout support for the Jellyfin SSO plugin
# (jellyfin-plugin-sso) is plugin-dependent. As of plugin v3.x,
# RP-initiated front-channel logout is supported but back-channel is
# not implemented. Leave the URI absent until upstream lands it; logout
# falls back to admin session revoke + Jellyfin's own access-token
# expiry.
#
# Native clients (Apple TV / Infuse) use the LDAP path via the
# glauth-kratos bridge co-located in the Jellyfin pod, not this OIDC
# client. LDAP bind expiry is governed by the bridge's session model.

oidc:
  client_id: cinema
  client_name: Jellyfin
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://cinema.dunn.dev/sso/OID/redirect/dunn
  post_logout_redirect_uris:
    - https://cinema.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://cinema.dunn.dev
  skip_consent: true
  # backchannel_logout_uri: not implemented by jellyfin-plugin-sso v3.x.
  # Track upstream and add when supported.

# Consent claim shape for this client.
#
# Jellyfin's primary auth surface is LDAP (the bridge translates
# memberOf into Jellyfin policies). The OIDC path here is for browser
# logins via the Jellyfin SSO Authentication plugin (jellyfin-plugin-sso).
# That plugin reads role memberships from a configurable role claim;
# names below align with the LDAP-side memberOf so the same identity
# group resolves consistently across both paths.
#
# Per-resource ACLs (which library, which folder) are managed inside
# Jellyfin and not driven by claims.
#
# Plugin source: https://github.com/9p4/jellyfin-plugin-sso
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Server admin: users, libraries, plugins."
      claim_emit:
        groups: ["jellyfin-admin"]
    user:
      description: "Watch and track progress."
      claim_emit:
        groups: ["jellyfin-user"]
  group_role_map:
    admin: admin
    family: user
    friends: user
    kids: user
