client_name: Tailscale
client_id: tailscale
grant_types:
  - authorization_code
  - refresh_token
response_types:
  - code
scope: openid email profile
redirect_uris:
  - https://login.tailscale.com/a/oauth_response
post_logout_redirect_uris:
  - https://home.dunn.dev/
token_endpoint_auth_method: client_secret_basic
skip_consent: true
# Tailscale does NOT use PKCE; ensure hydra.yml has pkce.enforced=false.
# Tailscale tries client_secret_basic first, then client_secret_post.
# Both work with Hydra defaults.
#
# WebFinger response for *@dunn.dev addresses lives at
# home.dunn.dev/.well-known/webfinger as a static JSON file.
