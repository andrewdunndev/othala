# oCIS / ownCloud — vault.dunn.dev
#
# oCIS proxy implements OIDC back-channel logout per the proxy service
# documentation; the logout token is accepted at the standard signin
# path with the back-channel logout content type.

oidc:
  client_id: vault
  client_name: oCIS
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://vault.dunn.dev/oidc-callback
    - https://vault.dunn.dev/oidc-silent-redirect
  post_logout_redirect_uris:
    - https://vault.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://vault.dunn.dev
  skip_consent: true
  backchannel_logout_uri: https://vault.dunn.dev/signin/v1/oidc-backchannel-logout

# Consent claim shape for this client.
#
# oCIS proxy supports OIDC role assignment when
# PROXY_ROLE_ASSIGNMENT_DRIVER=oidc. PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
# names the claim (default `roles`); proxy.yaml maps claim values to
# oCIS roles. Default mapping: ocisAdmin->admin, ocisSpaceAdmin->
# spaceadmin, ocisUser->user, ocisGuest->guest. Group membership for
# space sharing comes from PROXY_AUTOPROVISION_CLAIM_GROUPS (default
# `groups`) as a list of group names.
#
# Four roles, all surfaced. Per-space ACLs are managed inside oCIS.
#
# Source: https://doc.owncloud.com/ocis/next/deployment/services/s-list/proxy.html
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Full instance admin."
      claim_emit:
        roles: ["ocisAdmin"]
        groups: ["admin"]
    spaceadmin:
      description: "Manage spaces and quotas without instance admin."
      claim_emit:
        roles: ["ocisSpaceAdmin"]
        groups: ["family"]
    user:
      description: "Personal space and shared spaces."
      claim_emit:
        roles: ["ocisUser"]
        groups: ["family"]
    guest:
      description: "Receive shares only. Not used today."
      claim_emit:
        roles: ["ocisGuest"]
        groups: ["friends"]
  group_role_map:
    admin: admin
    family: user
    friends: guest
    kids: user
