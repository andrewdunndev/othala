client_name: oCIS
client_id: vault
grant_types:
  - authorization_code
  - refresh_token
response_types:
  - code
scope: openid email profile groups offline_access
redirect_uris:
  - https://vault.dunn.dev/oidc-callback
  - https://vault.dunn.dev/oidc-silent-redirect
post_logout_redirect_uris:
  - https://vault.dunn.dev/
token_endpoint_auth_method: client_secret_basic
skip_consent: true
audience:
  - https://vault.dunn.dev
