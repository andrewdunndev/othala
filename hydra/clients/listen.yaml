# Audiobookshelf — listen.dunn.dev
#
# Audiobookshelf v2.7+ added OIDC back-channel logout support; the app
# accepts a logout token at /auth/openid/logout. Older versions ignore
# it (logout falls back to per-app cookie expiry).

oidc:
  client_id: listen
  client_name: Audiobookshelf
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://listen.dunn.dev/auth/openid/callback
    - https://listen.dunn.dev/auth/openid/mobile-redirect
  post_logout_redirect_uris:
    - https://listen.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://listen.dunn.dev
  skip_consent: true
  backchannel_logout_uri: https://listen.dunn.dev/auth/openid/logout

# Consent claim shape for this client.
#
# Audiobookshelf reads the configurable Group Claim (default `groups`)
# and matches against the hardcoded role names `admin`, `user`, `guest`.
# Names are not customizable on the app side as of upstream v2.x
# (issue #2878 tracks adding configurable names). To map our identity
# groups onto its expectations, the consent service emits literal
# strings `admin` or `user` here. Auto Register provisions new accounts
# with the matched role; advanced per-permission claims via
# Advanced Permissions Claim are out of scope.
#
# The hardcoded role names collide with the identity-token vocabulary
# (`admin`, `user`); Audiobookshelf only validates id_tokens with
# audience https://listen.dunn.dev, so the collision stays scoped to
# this client. The audience invariant in
# portal/src/lib/register-clients.ts's validateClients catches a missing
# aud.
#
# Source: https://www.audiobookshelf.org/guides/oidc_authentication/
# Hardcoded role names: https://github.com/advplyr/audiobookshelf/issues/2878
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Library admin: manage libraries, users, scans."
      claim_emit:
        groups: ["admin"]
    user:
      description: "Listen, track progress, manage own bookmarks."
      claim_emit:
        groups: ["user"]
    guest:
      description: "Browse only, no progress tracking. Not used today."
      claim_emit:
        groups: ["guest"]
  group_role_map:
    admin: admin
    family: user
    friends: user
    kids: user
