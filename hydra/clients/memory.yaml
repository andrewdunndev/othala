# Immich — memory.dunn.dev
#
# Immich supports OIDC back-channel logout via /api/oauth/logout
# (added v1.117+); the server handles the logout token and clears the
# user's local session. Mobile sessions (app.immich:/) propagate via
# the next API call returning 401, then the app re-runs the OIDC flow.

oidc:
  client_id: memory
  client_name: Immich
  grant_types:
    - authorization_code
    - refresh_token
  response_types:
    - code
  scope: openid email profile groups offline_access
  redirect_uris:
    - https://memory.dunn.dev/auth/login
    - app.immich:/
  post_logout_redirect_uris:
    - https://memory.dunn.dev/
  token_endpoint_auth_method: client_secret_basic
  audience:
    - https://memory.dunn.dev
  skip_consent: true
  backchannel_logout_uri: https://memory.dunn.dev/api/oauth/logout

# Consent claim shape for this client.
#
# Immich uses a configurable Role Claim (default `immich_role`) that
# must evaluate to the literal string `user` or `admin`. There is no
# groups-based mapping in upstream Immich and the role claim is read
# only at user creation; it does not re-sync on subsequent logins. JIT
# auto-register is on by default.
#
# Album and partner sharing are per-resource ACLs maintained inside
# Immich and not driven by claims.
#
# Source: https://docs.immich.app/administration/oauth/
consent:
  emit_groups_claim: true
  roles:
    admin:
      description: "Server admin: users, jobs, settings."
      claim_emit:
        immich_role: "admin"
        groups: ["admin"]
    user:
      description: "Upload, browse, share own library."
      claim_emit:
        immich_role: "user"
        groups: ["family"]
  group_role_map:
    admin: admin
    family: user
    friends: user
    kids: user
