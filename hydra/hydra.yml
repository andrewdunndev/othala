# Hydra configuration — dunn.dev family OAuth2/OIDC IDP
#
# DSN host is env-substituted so the same file lands in both topologies.
# Lab compose sets HYDRA_PG_HOST=postgres (compose service name); iac
# quadlets set HYDRA_PG_HOST=auth-postgres (container name on auth.network).

dsn: postgres://hydra:${HYDRA_PG_PASS}@${HYDRA_PG_HOST}:5432/hydra?sslmode=disable

serve:
  public:
    port: 4444
    cors:
      enabled: true
      allowed_origins:
        - ${OTHALA_PUBLIC_URL}
      # Trim to the methods OIDC/OAuth2 actually requires; DELETE and PUT
      # have no place on the public token/discovery endpoints.
      allowed_methods: [GET, POST]
      allowed_headers:
        - Authorization
        - Content-Type
      allow_credentials: true
  admin:
    port: 4445
    # Admin-plane bind address. The admin API is unauthenticated by design
    # (Ory's model: the network IS the control), so segmented deployments
    # bind it to an address only the admin-plane network can reach.
    # Single-network deployments (the e2e harness) use 0.0.0.0.
    # NEVER expose publicly.
    host: ${HYDRA_ADMIN_BIND_HOST}

urls:
  self:
    issuer: ${OTHALA_PUBLIC_URL}/
    public: ${OTHALA_PUBLIC_URL}/

  # Topology B (v0.2.0): the entire SSO stack lives on ${OTHALA_PUBLIC_URL}.
  # Hydra redirects OAuth2 challenge flows to ${OTHALA_PUBLIC_URL}/oauth2/{login,
  # consent,logout} — the converged Astro API routes that handle the Hydra
  # challenge protocol. /auth/{login,logout} remain as the Kratos browser-flow
  # human UI (self-service), which is a separate concern. The old consent
  # service at /consent (Go, consent:4477) is deleted; all challenge handling
  # is now in the portal (portal:8080).
  #
  # NOTE: the production Caddyfile is iac/services/dag/caddy/Caddyfile. It
  # already routes the @portal_challenges path set (/oauth2/login,
  # /oauth2/consent, /oauth2/logout) to dag-portal:8080 before the wider
  # @hydra /oauth2/* wildcard. No stale caddy/snippets/portal.caddy exists;
  # that file was removed when the Go consent service was retired.
  login: ${OTHALA_PUBLIC_URL}/oauth2/login
  consent: ${OTHALA_PUBLIC_URL}/oauth2/consent
  logout: ${OTHALA_PUBLIC_URL}/oauth2/logout
  error: ${OTHALA_PUBLIC_URL}/auth/error
  post_logout_redirect: ${OTHALA_PUBLIC_URL}/

oidc:
  subject_identifiers:
    supported_types:
      - public
    pairwise:
      # Required by config schema even when pairwise is unused
      salt: ${HYDRA_PAIRWISE_SALT}

ttl:
  access_token: 1h
  refresh_token: 720h    # 30 days
  id_token: 1h
  auth_code: 10m
  # Narrowed from 1h: a stolen challenge redirect is usable for the full
  # window; 30m cuts the stolen-challenge exposure in half with no UX cost
  # (users are unlikely to leave a browser tab open that long mid-login).
  login_consent_request: 30m

oauth2:
  pkce:
    enforced: false                    # Tailscale doesn't do PKCE; Hydra
                                       # has no per-client PKCE knob, so the
                                       # global stays off for it.
    enforced_for_public_clients: true  # Free hardening: nothing is a public
                                       # client today (all confidential), so
                                       # this is a no-op now but blocks a
                                       # future silent PKCE skip if a public
                                       # client is ever added.
  hashers:
    bcrypt:
      # Raised from 10: cost 14 (~700ms on modern hardware) meaningfully
      # raises the bar for offline brute-force of stolen client-secret hashes.
      cost: 14
  # NOTE: an explicit `oauth2.strategies` pin (access_token=opaque, scope=exact)
  # was tried here but Hydra v26.2.0's schema rejects it (additionalProperties
  # "strategies" not allowed) and the IdP refuses to boot — caught by the live
  # e2e stand-up. Both values are already the Hydra defaults (the live OIDC
  # dance confirms correct scope/token behaviour), so we rely on them rather
  # than gamble on an unverified key location. Revisit if a supported pin
  # surfaces upstream.
  expose_internal_errors: false
  client_credentials:
    default_grant_allowed_scope: false
  grant:
    jwt:
      max_ttl: 720h
      iat_optional: false
      jti_optional: false

secrets:
  # CRITICAL: secrets.system is non-rotatable for the life of the Hydra DB.
  # Generate once, store in sops as carmine.hydra_system_secret. Never
  # change without rebuilding the database. Rotation procedure in
  # docs/runbooks/secrets-rotation.md.
  system:
    - ${HYDRA_SYSTEM_SECRET}

  # Single active cookie secret. hydra v26.2.0 enforces uniqueItems; rotate
  # by prepending a distinct entry, restart, then drop the old one once
  # sessions signed under it have expired (mirror of the Kratos shape, one
  # shared runbook: docs/runbooks/cookie-rotation.md).
  cookie:
    - ${HYDRA_COOKIE_SECRET_CURRENT}

log:
  level: info
  format: json
  leak_sensitive_values: false
