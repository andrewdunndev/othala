# Hydra configuration: generic Othala instance template, ${VAR}-substituted by
# scripts/render-config.sh. HYDRA_PG_HOST is the compose service name in the lab and the
# container name in production.

dsn: "postgres://hydra:${HYDRA_PG_PASS}@${HYDRA_PG_HOST}:5432/hydra?sslmode=disable"
# HYDRA_PG_PASS must be URL-safe (percent-encoded): YAML quoting cannot fix a URL.

serve:
  public:
    request_log:
      # Health probes target this listener (see serve.admin.request_log); each would write
      # an access-log line, burying real ones. Metrics still count them.
      disable_for_health: true
    cors:
      enabled: true
      # Extensible allowlist: browser-fetching SPA clients need an entry each, redirect-flow
      # clients never do. OTHALA_CORS_ALLOWED_ORIGINS is comma-separated and UNQUOTED on purpose:
      # render-config.sh escapes quotes on the assumption every token sits in a double-quoted
      # scalar, which would corrupt this flow sequence.
      allowed_origins: [${OTHALA_CORS_ALLOWED_ORIGINS}]
      # Only the methods OIDC/OAuth2 requires.
      allowed_methods: [GET, POST]
      allowed_headers:
        - Authorization
        - Content-Type
  admin:
    # Admin-plane bind address. The admin API is unauthenticated by design (the network is the
    # control): segmented deployments bind an admin-plane address, the e2e harness uses 0.0.0.0.
    # NEVER expose publicly.
    host: "${HYDRA_ADMIN_BIND_HOST}"
    request_log:
      # Silences /admin/metrics/prometheus but never a health probe (Hydra rewrites admin
      # paths to /admin/... before matching /health/*); probe the public listener instead.
      disable_for_health: true

urls:
  self:
    issuer: "${OTHALA_PUBLIC_URL}/"

  # Hydra redirects challenge flows to /oauth2/{login,consent,logout} (portal routes; /auth/*
  # stays the Kratos UI). The proxy must route these to the portal BEFORE any wider /oauth2/*
  # rule, or every OAuth2 flow dead-ends.
  login: "${OTHALA_PUBLIC_URL}/oauth2/login"
  consent: "${OTHALA_PUBLIC_URL}/oauth2/consent"
  logout: "${OTHALA_PUBLIC_URL}/oauth2/logout"
  error: "${OTHALA_PUBLIC_URL}/auth/error"
  post_logout_redirect: "${OTHALA_PUBLIC_URL}/"

ttl:
  refresh_token: 720h    # 30 days

oauth2:
  pkce:
    # Global switch (no per-client PKCE knob): breaks any confidential client that cannot do PKCE.
    enforced: false
    # Free hardening while there are no public clients.
    enforced_for_public_clients: true
  hashers:
    bcrypt:
      # 14 (default 10): raises the offline brute-force cost of a leaked client-secret hash.
      cost: 14
  # An explicit oauth2.strategies pin is schema-rejected by Hydra v26.2.0; defaults are correct.
  client_credentials:
    default_grant_allowed_scope: false

secrets:
  # CRITICAL: secrets.system is non-rotatable for the life of the Hydra DB. Generate once and
  # store in sops as <host>.hydra_system_secret (docs/runbooks/secrets-rotation.md).
  system:
    - "${HYDRA_SYSTEM_SECRET}"

  # Single active cookie secret (v26.2.0 enforces uniqueItems); rotation: docs/runbooks/cookie-rotation.md.
  cookie:
    - "${HYDRA_COOKIE_SECRET_CURRENT}"

log:
  format: json

# Tracing (OpenTelemetry), opt-in: the block below is OMITTED when OTHALA_OTLP_PROVIDER is empty
# (Ory v26.2.0 rejects a present block with provider "") and emitted when it is "otel".
# OTLP is HTTP/protobuf only, Ory ignores OTEL_* env vars, insecure: true is
# plaintext to the firewall-scoped host alloy receiver, sampling_ratio 0.1 bounds volume.
#@if OTHALA_OTLP_PROVIDER
tracing:
  service_name: hydra
  deployment_environment: ${OTHALA_OTLP_ENVIRONMENT}
  provider: ${OTHALA_OTLP_PROVIDER}     # "otel" when enabled (deploy)
  providers:
    otlp:
      server_url: ${OTHALA_OTLP_ENDPOINT}   # host:port, HTTP — host alloy OTLP receiver
      insecure: true                         # plaintext to the host alloy receiver
      sampling:
        sampling_ratio: 0.1
#@endif
