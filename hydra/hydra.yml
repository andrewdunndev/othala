# Hydra configuration — dunn.dev family OAuth2/OIDC IDP
#
# DSN host is env-substituted so the same file lands in both topologies.
# Lab compose sets HYDRA_PG_HOST=postgres (compose service name); iac
# quadlets set HYDRA_PG_HOST=auth-postgres (container name on auth.network).

dsn: postgres://hydra:${HYDRA_PG_PASS}@${HYDRA_PG_HOST}:5432/hydra?sslmode=disable

serve:
  public:
    port: 4444
    cors:
      enabled: true
      allowed_origins:
        - https://auth.dunn.dev
      allowed_methods: [GET, POST, PUT, DELETE]
      allowed_headers:
        - Authorization
        - Content-Type
      allow_credentials: true
  admin:
    port: 4445
    # Admin port is internal-only on the carmine pod network.
    # Reachable from the consent service co-located on carmine.
    # NEVER expose publicly.

urls:
  self:
    issuer: https://auth.dunn.dev/
    public: https://auth.dunn.dev/

  # Topology B (v0.1.4): the entire SSO stack lives on auth.dunn.dev.
  # Hydra redirects authentication-required flows to auth.dunn.dev/auth/*
  # where the Astro portal renders login/recovery/etc., and the consent
  # service handles /login with login_challenge via the same Caddy mux.
  # home.dunn.dev was the Topology A user-facing host; dropped in v0.1.4
  # because the IdP + the UI live on the same FQDN now. The portal's
  # tile dashboard renders at auth.dunn.dev/ for signed-in family members.
  login: https://auth.dunn.dev/auth/login
  consent: https://auth.dunn.dev/auth/consent
  logout: https://auth.dunn.dev/auth/logout
  error: https://auth.dunn.dev/auth/error
  post_logout_redirect: https://auth.dunn.dev/

oidc:
  subject_identifiers:
    supported_types:
      - public
    pairwise:
      # Required by config schema even when pairwise is unused
      salt: ${HYDRA_PAIRWISE_SALT}

ttl:
  access_token: 1h
  refresh_token: 720h    # 30 days
  id_token: 1h
  auth_code: 10m
  login_consent_request: 1h

oauth2:
  pkce:
    enforced: false                    # Tailscale doesn't do PKCE
    enforced_for_public_clients: false
  hashers:
    bcrypt:
      cost: 10
  expose_internal_errors: false
  client_credentials:
    default_grant_allowed_scope: false
  grant:
    jwt:
      max_ttl: 720h
      iat_optional: false
      jti_optional: false

secrets:
  # CRITICAL: secrets.system is non-rotatable for the life of the Hydra DB.
  # Generate once, store in sops as carmine.hydra_system_secret. Never
  # change without rebuilding the database. Rotation procedure in
  # docs/runbooks/secrets-rotation.md.
  system:
    - ${HYDRA_SYSTEM_SECRET}

  # Cookie secret with current/previous slot pattern. See
  # docs/runbooks/cookie-rotation.md for the rotation procedure. Mirror
  # of the Kratos shape so both services share one runbook.
  cookie:
    - ${HYDRA_COOKIE_SECRET_CURRENT}
    - ${HYDRA_COOKIE_SECRET_PREVIOUS}

log:
  level: info
  format: json
  leak_sensitive_values: false
