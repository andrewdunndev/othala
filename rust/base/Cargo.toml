[package]
name = "base"
description = "Shared vocabulary for the identity primitives: time, entropy, secrets, digests, strict base64url and the store-effect contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
std = []
rand_core = ["dep:rand_core"]
serde = ["dep:serde"]
# the one secret read; a crate that enables it names its reading modules in gates.json (R-j)
expose = []

[dependencies]
base64ct.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true
rand_core = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
trybuild.workspace = true
testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true
rand.workspace = true
getrandom.workspace = true

[lints]
workspace = true
