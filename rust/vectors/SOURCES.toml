licence = "MIT OR Apache-2.0 (our own derived data; seeds from the RFCs, IETF Trust)"
feeds = ["factor"]
notes = "Derived by tools/derive_factor.py (deterministic) from the specs only (ruling R-b); it first recomputes every upstream RFC 4226 and RFC 6238 value. totp.json: skew none and one, two-step misses, replay of the same, an older and a future-stored step (Replayed, the contract's RFC 6238 5.2 MUST), step boundaries, 6-digit zero padding and malformed codes; op totp with the field names of rfc6238/totp.json, plus `step` on success. hotp.json: look-ahead edges, a used counter, and E.4 two-value resynchronization (ops hotp_verify, hotp_resync). Supersedes the derived- cases inside rfc6238/totp.json for new rows."
