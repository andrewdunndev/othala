[source."webauthn-rp-derived-ext"]
url = "https://www.w3.org/TR/webauthn-3/"
revision = "https://www.w3.org/TR/2026/REC-webauthn-3-20260825/ (spec html sha256 157030c980d44a3ce4b1ec5bcfaa16790c7dfefac20709af6ed2b11c7120970b) sections 5.1, 5.1.8-5.1.10, 5.11, 6.1, 7.1, 7.2, 8.2-8.4, 10.1, 13.1; RFC 5280 4.1, 4.2.1; RFC 9052/9053 COSE; RFC 8032; RFC 6979 (deterministic ECDSA); TPM 2.0 Part 2 (TPMT_PUBLIC, TPMS_ATTEST)"
retrieved = "2026-11-26"
licence = "MIT OR Apache-2.0 (our own derived data)"
feeds = ["webauthn-rp"]
notes = "Derived by tools/derive_webauthn_ext.py (deterministic; tools/webauthn_ext_lib.py is its pure-Python ECDSA, RSA, DER and X.509 code) from the specs only (ruling R-b), for the families the webauthn-rp CONTRACT cites as oracle-pending. Every key is derived from a label when the script runs, so no private key is committed or written to a vector; tools/check_webauthn_ext.mjs re-verifies with Node crypto and a small DER reader every certificate; every chains.json outcome (Anchored needs each link's issuer name byte for byte equal to the next certificate's subject and every signature, validity, CA rule and anchor to hold; Unanchored needs all of those but the anchor; AttestationInvalid needs at least one name, signature, CA-rule or validity fault; the SHA-1, SHA-512 and P-521 chains pass every one of those checks and are Unanchored by policy alone); every assertion signature; every attestation.json x5c chain link by link (issuer name against subject, then signature) and to its anchor; each statement signature, and the TPM extraData and attested name (R94); a case whose id names a signature, extraData or name fault carries that fault and no other case does. Ops are named by the reader they exercise: cose_key, attestation_object, origin_parse, rp_id_parse, app_id_parse, x5c_walk, trust_anchor_from_der, webauthn_assert, webauthn_register (policy and fixture fields in each file's `source`), creation_options_json, request_options_json, related_origins_json, signal_json, registration_response_json, authentication_response_json, plus bound ops in limits.json. In cose, attestation-object, authentication, browser-binding, registration-ids, origins and limits every refusal states expect.kind (and expect.step as above; attestation-object cites 7.1 step 13 in each refusal's text because contract R40 does), unless its case carries `unbuilt`, the item that builds its reader; in the other files expect.kind is set only for TooLarge, and for Malformed where contract R132 keeps it apart from TooLarge. Oracle choices (each is a SHOULD of the oracle, not of a spec): an anchor's expiry is checked like any certificate (chains.json anchor-expired; RFC 5280 6.1 does not check a trust anchor's validity); the challenge is the first 32 bytes the Entropy yields; excludeCredentials and allowCredentials are always emitted, empty when none, while hints and attestationFormats are emitted only when set; MIN_RSA_BITS is taken as 2048; the empty credential lists of options JSON are emitted; packed AAGUID and serial-number extensions and the AIK subject rules follow L3 8.2.1 and 8.3.1 literally; an android-key list policy is the field key_enforcement (tee default, any_list); trust_policy require_trusted refuses an unanchored statement; MAX_RSA_BITS is a bound in bits (excess 1 is TooLarge).\nReshaped for the secret scan: effect.ceremony_row is the SHA-256 of the challenge entropy, not the entropy itself.\nReshaped for the secret scan: the Android APK key hash is the low-entropy pattern AZaz09-_ repeated, 43 symbols ending in A, so it covers the base64url alphabet and is a canonical encoding of 32 bytes.\nMAX_RECORD has no TooLarge case and no exact at-bound case: the webauthn-rp CONTRACT does not fix what the ceremony row keeps, so a largeBlob write of any size need not make the row larger, and a repeated-byte blob compresses; limits.json holds only a largeBlob write of MAX_RECORD/2 bytes, accepted (carries blob_len and no excess). Oracle choice, a disclosed gap (R15, R142): that case reads the ceremony row as keeping the blob at no more than its length plus a fixed overhead. A case can be added once the webauthn-rp CONTRACT states that the authentication row keeps the largeBlob write bytes.\nReshaped for the secret scan: response JSON cases carry the document as real JSON text in input_text, not as a structured member."
