[source."webauthn-rp-derived-ext"]
url = "https://www.w3.org/TR/webauthn-3/"
revision = "https://www.w3.org/TR/2026/REC-webauthn-3-20260825/ (spec html sha256 157030c980d44a3ce4b1ec5bcfaa16790c7dfefac20709af6ed2b11c7120970b) sections 5.1.7-5.1.10, 5.11, 6.1, 7.1, 7.2, 8.2-8.4, 10.1, 13.1; RFC 5280 4.1, 4.2.1; RFC 9052/9053 COSE; RFC 8032; RFC 6979 (deterministic ECDSA); TPM 2.0 Part 2 (TPMT_PUBLIC, TPMS_ATTEST)"
retrieved = "2026-11-26"
licence = "MIT OR Apache-2.0 (our own derived data)"
feeds = ["webauthn-rp"]
notes = "Derived by tools/derive_webauthn_ext.py (deterministic; tools/webauthn_ext_lib.py is its pure-Python ECDSA, RSA, DER and X.509 code) from the specs only (ruling R-b), for the families the webauthn-rp CONTRACT cites as oracle-pending. Every key is derived from a label when the script runs, so no private key is committed or written to a vector; tools/check_webauthn_ext.mjs re-verifies with Node crypto every certificate, every chains.json outcome (the SHA-1, SHA-512 and P-521 chains verify and are Unanchored by policy), every assertion signature, every attestation.json x5c chain link by link and to its anchor, each statement signature, and the TPM extraData and attested name (R94); a case whose id names a signature, extraData or name fault carries that fault and no other case does. Ops are named by the reader they exercise: cose_key, attestation_object, origin_parse, rp_id_parse, app_id_parse, x5c_walk, trust_anchor_from_der, webauthn_assert, webauthn_register (policy and fixture fields in each file's `source`), creation_options_json, request_options_json, related_origins_json, signal_json, registration_response_json, authentication_response_json, plus bound ops in limits.json. expect.kind is set only for TooLarge, and for Malformed where contract R132 keeps it apart from TooLarge. Oracle choices (each is a SHOULD of the oracle, not of a spec): an anchor's expiry is checked like any certificate (chains.json anchor-expired; RFC 5280 6.1 does not check a trust anchor's validity); the challenge is the first 32 bytes the Entropy yields; excludeCredentials and allowCredentials are always emitted, empty when none, while hints and attestationFormats are emitted only when set; MIN_RSA_BITS is taken as 2048; the empty credential lists of options JSON are emitted; packed AAGUID and serial-number extensions and the AIK subject rules follow L3 8.2.1 and 8.3.1 literally; an android-key list policy is the field key_enforcement (tee default, any_list); trust_policy require_trusted refuses an unanchored statement; MAX_RSA_BITS is a bound in bits (excess 1 is TooLarge).\nReshaped for the secret scan: effect.ceremony_row is the SHA-256 of the challenge entropy, not the entropy itself.\nReshaped for the secret scan: the Android APK key hash is the low-entropy pattern AZaz09-_ repeated to 43 symbols, which covers the base64url alphabet.\nReshaped for the secret scan: response JSON cases carry the document as real JSON text in input_text, not as a structured member."
