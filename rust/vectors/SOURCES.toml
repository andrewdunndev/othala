[source."webauthn-rp-derived"]
url = "https://www.w3.org/TR/webauthn-3/"
revision = "https://www.w3.org/TR/2026/REC-webauthn-3-20260825/ (spec html sha256 157030c980d44a3ce4b1ec5bcfaa16790c7dfefac20709af6ed2b11c7120970b) sections 6.1, 6.5, 7.1, 7.2, 8.7; RFC 8949 3, 4.2.1, 5.6; CTAP2 canonical CBOR; RFC 6979 A.2.5 key"
retrieved = "2026-11-26"
licence = "MIT OR Apache-2.0 (our own derived data)"
feeds = ["webauthn-rp"]
notes = "Derived by tools/derive_webauthn.py (deterministic) from the specs only (ruling R-b). Step numbers are L3 7.1 and 7.2 as numbered in the pinned dated HTML. Assertions (op webauthn_assert, the field names of the exam-spike file plus policy fields) and registrations (op webauthn_register, none attestation) use the RFC 6979 A.2.5 P-256 key with RFC 6979 deterministic signatures; the script checks the key and the A.2.5 sample signature first, and Node crypto verified all 40 assertion signatures, so every refusal is for the rule the case names. cbor.json: hand-written inputs per RFC 8949 and CTAP2 canonical form (op cbor_decode) plus two parametric bounds of contract rule 5.7 (op cbor_limit, webauthn_rp::MAX_CBOR_DEPTH and webauthn_rp::MAX_CBOR_ITEMS, TooLarge). Every refusal states expect.kind, and expect.step when its spec text cites a step of 7.1 or 7.2 (the number is read from that text). exam-spike-refusals.json holds the kind and step of each refusal of the carried exam-spike file, keyed by case id. Oracle choices: cross-origin deny-by-default (contract), a topOrigin without crossOrigin refused, BE change refused (7.2 step 19 applies because Assertion::backup() feeds RP policy)."
cases = 85
files = [
