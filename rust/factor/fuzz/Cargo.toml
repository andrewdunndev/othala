[package]
name = "factor-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
factor = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "record_decode"
path = "fuzz_targets/record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "otp_code_parse"
path = "fuzz_targets/otp_code_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "phc_parse"
path = "fuzz_targets/phc_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recovery_code_parse"
path = "fuzz_targets/recovery_code_parse.rs"
test = false
doc = false
bench = false

# its own workspace, so the root's `members = ["*"]` never reaches it
[workspace]
