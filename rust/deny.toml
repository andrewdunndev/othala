[graph]
targets = ["x86_64-unknown-linux-musl", "wasm32-unknown-unknown", "aarch64-apple-darwin"]

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
exceptions = [{ name = "subtle", allow = ["BSD-3-Clause"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow = [
  { name = "block-buffer" }, { name = "cfg-if" }, { name = "const-oid" }, { name = "cpufeatures" }, { name = "crypto-common" },
  { name = "digest" }, { name = "hybrid-array" }, { name = "itoa" }, { name = "libc" }, { name = "memchr" },
  { name = "serde_core" }, { name = "serde_json" }, { name = "sha2" }, { name = "typenum" }, { name = "zmij" },
  { name = "serde" }, { name = "serde_derive" }, { name = "syn" }, { name = "quote" }, { name = "proc-macro2" }, { name = "unicode-ident" },
  { name = "autocfg" }, { name = "base16ct" }, { name = "cmov" }, { name = "cpubits" }, { name = "crypto-bigint" }, { name = "ctutils" },
  { name = "der" }, { name = "ecdsa" }, { name = "elliptic-curve" }, { name = "ff" }, { name = "group" }, { name = "hmac" },
  { name = "num-traits" }, { name = "p256" }, { name = "primefield" }, { name = "primeorder" }, { name = "rand_core" }, { name = "rfc6979" },
  { name = "sec1" }, { name = "signature" }, { name = "subtle" }, { name = "wnaf" }, { name = "zeroize" },
  { name = "crypto-primes" }, { name = "rsa" },
  { name = "argon2" }, { name = "base64ct" }, { name = "blake2" }, { name = "password-hash" }, { name = "phc" }, { name = "sha1" },
  { name = "wire" }, { name = "jose" }, { name = "authn" }, { name = "othala-core" }, { name = "surface" }, { name = "host" }, { name = "vectors" },
]
