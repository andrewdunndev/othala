[graph]
targets = ["x86_64-unknown-linux-musl", "wasm32-unknown-unknown", "aarch64-apple-darwin"]

[advisories]
version = 2

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
exceptions = [
    { name = "subtle", allow = ["BSD-3-Clause"] },
    { name = "curve25519-dalek", allow = ["BSD-3-Clause"] },
    { name = "ed25519-dalek", allow = ["BSD-3-Clause"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# der_derive and curve25519-dalek-derive still build on syn 2; serde_derive is on syn 3
skip = [{ crate = "syn@2", reason = "proc-macro only, until der_derive and curve25519-dalek-derive move to syn 3" }]
# keep this table last: `just deny` appends allow from each member's name and its gates.json allow list
