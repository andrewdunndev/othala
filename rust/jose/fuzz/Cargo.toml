[package]
name = "jose-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
base = { path = "../../base" }
jose = { path = ".." }
libfuzzer-sys = "0.4"
serde = { version = "1", default-features = false }

[[bin]]
name = "jws_parse"
path = "fuzz_targets/jws_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwt_claims"
path = "fuzz_targets/jwt_claims.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwe_parse"
path = "fuzz_targets/jwe_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwk_decode"
path = "fuzz_targets/jwk_decode.rs"
test = false
doc = false
bench = false

# its own workspace, so the root's `members = ["*"]` never reaches it
[workspace]
