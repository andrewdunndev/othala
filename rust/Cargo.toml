[workspace]
resolver = "3"
members = ["base", "store", "testkit", "wipe"]
exclude = ["base/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
base = { path = "base", version = "0.0.0" }
store = { path = "store", version = "0.0.0" }
testkit = { path = "testkit", version = "0.0.0" }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false }
trybuild = "1.0.110"
rand_chacha = { version = "0.10", default-features = false }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
rand = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"
unreachable_pub = "forbid"
renamed_and_removed_lints = "forbid"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
indexing_slicing = "forbid"
as_conversions = "forbid"
print_stdout = "forbid"
dbg_macro = "forbid"
disallowed_methods = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
