# Paths outside a crate's graph need allow-invalid; `just canary` proves each one fires in every published crate.
disallowed-methods = [
  { path = "core::option::Option::unwrap", reason = "return the error; this lint reaches inside macro bodies, unwrap_used does not" },
  { path = "core::option::Option::expect", reason = "return the error; this lint reaches inside macro bodies, expect_used does not" },
  { path = "core::result::Result::unwrap", reason = "return the error; this lint reaches inside macro bodies, unwrap_used does not" },
  { path = "core::result::Result::expect", reason = "return the error; this lint reaches inside macro bodies, expect_used does not" },
  { path = "core::result::Result::unwrap_err", reason = "match the result; this lint reaches inside macro bodies, unwrap_used does not" },
  { path = "core::result::Result::expect_err", reason = "match the result; this lint reaches inside macro bodies, expect_used does not" },
  { path = "std::time::SystemTime::now", reason = "take UnixTime as an argument; only the shells read the OS clock" },
  { path = "std::time::SystemTime::elapsed", reason = "take UnixTime as an argument; only the shells read the OS clock" },
  { path = "std::time::Instant::now", reason = "take UnixTime as an argument; only the shells read the OS clock" },
  { path = "std::time::Instant::elapsed", reason = "take UnixTime as an argument; only the shells read the OS clock" },
  { path = "std::hash::RandomState::new", reason = "take &mut impl Entropy; only the shells read OS randomness" },
  { path = "rand::random", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "rand::random_iter", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "rand::random_range", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "rand::random_bool", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "rand::random_ratio", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "rand::fill", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "rand::rng", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "rand::make_rng", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "getrandom::fill", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "getrandom::fill_uninit", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "getrandom::u32", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "getrandom::u64", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "std::net::TcpStream::connect", reason = "sockets belong to the shells" },
  { path = "std::net::TcpListener::bind", reason = "sockets belong to the shells" },
  { path = "std::net::UdpSocket::bind", reason = "sockets belong to the shells" },
  { path = "std::fs::read", reason = "files belong to the shells" },
  { path = "std::fs::read_to_string", reason = "files belong to the shells" },
  { path = "std::fs::write", reason = "files belong to the shells" },
  { path = "std::fs::File::open", reason = "files belong to the shells" },
  { path = "std::fs::File::create", reason = "files belong to the shells" },
  { path = "std::fs::OpenOptions::open", reason = "files belong to the shells" },
  { path = "std::fs::read_dir", reason = "files belong to the shells" },
  { path = "std::fs::remove_file", reason = "files belong to the shells" },
  { path = "std::fs::remove_dir_all", reason = "files belong to the shells" },
  { path = "std::fs::create_dir_all", reason = "files belong to the shells" },
  { path = "std::fs::rename", reason = "files belong to the shells" },
  { path = "std::fs::copy", reason = "files belong to the shells" },
  { path = "base::Effect::host_applied", reason = "the one Receipt mint; only the store member", allow-invalid = true },
]
disallowed-macros = [
  { path = "core::panic", reason = "return the error; this lint reaches inside macro bodies, panic does not" },
  { path = "std::panic", reason = "return the error; this lint reaches inside macro bodies, panic does not" },
  { path = "core::unreachable", reason = "return the error, or make the state unrepresentable" },
  { path = "core::todo", reason = "nothing unfinished ships" },
  { path = "core::unimplemented", reason = "nothing unfinished ships" },
  { path = "std::print", reason = "output belongs to the shells; this lint reaches inside macro bodies, print_stdout does not" },
  { path = "std::println", reason = "output belongs to the shells; this lint reaches inside macro bodies, print_stdout does not" },
  { path = "std::eprint", reason = "output belongs to the shells" },
  { path = "std::eprintln", reason = "output belongs to the shells" },
  { path = "std::dbg", reason = "output belongs to the shells; this lint reaches inside macro bodies, dbg_macro does not" },
]
disallowed-types = [
  { path = "serde_json::Value", reason = "typed records only; Value belongs in wire-decoding modules", allow-invalid = true },
  { path = "rand::rngs::ThreadRng", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
  { path = "getrandom::SysRng", reason = "take &mut impl Entropy; only the shells read OS randomness", allow-invalid = true },
]
allow-indexing-slicing-in-tests = true
